<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffd93d">
  <title>Eat — 今天吃什么？</title>
  <meta name="description" content="在附近餐厅里随机给出三个不同方向，减少选择困难。">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./styles.css?v=20260910-concise-ui">
  <link rel="stylesheet" href="./effects.css?v=20260906-mascot2">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>今天吃什么？</h1>
      <p>选一下条件，然后直接给你 3 家。尽量不同菜系，不做排行榜。</p>
    </header>

    <section class="panel scope-panel" aria-label="当前可用区域">
      <div>
        <h2>TOKYO · 地区1️⃣</h2>
      </div>
      <span class="scope-distance">1.2 km</span>
    </section>

    <section class="panel filter-module" data-filter-module="food">
      <h2>今天不想吃什么？</h2>
      <div class="chips" id="rejects"></div>
      <p class="note">点选要排除的菜系。</p>
    </section>

    <section class="panel filter-module" data-filter-module="budget">
      <h2>大概预算</h2>
      <div class="chips">
        <button class="chip active" data-budget="all">不限</button>
        <button class="chip" data-budget="under1000">¥999以下</button>
        <button class="chip" data-budget="1000">¥1,000–1,999</button>
        <button class="chip" data-budget="2000">¥2,000–3,999</button>
        <button class="chip" data-budget="4000">¥4,000以上</button>
      </div>
    </section>

    <section class="panel filter-module" data-filter-module="distance">
      <h2>期望距离</h2>
      <div class="chips">
        <button class="chip" data-distance="300">300m内</button>
        <button class="chip" data-distance="500">500m内</button>
        <button class="chip" data-distance="800">800m内</button>
        <button class="chip active" data-distance="1200">1.2km内</button>
      </div>
    </section>

    <div class="generate-wrap">
      <img class="generate-mascot" id="generate-mascot" src="./image/YahaUsagi.webp" alt="" aria-hidden="true">
      <button class="generate" id="generate">🎲 随机给我 3 家</button>
    </div>

    <section class="results" id="results" aria-live="polite">
      <div class="panel empty">设置条件后生成三个候选。</div>
    </section>

    <section class="dataset-stats">
      <div id="stats">正在读取数据库…</div>
    </section>

    <footer class="footer">
      <p>资料可能变化，出发前请向店铺确认。</p>
      <p>Powered by <a href="https://webservice.recruit.co.jp/">ホットペッパーグルメ Webサービス</a> · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>（ODbL）</p>
      <p><a href="./privacy.html">隐私说明</a> · <a href="./terms.html">使用条款</a></p>
    </footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./data/production_area1.js?v=20260907-strictgoogle1"></script>
  <script src="./data/google_inventory_runtime.js?v=20260907-inventory2804-detail2"></script>
  <script src="./data/source_provenance.js?v=20260907-strictgoogle1"></script>
  <script src="./data/source_facts.js?v=20260907-strictgoogle1"></script>
  <script src="./data/hotpepper_rich_metadata.js?v=20260907-strictgoogle1"></script>
  <script src="./app.js?v=20260910-concise-ui"></script>
  <script src="./effects.js?v=20260906-voice3"></script>
</body>
</html>
