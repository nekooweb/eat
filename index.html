<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffd93d"><title>Eat — 今天吃什么？</title><meta name="description" content="轻量随机餐厅选择器"><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><header class="hero"><h1>今天吃什么？</h1><p>不纠结。筛一下，然后随机给你三个完全不同的方向。</p></header><section class="panel"><h2>① 选择区域档案</h2><div class="segmented"><button class="choice active" data-profile="TOKYO">TOKYO</button><button class="choice" data-profile="SHIZUOKA">SHIZUOKA · TBD</button></div></section><section class="panel" id="area-panel"><h2>② 今天在哪个地区？</h2><div class="segmented"><button class="choice active" data-area="地区1️⃣">地区1️⃣</button><button class="choice" data-area="地区2️⃣">地区2️⃣</button></div></section><section class="panel"><h2>③ 今天不想吃什么？</h2><div class="chips" id="rejects"></div><p class="note">选中的菜系会被排除。</p></section><section class="panel"><h2>④ 大概预算</h2><div class="chips"><button class="chip active" data-budget="all">不限</button><button class="chip" data-budget="under1000">¥999以下</button><button class="chip" data-budget="1000">¥1,000–1,999</button><button class="chip" data-budget="2000">¥2,000–3,999</button><button class="chip" data-budget="4000">¥4,000以上</button></div><p class="note">午晚餐价格不同的店会按当前时间优先采用相应区间。</p></section><button class="generate" id="generate">🎲 随机给我 3 家</button><section class="results" id="results"><div class="panel empty">选择条件后生成 3 个不同菜系的提案。</div></section><footer class="footer">营业信息来自静态整理数据；临时休业请以 Google Maps / 店铺公告为准。</footer></main><script src="./data/restaurants.js"></script><script src="./data/area1_bulk.js"></script><script src="./app.js"></script></body></html>
