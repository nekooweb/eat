name: Audit featured template gaps

on:
  push:
    branches:
      - auto-featured-template-propagation
    paths:
      - 'scripts/audit_featured_template_gaps.mjs'
      - '.github/workflows/audit-featured-template-gaps.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical data and audit reusable templates
        run: |
          set -o pipefail
          node scripts/build_production_dataset.mjs
          node scripts/audit_featured_template_gaps.mjs | tee featured-template-gaps.json
      - uses: actions/upload-artifact@v4
        with:
          name: featured-template-gap-audit
          path: featured-template-gaps.json
          retention-days: 3
