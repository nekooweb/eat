name: Repair final review evidence text gate v2

on:
  push:
    branches: [final-dish-integration-20260915]
    paths: ['.github/workflows/final-review-safety-repair-v2.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-dish-integration-20260915
          fetch-depth: 0
      - name: Add source-native containment gate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/finalize_official_retained_reviews.py')
          s=p.read_text()
          anchor='            if not native or not text:\n                continue\n'
          replacement=(
              '            if not native or not text:\n'
              '                continue\n'
              '            if re.sub(r"\\s+", "", native) not in re.sub(r"\\s+", "", text):\n'
              '                continue\n'
          )
          if anchor not in s:
              raise SystemExit('native/evidence-text gate anchor missing')
          p.write_text(s.replace(anchor,replacement,1))
          PY
          python -m py_compile scripts/finalize_official_retained_reviews.py
          git add scripts/finalize_official_retained_reviews.py
          git diff --cached --check
          git commit -m 'fix: require native dish text in reviewed evidence'
          git push origin HEAD:final-dish-integration-20260915
