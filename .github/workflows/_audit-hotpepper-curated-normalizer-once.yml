name: One-shot curated Hot Pepper recommendation normalizer audit

on:
  push:
    branches:
      - main
    paths:
      - _ops/run-hotpepper-curated-normalizer-audit-once-2026-09-08.txt

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce zero-paid policy and syntax
        run: |
          set -euo pipefail
          node scripts/audit_no_paid_apis.mjs
          node --check scripts/hotpepper_explicit_recommendation_normalizer.mjs
          node --check scripts/collect_hotpepper_explicit_recommendation_normalization_evidence.mjs
      - name: Run full audit-only curated normalization pass
        env:
          HOTPEPPER_EXPLICIT_CONCURRENCY: '8'
          HOTPEPPER_EXPLICIT_TIMEOUT_MS: '8000'
          HOTPEPPER_EXPLICIT_LIMIT: '0'
        run: |
          set -euo pipefail
          node scripts/collect_hotpepper_explicit_recommendation_normalization_evidence.mjs \
            _audit/hotpepper_curated_recommendation_evidence.json | tee /tmp/hotpepper-curated-normalizer.log
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('_audit/hotpepper_curated_recommendation_evidence.json', 'utf8'));
          const p = x.policy || {};
          if (p.paidGoogleDataApiCalls !== 0 || p.hotPepperWebServiceApiCalls !== 0) throw new Error('curated pass must remain zero-paid/API-free');
          if (p.rootIdentityRevalidationRequired !== true || p.foodPageIdentityRevalidationRequired !== true || p.guessedMenuPathsAllowed !== false) throw new Error('identity/menu scope mismatch');
          if (p.genericPageTextAllowed !== false || p.courseOrDrinkInferenceAllowed !== false || p.cuisineNameBrandInferenceAllowed !== false || p.automaticTranslationOutsideCuratedRulesAllowed !== false) throw new Error('semantic boundary mismatch');
          const failures = [];
          for (const row of x.rows || []) {
            for (const item of row.recommendedDishes || []) {
              if (item.provider !== 'Hot Pepper' || item.evidenceClass !== 'source_recommendation_text') failures.push(['class', row.googlePlaceId, item]);
              if (!String(item.evidenceRule || '').startsWith('hotpepper-explicit-recommended-h3:normalized-')) failures.push(['rule', row.googlePlaceId, item]);
              if (!/^https:\/\/www\.hotpepper\.jp\/strJ\d+\/(?:food|menu)\/?/i.test(item.sourceUrl || '')) failures.push(['url', row.googlePlaceId, item]);
              if (!item.nameJa || !item.nameZh || !item.evidenceSnippet) failures.push(['fields', row.googlePlaceId, item]);
            }
          }
          if (failures.length) throw new Error(`curated Hot Pepper contract failures: ${JSON.stringify(failures.slice(0,5))}`);
          console.log(JSON.stringify({summary:x.summary, sample:x.rows.slice(0,100)}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: hotpepper-curated-recommendation-normalizer-audit
          path: _audit/hotpepper_curated_recommendation_evidence.json
          if-no-files-found: error
