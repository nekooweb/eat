name: E2E DISH S1 integration

on:
  push:
    branches:
      - agent-e2e-dish-s1-20260914

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[s1-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S1 branch
        uses: actions/checkout@v4
        with:
          ref: agent-e2e-dish-s1-20260914
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build S1 proposal, reviews and approval
        run: |
          set -euo pipefail
          node scripts/complete_e2e_dish_s1.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_reviewed_agent_dish_evidence.mjs')
          s=p.read_text()
          old="const EQUIVALENT_SEMANTICS = /定番|ご好評|自信作|自信の一品|一番の売り商品|一押し|お勧め|お薦め|おススメ|一番のおすすめ/i;"
          new="const EQUIVALENT_SEMANTICS = /定番|ご好評|自信作|自信の一品|一番の売り商品|一押し|お勧め|お薦め|おススメ|一番のおすすめ|必ず.{0,16}オーダー|オーダーしたい逸品/i;"
          if old not in s and new not in s:
              raise SystemExit('recommendation-equivalent contract line not found')
          p.write_text(s.replace(old,new))
          PY

      - name: Regression before integration
        run: |
          set -euo pipefail
          node scripts/test_reviewed_agent_dish_evidence.mjs
          node scripts/test_agent_dish_integration.mjs
          node scripts/test_detail_evidence_retention.mjs
          node scripts/test_dish_evidence_provider_policy.mjs
          node --check scripts/build_reviewed_agent_dish_evidence.mjs
          node --check scripts/complete_e2e_dish_s1.mjs

      - name: Snapshot canonical baseline
        run: |
          set -euo pipefail
          mkdir -p _audit
          node scripts/audit_agent_dish_integration.mjs --snapshot _audit/s1-before.json
          cp data/google_inventory_detail_evidence.json _audit/s1-evidence-before.json

      - name: Approved evidence adapter
        run: |
          set -euo pipefail
          node scripts/build_reviewed_agent_dish_evidence.mjs \
            data/agent_reviews/e2e-dish-s1.json \
            _audit/s1-approved.json \
            _audit/s1-pending.json \
            _audit/s1-adapter-audit.json

      - name: Maintained canonical integration and evidence audit
        run: |
          set -euo pipefail
          node scripts/merge_google_inventory_detail_evidence.mjs \
            data/google_inventory_detail_evidence.json \
            _audit/s1-approved.json \
            _audit/s1-merged.json
          node scripts/correct_dish_specificity_evidence.mjs \
            _audit/s1-merged.json \
            data/google_inventory_detail_evidence.json
          node scripts/audit_google_inventory_detail_evidence.mjs

      - name: Rebuild and integration audit
        run: |
          set -euo pipefail
          python3 scripts/reload_data.py --public-only --outdir _audit/s1-reload
          node scripts/audit_agent_dish_integration.mjs --compare \
            _audit/s1-before.json \
            _audit/s1-approved.json \
            _audit/s1-integration-audit.json

      - name: Replay idempotence
        run: |
          set -euo pipefail
          sha256sum data/google_inventory_detail_evidence.json > _audit/s1-evidence-first.sha
          node scripts/merge_google_inventory_detail_evidence.mjs \
            data/google_inventory_detail_evidence.json \
            _audit/s1-approved.json \
            _audit/s1-replay-merged.json
          node scripts/correct_dish_specificity_evidence.mjs \
            _audit/s1-replay-merged.json \
            _audit/s1-replay-corrected.json
          cmp data/google_inventory_detail_evidence.json _audit/s1-replay-corrected.json
          sha256sum data/google_inventory_runtime.js data/dish_batch_plan.json data/google_inventory_detail_queue.json > _audit/s1-runtime-first.sha
          python3 scripts/reload_data.py --public-only --outdir _audit/s1-reload-replay
          sha256sum data/google_inventory_runtime.js data/dish_batch_plan.json data/google_inventory_detail_queue.json > _audit/s1-runtime-second.sha
          cmp _audit/s1-runtime-first.sha _audit/s1-runtime-second.sha

      - name: Final validation and log
        run: |
          set -euo pipefail
          node scripts/audit_google_inventory_detail_evidence.mjs
          node scripts/test_reviewed_agent_dish_evidence.mjs
          node scripts/test_agent_dish_integration.mjs
          node scripts/test_detail_evidence_retention.mjs
          node scripts/test_dish_evidence_provider_policy.mjs
          node scripts/test_runtime_catalog_contract.mjs
          node scripts/test_tool_identity_name_contract.mjs
          node scripts/test_source_field_quarantine.mjs
          node scripts/audit_repository.mjs
          node scripts/audit_normalized_fields.mjs
          node scripts/complete_e2e_dish_s1.mjs --finalize
          if grep -R -nE 'maps\.googleapis\.com|places\.googleapis\.com|Place Details Pro' \
              data/agent_reviews/DISH-R-DISCOVERY/S1.json \
              data/agent_reviews/DISH-F-SOURCE/S1.json \
              data/agent_proposals/DISH-F-SOURCE/S1.json; then
            echo 'Unexpected paid Google API reference in S1 evidence' >&2
            exit 1
          fi

      - name: Commit verified S1 integration
        run: |
          set -euo pipefail
          git config user.name 'NekoHe'
          git config user.email '142577695+NekoHe@users.noreply.github.com'
          git add \
            scripts/build_reviewed_agent_dish_evidence.mjs \
            scripts/test_reviewed_agent_dish_evidence.mjs \
            scripts/dish_evidence_provider_policy.mjs \
            data/agent_proposals/DISH-F-SOURCE/S1.json \
            data/agent_reviews/DISH-R-DISCOVERY/S1.json \
            data/agent_reviews/DISH-F-SOURCE/S1.json \
            data/agent_reviews/e2e-dish-s1.json \
            data/google_inventory_detail_evidence.json \
            data/google_inventory_runtime.js \
            data/google_inventory_detail_queue.json \
            data/dish_batch_plan.json \
            data/production_area1.js \
            logs/2026-09-14-e2e-dish-s1.md
          git add -u data || true
          git diff --cached --check
          git commit -m '[s1-finalized] Complete E2E-DISH:S1 reviewed integration'
          git push origin HEAD:agent-e2e-dish-s1-20260914
