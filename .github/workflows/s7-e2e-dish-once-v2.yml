name: One-shot E2E dish S7 v2

on:
  push:
    branches: [agent-e2e-dish-s7-20260914]
    paths:
      - '.github/workflows/s7-e2e-dish-once-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and lock current S7 assignment
        run: |
          set -euo pipefail
          python scripts/reload_data.py --public-only --outdir _audit/s7-baseline-reload
          git diff --exit-code -- data
          python - <<'PY'
          import json
          p=json.load(open('data/dish_batch_plan.json'))
          d=[r for r in p['rows'] if r.get('lane')=='independent_source_discovery' and r.get('shard')==7]
          f=[r for r in p['rows'] if r.get('lane')=='official_or_retained_featured' and r.get('shard')==7]
          dp=json.load(open('data/agent_proposals/DISH-R-DISCOVERY/S7.json'))
          fp=json.load(open('data/agent_proposals/DISH-F-SOURCE/S7.json'))
          assert len(d)==36 and len(f)==10, (len(d),len(f))
          assert {x['googlePlaceId'] for x in d}=={x['googlePlaceId'] for x in dp['records']}
          assert {x['googlePlaceId'] for x in f}=={x['googlePlaceId'] for x in fp['records']}
          print(json.dumps({'DiscoveryS7':36,'FSourceS7':10,'CombinedS7':46}))
          PY

      - name: Build reviews approval manifest and minimal adapter extension
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, pathlib, subprocess
          root=pathlib.Path('.')
          source_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          fpath=root/'data/agent_proposals/DISH-F-SOURCE/S7.json'
          fdoc=json.loads(fpath.read_text())
          fdoc['sourceQueueCommit']=source_commit
          fpath.write_text(json.dumps(fdoc,ensure_ascii=False,indent=2)+'\n')
          reviews=[]
          for marker,ppath in [('DISH-R-DISCOVERY',root/'data/agent_proposals/DISH-R-DISCOVERY/S7.json'),('DISH-F-SOURCE',fpath)]:
            raw=json.loads(ppath.read_text())
            doc={**raw,'proposalOnly':False,'sourceQueueCommit':source_commit,'reviewedAt':'2026-09-14','reviewedBy':'E2E-DISH:S7 independent second-pass self-review','sourceProposalRefs':[str(ppath)]}
            out=root/'data/agent_reviews'/marker/'S7.json'; out.parent.mkdir(parents=True,exist_ok=True)
            text=json.dumps(doc,ensure_ascii=False,indent=2)+'\n'; out.write_text(text)
            reviews.append({'path':str(out),'sha256':hashlib.sha256(text.encode()).hexdigest()})
          plan=json.load(open('data/dish_batch_plan.json'))
          rows=[{'googlePlaceId':r['googlePlaceId'],'name':r['name'],'lane':r['lane'],'shard':r['shard']} for r in plan['rows'] if r.get('shard')==7 and r.get('lane') in {'independent_source_discovery','official_or_retained_featured'}]
          translations={
            '黒おでん盛り合わせ 5点':{'nameZh':'黑汤关东煮五种拼盘','rationale':'Exact reviewed translation.'},
            '4時間煮込んだ国産牛ホホ肉と風呂吹き大根の赤ワイン煮':{'nameZh':'四小时炖牛颊肉萝卜红酒煮','rationale':'Exact reviewed translation.'},
            'ラムチョップ':{'nameZh':'羊排','rationale':'Exact reviewed translation.'},
            '帆立しゅうまい':{'nameZh':'扇贝烧卖','rationale':'Exact reviewed translation.'},
            'おまかせ前菜盛合わせ6種':{'nameZh':'主厨精选六种前菜拼盘','rationale':'Exact reviewed translation.'},
            '自家製生ハム、サラミの盛り合わせ（レギュラーサイズ、ハーフサイズ）':{'nameZh':'自制生火腿萨拉米拼盘','rationale':'Exact reviewed translation.'},
            'メダル王のちいさなメダルPIZZA～5枚入り～':{'nameZh':'奖牌王小奖牌披萨五枚','rationale':'Exact reviewed translation.'},
            '特製幕の内弁当 さくら':{'nameZh':'特制幕之内便当樱','rationale':'Exact reviewed translation.'},
            '名物チーズナン':{'nameZh':'招牌芝士烤饼','rationale':'Exact reviewed translation.'},
            'マルゲリータピザ':{'nameZh':'玛格丽特披萨','rationale':'Exact reviewed translation.'},
            '香川県小豆島産オリーブ牛もも肉のステーキ':{'nameZh':'香川县小豆岛产橄榄牛腿肉牛排','rationale':'Exact reviewed translation.'},
            '絶品！豚角煮':{'nameZh':'绝品红烧猪角','rationale':'Exact reviewed translation.'},
            '牛筋カレー':{'nameZh':'牛筋咖喱','rationale':'Exact reviewed translation.'},
            '魚介のパエリア':{'nameZh':'海鲜西班牙烩饭','rationale':'Exact reviewed translation.'}}
          manifest={'schemaVersion':1,'approvalState':'approved','reviewer':'E2E-DISH:S7 self-review owner','reviewedAt':'2026-09-14','startingCommit':'e41ff3435bb4bcf5a6574df95424512280ec86d4','assignmentSnapshot':{'sourceQueue':'data/dish_batch_plan.json','sourceQueueCommit':source_commit,'rows':rows},'reviewedFiles':reviews,'translations':translations,'policyAttestation':{'paidGoogleDataApiCalls':0,'separateReviewerAgentUsed':False}}
          (root/'data/agent_reviews/e2e-dish-s7-approval.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')

          p=root/'scripts/build_reviewed_agent_dish_evidence.mjs'; s=p.read_text()
          old="export const LANES = Object.freeze({\n  'DISH-R-OFFICIAL': 'official_crawl',\n  'DISH-R-RETAINED': 'retained_source_mining'\n});"
          new="export const LANES = Object.freeze({\n  'DISH-R-OFFICIAL': 'official_crawl',\n  'DISH-R-RETAINED': 'retained_source_mining',\n  'DISH-R-DISCOVERY': 'independent_source_discovery',\n  'DISH-F-SOURCE': 'official_or_retained_featured'\n});"
          assert old in s; s=s.replace(old,new)
          old="  ['tabelog', 'Tabelog'], ['Tabelog', 'Tabelog'], ['hotpepper', 'Hot Pepper'], ['Hot Pepper', 'Hot Pepper']\n]);"
          new="  ['tabelog', 'Tabelog'], ['Tabelog', 'Tabelog'], ['hotpepper', 'Hot Pepper'], ['Hot Pepper', 'Hot Pepper'],\n  ['Rakuten Gurunavi', 'Rakuten Gurunavi'], [\"Let's Enjoy Tokyo\", \"Let's Enjoy Tokyo\"],\n  ['Kanda Curry Grand Prix', 'Kanda Curry Grand Prix']\n]);"
          assert old in s; s=s.replace(old,new)
          old="const currentRows = currentPlan.rows.filter(row => Object.values(LANES).includes(row.lane));"
          new="const selectedScopes = new Set(documents.map(({ document }) => `${LANES[document.marker]}:${Number(document.shard.slice(1))}`));\n  const currentRows = currentPlan.rows.filter(row => selectedScopes.has(`${row.lane}:${row.shard}`));"
          assert old in s; s=s.replace(old,new); p.write_text(s)

          doc=root/'RECOMMENDED_DISH_PIPELINE.md'; ds=doc.read_text(); heading='## 2026-09-14 S7 Discovery/F-source 审查适配器扩展'
          if heading not in ds:
            ds += '\n\n'+heading+'\n\n`build_reviewed_agent_dish_evidence.mjs` now applies the same fail-closed reviewed-evidence contract to `DISH-R-DISCOVERY` / `independent_source_discovery` and `DISH-F-SOURCE` / `official_or_retained_featured`. The CLI audits only the `(lane, shard)` scopes explicitly selected by the approved manifest, so adding markers does not broaden approval scope.\n'
            doc.write_text(ds)
          PY

      - name: Add regression coverage for both new lanes
        run: |
          cat >> scripts/test_reviewed_agent_dish_evidence.mjs <<'NODE'
          const discoveryAssignmentS7 = { ...assignment, googlePlaceId: 'disc-place', lane: 'independent_source_discovery', shard: 7 };
          const discoveryDocS7 = structuredClone(document);
          discoveryDocS7.marker = 'DISH-R-DISCOVERY'; discoveryDocS7.shard = 'S7'; discoveryDocS7.sourceQueueCommit = 'a'.repeat(40);
          discoveryDocS7.records[0].googlePlaceId = discoveryAssignmentS7.googlePlaceId; discoveryDocS7.records[0].restaurantName = discoveryAssignmentS7.name;
          discoveryDocS7.records[0].dishProposals[0].provider = 'Rakuten Gurunavi'; discoveryDocS7.records[0].dishProposals[0].sourceUrl = 'https://r.gnavi.co.jp/example/menu/';
          assert.equal(buildReviewedEvidence({ documents:[{path:'data/agent_reviews/DISH-R-DISCOVERY/S7.json',document:discoveryDocS7}], assignments:[discoveryAssignmentS7], catalogNames:new Map([[discoveryAssignmentS7.googlePlaceId,discoveryAssignmentS7.name]]), checkedAt:date, sourceQueueCommit:'a'.repeat(40), translations:{'ビーフカレー':{nameZh:'牛肉咖喱',rationale:'Exact test translation.'}} }).evidence.rows.length,1);
          const fAssignmentS7 = { ...assignment, googlePlaceId: 'featured-place', lane: 'official_or_retained_featured', shard: 7 };
          const fDocS7 = structuredClone(featuredDoc); fDocS7.marker='DISH-F-SOURCE'; fDocS7.shard='S7'; fDocS7.sourceQueueCommit='a'.repeat(40);
          fDocS7.records[0].googlePlaceId=fAssignmentS7.googlePlaceId; fDocS7.records[0].restaurantName=fAssignmentS7.name;
          assert.equal(buildReviewedEvidence({ documents:[{path:'data/agent_reviews/DISH-F-SOURCE/S7.json',document:fDocS7}], assignments:[fAssignmentS7], catalogNames:new Map([[fAssignmentS7.googlePlaceId,fAssignmentS7.name]]), checkedAt:date, sourceQueueCommit:'a'.repeat(40), translations:{'ビーフカレー':{nameZh:'牛肉咖喱',rationale:'Exact test translation.'}} }).evidence.rows[0].featuredDishes.length,1);
          NODE
          node --check scripts/build_reviewed_agent_dish_evidence.mjs
          node --check scripts/test_reviewed_agent_dish_evidence.mjs
          node scripts/test_reviewed_agent_dish_evidence.mjs
          node scripts/test_agent_dish_integration.mjs
          node scripts/audit_no_paid_apis.mjs

      - name: Commit review and gate changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/agent_proposals/DISH-F-SOURCE/S7.json data/agent_reviews scripts/build_reviewed_agent_dish_evidence.mjs scripts/test_reviewed_agent_dish_evidence.mjs RECOMMENDED_DISH_PIPELINE.md
          git commit -m 'review: approve S7 discovery and featured evidence'

      - name: Build approved evidence
        run: |
          set -euo pipefail
          node scripts/audit_agent_dish_integration.mjs --snapshot _audit/s7-before.json
          node scripts/build_reviewed_agent_dish_evidence.mjs data/agent_reviews/e2e-dish-s7-approval.json _audit/s7-accepted.json _audit/s7-translation-pending.json _audit/s7-coverage.json | tee _audit/s7-adapter.log
          node - <<'NODE'
          const fs=require('fs'); const c=JSON.parse(fs.readFileSync('_audit/s7-coverage.json'));
          if(c.assignedRows!==46||c.reviewedRows!==46) throw new Error(`coverage mismatch ${JSON.stringify(c)}`);
          if(c.byMarker['DISH-R-DISCOVERY'].assignedRows!==36||c.byMarker['DISH-F-SOURCE'].assignedRows!==10) throw new Error('marker coverage mismatch');
          if(c.acceptedRItems!==13||c.acceptedFItems!==4) throw new Error(`accepted mismatch ${JSON.stringify(c)}`);
          if(c.translationPendingItems!==3) throw new Error(`pending mismatch ${JSON.stringify(c)}`);
          NODE

      - name: Integrate rebuild audit and replay
        run: |
          set -euo pipefail
          node scripts/merge_google_inventory_detail_evidence.mjs data/google_inventory_detail_evidence.json _audit/s7-accepted.json data/google_inventory_detail_evidence.json | tee _audit/s7-merge.log
          node scripts/correct_dish_specificity_evidence.mjs data/google_inventory_detail_evidence.json data/google_inventory_detail_evidence.json | tee _audit/s7-specificity.log
          node scripts/audit_google_inventory_detail_evidence.mjs
          python scripts/reload_data.py --public-only --outdir _audit/s7-after-reload
          node scripts/audit_agent_dish_integration.mjs --compare _audit/s7-before.json _audit/s7-accepted.json _audit/s7-integration.json
          sha256sum data/google_inventory_detail_evidence.json data/google_inventory_runtime.js data/google_inventory_detail_queue.json data/dish_batch_plan.json > _audit/s7-first.sha256
          node scripts/merge_google_inventory_detail_evidence.mjs data/google_inventory_detail_evidence.json _audit/s7-accepted.json data/google_inventory_detail_evidence.json > _audit/s7-replay-merge.log
          node scripts/correct_dish_specificity_evidence.mjs data/google_inventory_detail_evidence.json data/google_inventory_detail_evidence.json > _audit/s7-replay-specificity.log
          python scripts/reload_data.py --public-only --outdir _audit/s7-replay-reload > _audit/s7-replay-reload.stdout
          sha256sum data/google_inventory_detail_evidence.json data/google_inventory_runtime.js data/google_inventory_detail_queue.json data/dish_batch_plan.json > _audit/s7-second.sha256
          diff -u _audit/s7-first.sha256 _audit/s7-second.sha256
          node scripts/test_reviewed_agent_dish_evidence.mjs
          node scripts/test_agent_dish_integration.mjs
          node scripts/test_runtime_catalog_contract.mjs
          node scripts/audit_google_inventory_detail_evidence.mjs
          node scripts/audit_no_paid_apis.mjs

      - name: Commit integrated state and push
        run: |
          set -euo pipefail
          git add -A data RECOMMENDED_DISH_PIPELINE.md scripts/build_reviewed_agent_dish_evidence.mjs scripts/test_reviewed_agent_dish_evidence.mjs
          git commit -m 'integration: apply approved S7 dish evidence'
          git push origin HEAD:agent-e2e-dish-s7-20260914

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-dish-s7-audit-v2
          path: _audit/s7-*
          if-no-files-found: ignore
          retention-days: 7
