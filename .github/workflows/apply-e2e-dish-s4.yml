name: Apply E2E-DISH S4 reviewed evidence

on:
  push:
    branches: [agent-e2e-dish-s4-20260914]
    paths:
      - '.e2e-dish-s4-run'

permissions:
  contents: write

concurrency:
  group: e2e-dish-s4-reviewed-integration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Adapter syntax check
        run: node --check scripts/build_reviewed_agent_dish_evidence.mjs

      - name: Existing reviewed-adapter regression
        run: node scripts/test_reviewed_agent_dish_evidence.mjs

      - name: Discovery and F-source scope regression
        run: node scripts/test_reviewed_agent_dish_scope_extensions.mjs

      - name: Agent integration-audit regression
        run: node scripts/test_agent_dish_integration.mjs

      - name: Evidence-retention regression
        run: node scripts/test_detail_evidence_retention.mjs

      - name: Zero-paid Google API audit
        run: node scripts/audit_no_paid_apis.mjs

      - name: Rebuild and freeze current S4 assignment
        run: |
          set -euo pipefail
          mkdir -p _audit/s4-run
          python scripts/reload_data.py --public-only --outdir _audit/s4-run/baseline-reload
          # Proposal/review inputs do not participate in reload; the maintained base
          # must already be reproducible before any S4 canonical evidence is applied.
          git diff --exit-code -- data/google_inventory_runtime.js data/google_inventory_detail_queue.json data/dish_batch_plan.json
          cp data/dish_batch_plan.json _audit/s4-run/plan-before.json
          cp data/google_inventory_detail_queue.json _audit/s4-run/queue-before.json
          node scripts/audit_agent_dish_integration.mjs --snapshot _audit/s4-run/integration-before.json

      - name: Create immutable explicit S4 approval manifest
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const reviewPaths = [
            'data/agent_reviews/DISH-R-DISCOVERY/S4.json',
            'data/agent_reviews/DISH-F-SOURCE/S4.json'
          ];
          const reviews = reviewPaths.map(path => ({ path, raw: fs.readFileSync(path), doc: JSON.parse(fs.readFileSync(path, 'utf8')) }));
          const provenance = new Set(reviews.map(({doc}) => doc.sourceQueueCommit));
          if (provenance.size !== 1) throw new Error('S4 review files do not share one assignment provenance commit');
          const sourceQueueCommit = [...provenance][0];
          if (!/^[0-9a-f]{40}$/.test(sourceQueueCommit)) throw new Error('Invalid S4 assignment provenance commit');
          const plan = JSON.parse(fs.readFileSync('data/dish_batch_plan.json', 'utf8'));
          const lanes = new Set(['independent_source_discovery', 'official_or_retained_featured']);
          const rows = plan.rows.filter(row => lanes.has(row.lane) && row.shard === 4);
          const reviewedIds = new Set(reviews.flatMap(({doc}) => doc.records.map(row => row.googlePlaceId)));
          if (rows.length !== 43 || reviewedIds.size !== 43) throw new Error(`S4 denominator mismatch: plan=${rows.length} review=${reviewedIds.size}`);
          const planIds = new Set(rows.map(row => row.googlePlaceId));
          for (const id of reviewedIds) if (!planIds.has(id)) throw new Error(`Reviewed S4 ID left current assignment: ${id}`);
          for (const id of planIds) if (!reviewedIds.has(id)) throw new Error(`Current S4 ID is unreviewed: ${id}`);
          const manifest = {
            schemaVersion: 1,
            assignment: 'E2E-DISH:S4',
            approvalState: 'approved',
            reviewer: 'ChatGPT E2E-DISH:S4 owner/reviewer',
            reviewedAt: '2026-09-15',
            assignmentSnapshot: { sourceQueueCommit, rows },
            reviewedFiles: reviews.map(({path, raw}) => ({ path, sha256: crypto.createHash('sha256').update(raw).digest('hex') })),
            translations: {
              'アツアツ海鮮土鍋': { nameZh: '热腾腾海鲜砂锅', rationale: 'Exact reviewed normalization of the source-native seafood clay-pot item.' },
              '石鍋焼き麻婆豆腐': { nameZh: '石锅麻婆豆腐', rationale: 'Exact reviewed normalization: stone-pot baked mapo tofu.' },
              'パ二プリ（８P）': { nameZh: '帕尼普里（8个）', rationale: 'Exact reviewed normalization of pani puri with the source quantity preserved.' },
              '発酵 旬菜膳': { nameZh: '发酵时令菜膳', rationale: 'Exact reviewed normalization of the fermented seasonal set meal.' }
            },
            policyAttestation: { paidGoogleDataApiCalls: 0, accessRestrictionBypassUsed: false, identityMutationAllowed: false }
          };
          fs.writeFileSync('data/agent_reviews/e2e-dish-s4.json', JSON.stringify(manifest, null, 2) + '\n');
          console.log(JSON.stringify({ assignmentRows: rows.length, reviewedRows: reviewedIds.size, sourceQueueCommit }));
          NODE

      - name: Build approved evidence through maintained adapter
        run: |
          set -euo pipefail
          node scripts/build_reviewed_agent_dish_evidence.mjs \
            data/agent_reviews/e2e-dish-s4.json \
            _audit/s4-run/reviewed-evidence.json \
            _audit/s4-run/translation-pending.json \
            _audit/s4-run/review-coverage.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const coverage = JSON.parse(fs.readFileSync('_audit/s4-run/review-coverage.json', 'utf8'));
          const evidence = JSON.parse(fs.readFileSync('_audit/s4-run/reviewed-evidence.json', 'utf8'));
          const pending = JSON.parse(fs.readFileSync('_audit/s4-run/translation-pending.json', 'utf8'));
          if (coverage.assignedRows !== 43 || coverage.reviewedRows !== 43 || coverage.currentAssignmentRows !== 43 || coverage.currentReviewedRows !== 43) throw new Error('S4 review coverage is not 43/43 current rows');
          const s = coverage.statusCounts || {};
          if (s.accepted_evidence !== 4 || s.candidate !== 11 || s.no_evidence !== 28 || s.blocked !== 0 || s.skipped_already_complete !== 0) throw new Error(`Unexpected terminal-state totals: ${JSON.stringify(s)}`);
          if (coverage.acceptedRItems !== 2 || coverage.acceptedFItems !== 2 || coverage.emittedRItems !== 2 || coverage.emittedFItems !== 2) throw new Error(`Unexpected approved evidence totals: ${JSON.stringify(coverage)}`);
          if (pending.rows.length !== 0) throw new Error(`Unexpected S4 translation pending items: ${pending.rows.length}`);
          if (evidence.rows.length !== 4) throw new Error(`Only four accepted S4 restaurants should emit canonical evidence, got ${evidence.rows.length}`);
          console.log(JSON.stringify({ coverage: `${coverage.reviewedRows}/${coverage.assignedRows}`, statuses: s, R: coverage.emittedRItems, F: coverage.emittedFItems }));
          NODE

      - name: Merge, specificity-correct, rebuild, and audit actual delta
        run: |
          set -euo pipefail
          node scripts/merge_google_inventory_detail_evidence.mjs \
            data/google_inventory_detail_evidence.json \
            _audit/s4-run/reviewed-evidence.json \
            _audit/s4-run/merged-evidence.json | tee _audit/s4-run/merge.log
          cp _audit/s4-run/merged-evidence.json data/google_inventory_detail_evidence.json
          node scripts/correct_dish_specificity_evidence.mjs \
            data/google_inventory_detail_evidence.json data/google_inventory_detail_evidence.json | tee _audit/s4-run/specificity.log
          node scripts/audit_google_inventory_detail_evidence.mjs
          python scripts/reload_data.py --public-only --outdir _audit/s4-run/after-reload
          node scripts/audit_agent_dish_integration.mjs --compare \
            _audit/s4-run/integration-before.json \
            _audit/s4-run/reviewed-evidence.json \
            _audit/s4-run/integration-audit.json

      - name: Prove no unrelated assignment/runtime rows changed
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const accepted = JSON.parse(fs.readFileSync('_audit/s4-run/reviewed-evidence.json', 'utf8'));
          const allowed = new Set(accepted.rows.map(row => row.googlePlaceId));
          const compareRows = (beforePath, afterPath, label) => {
            const before = JSON.parse(fs.readFileSync(beforePath, 'utf8'));
            const after = JSON.parse(fs.readFileSync(afterPath, 'utf8'));
            const b = new Map(before.rows.map(row => [row.googlePlaceId, row]));
            const a = new Map(after.rows.map(row => [row.googlePlaceId, row]));
            const ids = new Set([...b.keys(), ...a.keys()]);
            const unrelated = [];
            for (const id of ids) {
              if (allowed.has(id)) continue;
              if (JSON.stringify(b.get(id) ?? null) !== JSON.stringify(a.get(id) ?? null)) unrelated.push(id);
            }
            if (unrelated.length) throw new Error(`${label} changed outside approved S4 IDs: ${unrelated.join(',')}`);
          };
          compareRows('_audit/s4-run/plan-before.json', 'data/dish_batch_plan.json', 'dish_batch_plan');
          compareRows('_audit/s4-run/queue-before.json', 'data/google_inventory_detail_queue.json', 'detail_queue');
          console.log(JSON.stringify({ status: 'pass', approvedPlaceIds: [...allowed] }));
          NODE

      - name: Prove logical replay idempotence
        run: |
          set -euo pipefail
          node scripts/merge_google_inventory_detail_evidence.mjs \
            data/google_inventory_detail_evidence.json \
            _audit/s4-run/reviewed-evidence.json \
            _audit/s4-run/replay-merged.json > _audit/s4-run/replay-merge.log
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const once = JSON.parse(fs.readFileSync('data/google_inventory_detail_evidence.json', 'utf8'));
          const twice = JSON.parse(fs.readFileSync('_audit/s4-run/replay-merged.json', 'utf8'));
          if (JSON.stringify(once.rows) !== JSON.stringify(twice.rows)) throw new Error('Second reviewed-evidence merge changed logical evidence rows');
          NODE
          git diff -- data/google_inventory_runtime.js data/google_inventory_detail_queue.json data/dish_batch_plan.json > _audit/s4-run/first-rebuild.diff
          python scripts/reload_data.py --public-only --outdir _audit/s4-run/replay-reload
          git diff -- data/google_inventory_runtime.js data/google_inventory_detail_queue.json data/dish_batch_plan.json > _audit/s4-run/second-rebuild.diff
          cmp _audit/s4-run/first-rebuild.diff _audit/s4-run/second-rebuild.diff
          node scripts/audit_google_inventory_detail_evidence.mjs
          node scripts/audit_no_paid_apis.mjs
          node scripts/test_source_field_quarantine.mjs

      - name: Record measured metrics
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const coverage = JSON.parse(fs.readFileSync('_audit/s4-run/review-coverage.json', 'utf8'));
          const integration = JSON.parse(fs.readFileSync('_audit/s4-run/integration-audit.json', 'utf8'));
          const metrics = {
            assignment: 'E2E-DISH:S4',
            reviewCoverage: {
              discovery: '36/36', featuredSource: '7/7', combined: '43/43'
            },
            terminalStatus: coverage.statusCounts,
            approvedEvidence: {
              R: coverage.emittedRItems,
              F: coverage.emittedFItems,
              RRestaurants: coverage.acceptedRRestaurants,
              FOnlyRestaurants: coverage.acceptedFOnlyRestaurants
            },
            canonicalImpact: integration,
            paidGoogleDataApiCalls: 0,
            replayIdempotent: true
          };
          const text = JSON.stringify(metrics, null, 2) + '\n';
          fs.writeFileSync('_audit/s4-run/metrics.json', text);
          fs.writeFileSync('logs/2026-09-14-e2e-dish-s4-metrics.json', text);
          console.log(JSON.stringify(metrics));
          NODE

      - name: Commit verified canonical/rebuild data to S4 branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data logs/2026-09-14-e2e-dish-s4-metrics.json
          if git diff --cached --quiet; then
            echo 'No S4 canonical data changes to commit'
            exit 1
          fi
          git commit -m 'data: integrate reviewed E2E-DISH S4 evidence'
          git push origin HEAD:agent-e2e-dish-s4-20260914

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-dish-s4-reviewed-integration
          path: _audit/s4-run
          if-no-files-found: warn
          retention-days: 14
