name: One-shot extended independent source dispatcher

on:
  push:
    branches:
      - main
    paths:
      - _ops/run-extended-independent-review-once-2026-09-08.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch extended strict independent source review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run review-independent-dish-sources-extended.yml --repo "$GITHUB_REPOSITORY" --ref main
