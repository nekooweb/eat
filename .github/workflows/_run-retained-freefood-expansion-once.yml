name: One-shot retained free-food collector expansion

on:
  push:
    branches:
      - main
    paths:
      - _ops/run-retained-freefood-expansion-once-2026-09-08.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch source-backed collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-google-inventory-details.yml --repo "$GITHUB_REPOSITORY" --ref main
