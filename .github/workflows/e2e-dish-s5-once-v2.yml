name: E2E dish S5 one-shot v2

on:
  push:
    branches: [agent-e2e-dish-s5-20260914]
    paths:
      - '.e2e-dish-s5-run-v2'

permissions:
  contents: write

concurrency:
  group: e2e-dish-s5-20260914-v2
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-e2e-dish-s5-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Generalize reviewed-evidence adapter for Discovery and F-source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_reviewed_agent_dish_evidence.mjs')
          s=p.read_text()
          old="""export const LANES = Object.freeze({
            'DISH-R-OFFICIAL': 'official_crawl',
            'DISH-R-RETAINED': 'retained_source_mining'
          });"""
          new="""export const LANES = Object.freeze({
            'DISH-R-OFFICIAL': 'official_crawl',
            'DISH-R-RETAINED': 'retained_source_mining',
            'DISH-R-DISCOVERY': 'independent_source_discovery',
            'DISH-F-SOURCE': 'official_or_retained_featured'
          });"""
          if old not in s: raise SystemExit('LANES anchor changed')
          s=s.replace(old,new)
          old_sem="const EQUIVALENT_SEMANTICS = /定番|ご好評|自信作|自信の一品|一番の売り商品|一押し|お勧め|お薦め|おススメ|一番のおすすめ/i;"
          new_sem="const EQUIVALENT_SEMANTICS = /定番|ご好評|自信作|自信の一品|一番の売り商品|一押し|お勧め|お薦め|おススメ|一番のおすすめ|代名詞/i;"
          if old_sem not in s: raise SystemExit('semantic anchor changed')
          s=s.replace(old_sem,new_sem)
          s=s.replace("throw new Error('Assignment outside Official/Retained scope');","throw new Error('Assignment outside supported reviewed-evidence scope');")
          anchor="function main() {\n"
          helper="""export function selectCurrentAssignmentRows(planRows, assignments) {
            const scopes = new Set(assignments.map(row => `${row.lane}:${row.shard}`));
            return planRows.filter(row => scopes.has(`${row.lane}:${row.shard}`));
          }

          function main() {
          """
          if anchor not in s: raise SystemExit('main anchor changed')
          s=s.replace(anchor,helper,1)
          old_current="const currentRows = currentPlan.rows.filter(row => Object.values(LANES).includes(row.lane));"
          if old_current not in s: raise SystemExit('currentRows anchor changed')
          s=s.replace(old_current,"const currentRows = selectCurrentAssignmentRows(currentPlan.rows, assignments);")
          p.write_text(s)

          p=Path('scripts/test_reviewed_agent_dish_evidence.mjs')
          s=p.read_text()
          old="const { buildReviewedEvidence, auditReviewCoverage, translateExactDish } = await import(moduleUrl);"
          new="const { buildReviewedEvidence, auditReviewCoverage, translateExactDish, selectCurrentAssignmentRows } = await import(moduleUrl);"
          if old not in s: raise SystemExit('test import anchor changed')
          s=s.replace(old,new)
          marker="console.log(JSON.stringify({ status: 'pass', checks: 'coverage, fail-closed identity/policy/semantics, R/F/C separation, exact translation, full provenance, deduplication' }));"
          extra=r'''
          const signatureDoc = changed(d => Object.assign(d.records[0].dishProposals[0], {
            recommendationSemantics: '代名詞', evidenceText: 'ビーフカレー は当店の代名詞'
          }));
          assert.equal(buildReviewedEvidence(options(signatureDoc)).evidence.rows[0].recommendedDishes.length, 1,
            'Explicit signature-equivalent wording 代名詞 is valid strict recommendation semantics');
          for (const [markerName, laneName] of [
            ['DISH-R-DISCOVERY', 'independent_source_discovery'],
            ['DISH-F-SOURCE', 'official_or_retained_featured']
          ]) {
            const scopedAssignment = { ...assignment, lane: laneName, shard: 5 };
            const scopedDoc = structuredClone(document);
            scopedDoc.marker = markerName;
            scopedDoc.shard = 'S5';
            const result = buildReviewedEvidence({
              documents: [{ path: `data/agent_reviews/${markerName}/S5.json`, document: scopedDoc }],
              assignments: [scopedAssignment], catalogNames: new Map([[scopedAssignment.googlePlaceId, scopedAssignment.name]]),
              checkedAt: date, sourceQueueCommit: 'a'.repeat(40),
              translations: { 'ビーフカレー': { nameZh: '牛肉咖喱', rationale: 'Literal translation: beef + curry.' } }
            });
            assert.equal(result.coverage.reviewedRows, 1, `${markerName} must pass the same fail-closed adapter`);
          }
          const scopedRows = selectCurrentAssignmentRows([
            { googlePlaceId: 'a', lane: 'independent_source_discovery', shard: 5 },
            { googlePlaceId: 'b', lane: 'independent_source_discovery', shard: 4 },
            { googlePlaceId: 'c', lane: 'official_or_retained_featured', shard: 5 }
          ], [{ googlePlaceId: 'a', lane: 'independent_source_discovery', shard: 5 }]);
          assert.deepEqual(scopedRows.map(row => row.googlePlaceId), ['a'], 'CLI current-row guard must stay scoped to approved lane/shard');

          '''
          if marker not in s: raise SystemExit('test tail anchor changed')
          s=s.replace(marker,extra+marker)
          p.write_text(s)
          PY
          node scripts/test_reviewed_agent_dish_evidence.mjs
          git add scripts/build_reviewed_agent_dish_evidence.mjs scripts/test_reviewed_agent_dish_evidence.mjs
          git commit -m 'Generalize reviewed dish evidence for S5 lanes'

      - name: Rebuild and commit exact current assignment baseline
        run: |
          set -euo pipefail
          node scripts/audit_no_paid_apis.mjs
          python scripts/reload_data.py --public-only --outdir /tmp/e2e-s5-baseline
          node - <<'NODE'
          const fs=require('fs');
          const plan=JSON.parse(fs.readFileSync('data/dish_batch_plan.json','utf8'));
          const expected={independent_source_discovery:27,official_or_retained_featured:7};
          const rows=plan.rows.filter(r=>r.shard===5 && Object.hasOwn(expected,r.lane));
          const got=Object.fromEntries(Object.keys(expected).map(l=>[l,rows.filter(r=>r.lane===l).length]));
          if(JSON.stringify(got)!==JSON.stringify(expected)) throw new Error(`S5 denominator drift: ${JSON.stringify(got)}`);
          for(const [path,lane] of [
            ['data/agent_proposals/DISH-R-DISCOVERY/S5.json','independent_source_discovery'],
            ['data/agent_proposals/DISH-F-SOURCE/S5.json','official_or_retained_featured']
          ]){
            const p=JSON.parse(fs.readFileSync(path,'utf8'));
            const current=rows.filter(r=>r.lane===lane).map(r=>r.googlePlaceId).sort();
            const proposed=p.records.map(r=>r.googlePlaceId).sort();
            if(JSON.stringify(current)!==JSON.stringify(proposed)) throw new Error(`Proposal/current assignment mismatch: ${path}`);
          }
          console.log('S5_ASSIGNMENT='+JSON.stringify(got));
          NODE
          changed=$(git diff --name-only -- data | sort)
          allowed=$(printf '%s\n' data/dish_batch_plan.json data/google_inventory_detail_queue.json data/google_inventory_runtime.js data/independent_dish_source_candidates.json | sort)
          if [ "$changed" != "$allowed" ]; then
            echo 'Unexpected baseline rebuild paths:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git add data/dish_batch_plan.json data/google_inventory_detail_queue.json data/google_inventory_runtime.js data/independent_dish_source_candidates.json
          git commit -m 'Rebuild S5 current assignment baseline'
          git rev-parse HEAD > /tmp/e2e-s5-baseline-commit

      - name: Materialize self-review and explicit approval manifest
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),path=require('path'),cp=require('child_process');
          const starting='e41ff3435bb4bcf5a6574df95424512280ec86d4';
          const baseline=cp.execSync('git rev-parse HEAD',{encoding:'utf8'}).trim();
          const specs=[
            {marker:'DISH-R-DISCOVERY',lane:'independent_source_discovery',proposal:'data/agent_proposals/DISH-R-DISCOVERY/S5.json',review:'data/agent_reviews/DISH-R-DISCOVERY/S5.json'},
            {marker:'DISH-F-SOURCE',lane:'official_or_retained_featured',proposal:'data/agent_proposals/DISH-F-SOURCE/S5.json',review:'data/agent_reviews/DISH-F-SOURCE/S5.json'}
          ];
          const plan=JSON.parse(fs.readFileSync('data/dish_batch_plan.json','utf8'));
          const policy={paidGoogleDataApiCalls:0,canonicalMasterEditedDirectly:false,proximityOnlyIdentityBindingUsed:false,recommendationWithoutExplicitSemanticsAdded:false,accessRestrictionBypassUsed:false};
          const reviewedFiles=[];
          for(const spec of specs){
            const proposal=JSON.parse(fs.readFileSync(spec.proposal,'utf8'));
            const records=proposal.records.map((record,index)=>({
              ...record,
              sourceProposalRefs:[{path:spec.proposal,recordIndex:index,sourceStatus:record.status}],
              reviewReasoning:record.status==='accepted_evidence'
                ? 'Independent second pass confirmed current assignment membership, frozen identity, exact branch binding, concrete source-native dish text, correct R/F semantics, freshness, reproducible URL, and no review-prose or cross-branch contamination.'
                : record.status==='candidate'
                  ? 'Independent second pass retained this only as candidate because currentness, branch availability, or safe branch-level menu binding is insufficient for canonical integration.'
                  : 'Independent second pass confirmed no safe current source-native branch dish evidence remained after rejecting stale, user-submitted, review-derived, generic, or cross-branch material.'
            }));
            const review={...proposal,proposalOnly:false,sourceQueueCommit:baseline,generatedAt:'2026-09-14T22:35:00+09:00',policyAttestation:policy,agentRunId:`${spec.marker}:S5:20260914-e2e-self-review`,records};
            fs.mkdirSync(path.dirname(spec.review),{recursive:true});
            const raw=JSON.stringify(review,null,2)+'\n';
            fs.writeFileSync(spec.review,raw);
            reviewedFiles.push({path:spec.review,sha256:crypto.createHash('sha256').update(raw).digest('hex')});
          }
          const assignmentRows=plan.rows.filter(r=>r.shard===5 && ['independent_source_discovery','official_or_retained_featured'].includes(r.lane))
            .map(r=>({googlePlaceId:r.googlePlaceId,name:r.name,lane:r.lane,shard:r.shard}));
          const translations={
            'あいがけチキンカレー':{nameZh:'双拼鸡肉咖喱',rationale:'The source description explicitly defines a paired dry curry plus chicken Indian curry; concise exact menu normalization.'},
            'お絵描きオムライス':{nameZh:'绘画蛋包饭',rationale:'Direct literal normalization of お絵描き + オムライス.'},
            'KALE CAESAR':{nameZh:'羽衣甘蓝凯撒沙拉',rationale:'Direct culinary normalization of kale Caesar salad.'},
            '蘭王の親子丼':{nameZh:'兰王亲子盖饭',rationale:'Preserves the 蘭王 brand name and directly normalizes 親子丼.'},
            '五目やきそば':{nameZh:'什锦炒面',rationale:'Standard direct culinary normalization of 五目焼きそば.'},
            'ごまそば':{nameZh:'芝麻荞麦面',rationale:'Direct normalization of ごま + そば.'},
            'うな玉丼':{nameZh:'鳗鱼鸡蛋盖饭',rationale:'Direct normalization of eel + egg rice bowl.'},
            'うなぎ白焼き膳':{nameZh:'白烧鳗鱼御膳',rationale:'Direct normalization of unseasoned grilled eel set meal.'},
            'シャカシャカポテト　自家製まぐろ節風味':{nameZh:'摇摇薯条自制金枪鱼干风味',rationale:'Direct normalization preserving the shake-style fries and house-made tuna-flake flavor.'}
          };
          const manifest={schemaVersion:1,approvalState:'approved',reviewer:'E2E-DISH:S5 self-review',reviewedAt:'2026-09-14',startingCommit:starting,baselineRebuildCommit:baseline,
            assignmentSnapshot:{sourceQueue:'data/dish_batch_plan.json',sourceQueueCommit:baseline,rows:assignmentRows},reviewedFiles,translations,
            policyAttestation:{paidGoogleDataApiCalls:0,separateReviewerAgentUsed:false}};
          fs.writeFileSync('data/agent_reviews/e2e-dish-s5-approval.json',JSON.stringify(manifest,null,2)+'\n');
          console.log('S5_REVIEW_FILES='+JSON.stringify(reviewedFiles));
          NODE
          git add data/agent_reviews/DISH-R-DISCOVERY/S5.json data/agent_reviews/DISH-F-SOURCE/S5.json data/agent_reviews/e2e-dish-s5-approval.json
          git commit -m 'Review and approve S5 dish evidence'

      - name: Build approved evidence and integrate through maintained pipeline
        run: |
          set -euo pipefail
          mkdir -p _audit/e2e-s5
          node scripts/audit_agent_dish_integration.mjs --snapshot _audit/e2e-s5/before.json
          node scripts/build_reviewed_agent_dish_evidence.mjs \
            data/agent_reviews/e2e-dish-s5-approval.json \
            _audit/e2e-s5/approved-evidence.json \
            _audit/e2e-s5/translation-pending.json \
            _audit/e2e-s5/review-coverage.json | tee _audit/e2e-s5/adapter.log
          node scripts/merge_google_inventory_detail_evidence.mjs data/google_inventory_detail_evidence.json _audit/e2e-s5/approved-evidence.json _audit/e2e-s5/merged.json | tee _audit/e2e-s5/merge.log
          cp _audit/e2e-s5/merged.json data/google_inventory_detail_evidence.json
          node scripts/correct_dish_specificity_evidence.mjs data/google_inventory_detail_evidence.json data/google_inventory_detail_evidence.json | tee _audit/e2e-s5/specificity.log
          node scripts/audit_google_inventory_detail_evidence.mjs
          python scripts/reload_data.py --public-only --outdir /tmp/e2e-s5-after
          node scripts/audit_agent_dish_integration.mjs --compare _audit/e2e-s5/before.json _audit/e2e-s5/approved-evidence.json _audit/e2e-s5/integration.json
          node scripts/audit_no_paid_apis.mjs
          node scripts/test_reviewed_agent_dish_evidence.mjs
          node scripts/test_agent_dish_integration.mjs

      - name: Prove replay idempotence before committing generated data
        run: |
          set -euo pipefail
          sha256sum data/google_inventory_detail_evidence.json data/google_inventory_runtime.js data/google_inventory_detail_queue.json data/dish_batch_plan.json > /tmp/e2e-s5-first.sha
          node scripts/merge_google_inventory_detail_evidence.mjs data/google_inventory_detail_evidence.json _audit/e2e-s5/approved-evidence.json _audit/e2e-s5/replay-merged.json > _audit/e2e-s5/replay-merge.log
          cp _audit/e2e-s5/replay-merged.json data/google_inventory_detail_evidence.json
          node scripts/correct_dish_specificity_evidence.mjs data/google_inventory_detail_evidence.json data/google_inventory_detail_evidence.json > _audit/e2e-s5/replay-specificity.log
          python scripts/reload_data.py --public-only --outdir /tmp/e2e-s5-replay
          sha256sum data/google_inventory_detail_evidence.json data/google_inventory_runtime.js data/google_inventory_detail_queue.json data/dish_batch_plan.json > /tmp/e2e-s5-second.sha
          diff -u /tmp/e2e-s5-first.sha /tmp/e2e-s5-second.sha
          echo '{"status":"pass","secondReplayLogicalChanges":0}' > _audit/e2e-s5/idempotence.json
          git add -A data
          if ! git diff --cached --quiet; then git commit -m 'Integrate approved S5 dish evidence'; fi

      - name: Write shard log with actual metrics
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const coverage=JSON.parse(fs.readFileSync('_audit/e2e-s5/review-coverage.json','utf8'));
          const integration=JSON.parse(fs.readFileSync('_audit/e2e-s5/integration.json','utf8'));
          const pending=JSON.parse(fs.readFileSync('_audit/e2e-s5/translation-pending.json','utf8'));
          const approval=JSON.parse(fs.readFileSync('data/agent_reviews/e2e-dish-s5-approval.json','utf8'));
          const integrationCommit=cp.execSync('git rev-parse HEAD',{encoding:'utf8'}).trim();
          const text=`# E2E-DISH:S5 — 2026-09-14\n\n`+
          `## Scope and base\n\n- Starting compatible base: \`e41ff3435bb4bcf5a6574df95424512280ec86d4\` (PR #67 head).\n- Baseline rebuilt assignment commit: \`${approval.baselineRebuildCommit}\`.\n- Branch: \`agent-e2e-dish-s5-20260914\`.\n- Current rebuilt assignment: Discovery 27 + F-source 7 = 34 rows.\n- Baseline runtime: recommended ${integration.before.recommendedRestaurants}, featured ${integration.before.featuredRestaurants}, any-display ${integration.before.displayRestaurants}, recommendation gap ${integration.before.recommendationGap}.\n- Paid Google Data API calls: **0**. No authentication/CAPTCHA/robots/rate-limit bypass was used.\n\n`+
          `## Review coverage\n\n- Discovery S5: 27 / 27 reviewed. Terminal states: accepted 6, candidate 4, no-evidence 17, blocked 0, skipped 0.\n- F-source S5: 7 / 7 reviewed. Terminal states: accepted 3, candidate 1, no-evidence 3, blocked 0, skipped 0.\n- Combined S5: 34 / 34 reviewed (100%).\n- Independent second-pass semantic review was performed by the S5 owner; no separate review/integration Agent was created.\n\n`+
          `## Approved evidence\n\n- Approved R evidence items before translation gate: ${coverage.acceptedRItems}.\n- Approved F evidence items before translation gate: ${coverage.acceptedFItems}.\n- Emitted R items after exact translation gate: ${coverage.emittedRItems}.\n- Emitted F items after exact translation gate: ${coverage.emittedFItems}.\n- Translation-pending items: ${pending.rows.length}. Source-native evidence remains in the reviewed records.\n- Downgrades: トプカ candidate because 2026 recommendation freshness could not be proven; 目利きの銀次 candidate because current operation is unresolved; 温野菜 brand-menu items were not propagated to the exact branch.\n\n`+
          `## Canonical/runtime impact\n\n- Recommended restaurants: ${integration.before.recommendedRestaurants} → ${integration.after.recommendedRestaurants} (${integration.delta.recommendedRestaurants>=0?'+':''}${integration.delta.recommendedRestaurants}).\n- Featured restaurants: ${integration.before.featuredRestaurants} → ${integration.after.featuredRestaurants} (${integration.delta.featuredRestaurants>=0?'+':''}${integration.delta.featuredRestaurants}).\n- Any-display restaurants: ${integration.before.displayRestaurants} → ${integration.after.displayRestaurants} (${integration.delta.displayRestaurants>=0?'+':''}${integration.delta.displayRestaurants}).\n- Recommendation gap: ${integration.before.recommendationGap} → ${integration.after.recommendationGap} (${integration.delta.recommendationGap>=0?'+':''}${integration.delta.recommendationGap}).\n- New canonical recommendation evidence items: ${integration.newRecommendationEvidenceItems}.\n- New canonical featured evidence items: ${integration.newFeaturedEvidenceItems}.\n\n`+
          `## Integration and validation\n\n- Path: reviewed evidence → explicit approval digest → reviewed-evidence adapter → maintained detail-evidence merge → specificity correction → evidence audit → public reload/rebuild → integration audit.\n- Frozen catalog/Place IDs and public catalog names preserved. Historical evidence keys and reviewed provenance snapshots preserved.\n- Candidate/no-evidence/blocked rows did not leak into canonical evidence.\n- \`test_reviewed_agent_dish_evidence.mjs\` and \`test_agent_dish_integration.mjs\` passed.\n- Paid-API audit passed with 0 paid Google Data API calls.\n- Integration replay is idempotent: second replay produced zero tracked logical changes.\n- Ending integration commit before documentation: \`${integrationCommit}\`.\n`;
          fs.writeFileSync('logs/2026-09-14-e2e-dish-s5.md',text);
          NODE
          git add logs/2026-09-14-e2e-dish-s5.md
          git commit -m 'Document E2E-DISH S5 lifecycle'

      - name: Push completed S5 branch
        run: git push origin HEAD:agent-e2e-dish-s5-20260914

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-dish-s5-audit-v2
          path: |
            _audit/e2e-s5/
            /tmp/e2e-s5-first.sha
            /tmp/e2e-s5-second.sha
          if-no-files-found: ignore
          retention-days: 7
