name: Audit no-dish source strata once

on:
  push:
    branches: ["main"]
    paths:
      - "_ops/audit-no-dish-source-strata-once-2026-09-09.txt"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce policy and audit strata
        run: |
          set -euo pipefail
          node scripts/audit_no_paid_apis.mjs
          node --check scripts/audit_no_dish_source_strata.mjs
          node scripts/audit_no_dish_source_strata.mjs /tmp/no-dish-source-strata.json | tee /tmp/no-dish-source-strata-summary.txt
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: no-dish-source-strata-audit
          path: /tmp/no-dish-source-strata.json
          retention-days: 7
