name: Verify Google Places

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum candidates to process; 0 = all, -1 = half'
        required: true
        default: '100'
  push:
    branches: ["main"]
    paths:
      - '.github/run-half-google'

permissions:
  contents: write

concurrency:
  group: verify-google-places
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source candidates against Google Places
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAP_API }}
          GOOGLE_VERIFY_LIMIT: ${{ github.event_name == 'push' && '-1' || inputs.limit }}
        run: python scripts/verify_google_places.py
      - name: Commit identity-only verification state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/google_places_cache.json data/google_entities.generated.js
          git diff --cached --quiet && exit 0
          git commit -m "Update Google Place ID verification"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
