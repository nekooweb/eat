name: Audit official dish crawl errors once

on:
  push:
    branches: ["main"]
    paths:
      - "_ops/audit-official-dish-crawl-errors-once-2026-09-09.txt"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce zero-paid policy and syntax
        run: |
          node scripts/audit_no_paid_apis.mjs
          node --check scripts/collect_google_inventory_recommendations.mjs
      - name: Collect diagnostic-only official source crawl
        env:
          INVENTORY_DETAIL_FETCH_TIMEOUT_MS: '7000'
          INVENTORY_DETAIL_HOST_WORKERS: '24'
          INVENTORY_DETAIL_SITE_PAGE_LIMIT: '5'
          INVENTORY_DETAIL_MENU_LINK_LIMIT: '4'
          INVENTORY_DETAIL_DIAGNOSTICS_OUTPUT: '/tmp/official-crawl-diagnostics.json'
        run: |
          set -euo pipefail
          node scripts/collect_google_inventory_recommendations.mjs /tmp/ignored-evidence.json >/tmp/collector-summary.txt
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/official-crawl-diagnostics.json','utf8'));
          const failed=(d.rows||[]).filter(r=>r.status==='no_match_with_errors');
          function cls(text){
            const s=String(text||'');
            if(/HTTP 403/.test(s)) return 'http_403';
            if(/HTTP 404/.test(s)) return 'http_404';
            if(/HTTP 429/.test(s)) return 'http_429';
            if(/HTTP 5\d\d/.test(s)) return 'http_5xx';
            if(/HTTP \d{3}/.test(s)) return 'http_other';
            if(/non-html/i.test(s)) return 'non_html';
            if(/timeout|timed out|aborted/i.test(s)) return 'timeout';
            if(/certificate|cert_|ssl|tls/i.test(s)) return 'tls_certificate';
            if(/fetch failed|ECONN|ENOTFOUND|EAI_AGAIN|socket|network/i.test(s)) return 'network_fetch';
            return 'other';
          }
          const classCounts={};
          const hostCounts={};
          const samples={};
          for(const r of failed){
            const classes=new Set((r.errors||[]).map(cls));
            if(!classes.size) classes.add('no_error_text');
            for(const c of classes){
              classCounts[c]=(classCounts[c]||0)+1;
              if(!samples[c]) samples[c]=[];
              if(samples[c].length<8) samples[c].push({name:r.name,rootUrl:r.rootUrl,errors:r.errors});
            }
            try { const h=new URL(r.rootUrl).hostname; hostCounts[h]=(hostCounts[h]||0)+1; } catch {}
          }
          const report={
            summary:d.summary,
            failedRows:failed.length,
            errorClassCounts:Object.fromEntries(Object.entries(classCounts).sort((a,b)=>b[1]-a[1])),
            topFailedHosts:Object.fromEntries(Object.entries(hostCounts).sort((a,b)=>b[1]-a[1]).slice(0,20)),
            samples
          };
          fs.writeFileSync('/tmp/official-crawl-error-summary.json',JSON.stringify(report,null,2)+'\n');
          console.log('OFFICIAL_CRAWL_ERROR_AUDIT='+JSON.stringify(report));
          NODE
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: official-dish-crawl-error-audit
          path: |
            /tmp/official-crawl-diagnostics.json
            /tmp/official-crawl-error-summary.json
          retention-days: 7
