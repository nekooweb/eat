name: Run independent source review once

on:
  push:
    branches: ["main"]
    paths:
      - "_ops/run-independent-source-review-once-2026-09-09.txt"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch strict independent source review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run review-independent-dish-sources.yml --repo "$GITHUB_REPOSITORY" --ref main
