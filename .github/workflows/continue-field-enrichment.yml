name: Continue grouped field enrichment

on:
  push:
    branches:
      - continue-full-field-enrichment
    paths:
      - '.github/workflows/continue-field-enrichment.yml'
  workflow_dispatch:

concurrency:
  group: continue-field-enrichment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build starting baseline
        run: |
          set -o pipefail
          mkdir -p _audit
          node scripts/test_opening_hours.mjs
          node scripts/build_production_dataset.mjs | tee _audit/build-start.json

      - name: Refresh safe official-index fields
        env:
          OFFICIAL_INDEX_CONCURRENCY: '8'
          OFFICIAL_INDEX_TIMEOUT_MS: '12000'
          OFFICIAL_INDEX_MENU_LIMIT: '3'
          AUTO_OFFICIAL_CHECKED_AT: '2026-09-06'
        run: |
          set -o pipefail
          node scripts/extract_official_index_fields.mjs \
            data/official_candidate_index.json \
            _audit/official-index-candidates.json \
            | tee _audit/official-index-summary.json
          node scripts/build_auto_official_enrichment.mjs \
            _audit/official-index-candidates.json \
            data/source_enrichment_autoofficial.js \
            | tee _audit/official-auto-summary.json
          node scripts/build_production_dataset.mjs | tee _audit/build-after-official.json

      - name: Refresh trusted locator fields
        env:
          LOCATOR_TEMPLATE_CONCURRENCY: '8'
          LOCATOR_TEMPLATE_TIMEOUT_MS: '12000'
          LOCATOR_TEMPLATE_CHECKED_AT: '2026-09-06'
        run: |
          set -o pipefail
          node scripts/build_locator_template_fields.mjs \
            data/official_candidate_index.json \
            data/source_enrichment_zzlocatorauto.js \
            | tee _audit/locator-template-summary.json
          node scripts/filter_locator_resolution_conflicts.mjs \
            data/source_enrichment_zzlocatorauto.js \
            | tee _audit/locator-resolution-filter.json
          node scripts/build_production_dataset.mjs | tee _audit/build-after-locator.json

      - name: Refresh direct official opening hours
        env:
          SINGLE_SITE_HOURS_CONCURRENCY: '8'
          SINGLE_SITE_HOURS_TIMEOUT_MS: '12000'
          SINGLE_SITE_HOURS_CHECKED_AT: '2026-09-06'
        run: |
          set -o pipefail
          rm -f data/source_enrichment_zzzsinglehours.js
          node scripts/build_production_dataset.mjs > /tmp/single-hours-baseline.json
          node scripts/build_single_site_hours_enrichment.mjs \
            data/official_candidate_index.json \
            data/source_enrichment_zzzsinglehours.js \
            _audit/single-site-hours-review.json \
            | tee _audit/single-site-hours-summary.json
          node scripts/build_production_dataset.mjs | tee _audit/build-after-hours.json

      - name: Refresh explicit address and budget fields
        env:
          EXPLICIT_FIELDS_CONCURRENCY: '8'
          EXPLICIT_FIELDS_TIMEOUT_MS: '12000'
          EXPLICIT_FIELDS_CHECKED_AT: '2026-09-06'
        run: |
          set -o pipefail
          rm -f data/source_enrichment_zzzzexplicitfields.js
          node scripts/build_production_dataset.mjs > /tmp/explicit-fields-baseline.json
          node scripts/build_explicit_budget_address_enrichment.mjs \
            data/official_candidate_index.json \
            data/source_enrichment_zzzzexplicitfields.js \
            _audit/explicit-fields-review.json \
            | tee _audit/explicit-fields-summary.json
          node scripts/build_production_dataset.mjs | tee _audit/build-after-explicit.json

      - name: Refresh reviewed featured-dish templates
        env:
          FEATURED_TEMPLATE_CHECKED_AT: '2026-09-06'
        run: |
          set -o pipefail
          rm -f data/source_enrichment_zzzzzfeaturedtemplates.js
          node scripts/build_production_dataset.mjs > /tmp/featured-template-baseline.json
          node scripts/audit_featured_template_gaps.mjs | tee _audit/featured-template-gaps.json
          node scripts/build_featured_template_propagation.mjs \
            data/source_enrichment_zzzzzfeaturedtemplates.js \
            | tee _audit/featured-template-summary.json

      - name: Final rebuild and audits
        run: |
          set -o pipefail
          node scripts/build_production_dataset.mjs | tee _audit/build-final.json
          node scripts/audit_repository.mjs
          node scripts/audit_source_bindings.mjs
          node scripts/audit_normalized_fields.mjs
          node scripts/audit_area1_identity_coverage.mjs | tee _audit/identity-coverage.json
          node scripts/coverage_report.mjs | tee _audit/coverage-final.json
          node scripts/source_queue.mjs | tee _audit/source-queue-final.json
          node scripts/build_enrichment_queue.mjs | tee _audit/enrichment-queue-final.json
          node scripts/dish_gap_report.mjs | tee _audit/dish-gap-final.json

      - name: Upload grouped enrichment audit
        uses: actions/upload-artifact@v4
        with:
          name: grouped-field-enrichment-audit
          path: _audit
          retention-days: 3

      - name: Commit generated field refresh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/source_enrichment_autoofficial.js \
            data/source_enrichment_zzlocatorauto.js \
            data/source_enrichment_zzzsinglehours.js \
            data/source_enrichment_zzzzexplicitfields.js \
            data/source_enrichment_zzzzzfeaturedtemplates.js
          if git diff --cached --quiet; then
            echo 'No safe field changes.'
          else
            git commit -m 'Refresh safe official restaurant fields'
            git push origin HEAD:$TARGET_BRANCH
          fi
