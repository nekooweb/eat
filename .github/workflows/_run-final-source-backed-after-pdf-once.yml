name: One-shot final source-backed collector after PDF

on:
  push:
    branches:
      - main
    paths:
      - _ops/run-final-source-backed-after-pdf-once-2026-09-08.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch source-backed collector on merged PDF baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-google-inventory-details.yml --repo "$GITHUB_REPOSITORY" --ref main
