name: Enrich v5 currentness branch telephones

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/currentness-page-phone-enrichment-v2.yml"
      - "scripts/database/collect_currentness_labeled_telephone_v2.py"
      - "scripts/database/import_source_basic_web_evidence.py"
      - "data/google_basic_source_matches.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-web-field-evidence
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build baseline and collect v5-safe phones
        run: |
          set -euo pipefail
          mkdir -p _tmp
          node scripts/audit_no_paid_apis.mjs
          python -m py_compile scripts/database/collect_currentness_labeled_telephone_v2.py scripts/database/import_source_basic_web_evidence.py
          python scripts/database/build_master.py --output _tmp/before.sqlite --reset | tee _tmp/before.json
          python scripts/database/validate_master.py _tmp/before.sqlite
          python scripts/database/collect_currentness_labeled_telephone_v2.py \
            --database _tmp/before.sqlite --output _tmp/incoming.json --workers 8 | tee _tmp/collection.json
          python - <<'PY'
          import json,re
          d=json.load(open('_tmp/incoming.json')); p=d['policy']
          assert d['ruleVersion']=='source-basic-web-field-evidence-v2'
          assert p['paidDataApiCalls']==0 and p['googleDisplayPayloadPersisted'] is False
          assert p['freshNameAndLocationReconfirmationRequired'] is True
          assert p['explicitTelephoneLabelRequired'] is True and p['singleDistinctLabeledNumberRequired'] is True
          keys=[]
          for row in d['rows']:
            c=row['identityCheck']; e=row['webEvidence']; f=row['fieldClaims']
            assert c['accepted'] is True and c['identityRule']=='retained_multisource_currentness_page'
            assert c['preExistingSourceMatchedIdentity'] is True and c['freshNameAndLocationReconfirmed'] is True
            assert c['proximityOnlyBindingAllowed'] is False and c['locationConfirmed'] is True
            if c.get('retainedConsensusRule')=='reviewed-multisource-currentness-v5':
              assert c.get('currentnessMethod') in ('visible_branch_body_brand_locality_plus_strong_location','title_plus_visible_address_alias_aware','jsonld_name_location_alias_aware')
              if c.get('currentnessMethod')=='visible_branch_body_brand_locality_plus_strong_location':
                b=c.get('branchBodyEvidence') or {}
                assert b.get('branchSpecificUrl') is True and b.get('matchedDistinctiveNameComponents') and b.get('matchedLocalityFragments')
            assert re.fullmatch(r'[0-9a-f]{64}',str(e['contentHash'])) and str(e['finalUrl']).startswith('https://')
            assert f.get('telephone')
            keys.append((row['googlePlaceId'],e['finalUrl'],e['contentHash']))
          assert len(keys)==len(set(keys))
          print(json.dumps({'rows':len(keys),'summary':d['summary']},ensure_ascii=False,sort_keys=True))
          PY
      - name: Merge and validate telephone-only canonical delta
        run: |
          set -euo pipefail
          python scripts/database/merge_public_web_field_evidence.py \
            data/source_basic_web_field_evidence.json _tmp/incoming.json _tmp/merged.json | tee _tmp/merge.json
          cp _tmp/merged.json data/source_basic_web_field_evidence.json
          python scripts/database/build_master.py --output _tmp/after.sqlite --reset | tee _tmp/after.json
          python scripts/database/validate_master.py _tmp/after.sqlite
          python scripts/database/validate_ingestion_plan.py _tmp/after.sqlite
          python - <<'PY'
          import json
          b=json.load(open('_tmp/before.json')); a=json.load(open('_tmp/after.json')); c=json.load(open('_tmp/incoming.json'))
          bm=b['ingestionPlan']['fieldCompletionMissingCounts']; am=a['ingestionPlan']['fieldCompletionMissingCounts']
          assert am['telephone']<=bm['telephone']
          for key,value in bm.items():
            if key!='telephone': assert am.get(key)==value,(key,bm,am)
          effect={'evidenceRows':len(c['rows']),'telephoneMissingBefore':bm['telephone'],'telephoneMissingAfter':am['telephone'],'telephoneResolved':bm['telephone']-am['telephone']}
          json.dump(effect,open('_tmp/effect.json','w'),sort_keys=True)
          print(json.dumps(effect,sort_keys=True))
          PY
          node scripts/audit_no_paid_apis.mjs
      - name: Commit durable evidence against latest main
        run: |
          set -euo pipefail
          cp _tmp/incoming.json _tmp/incoming-final.json
          git restore -- data/source_basic_web_field_evidence.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B currentness-phone-v2 origin/main
            python scripts/database/merge_public_web_field_evidence.py \
              data/source_basic_web_field_evidence.json _tmp/incoming-final.json data/source_basic_web_field_evidence.json
            git add data/source_basic_web_field_evidence.json
            if git diff --cached --quiet; then
              echo "No new v5-safe currentness phone snapshots"
              exit 0
            fi
            git commit -m "Add v5 currentness telephone evidence"
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: currentness-page-phone-enrichment-v2
          path: _tmp/*.json
          if-no-files-found: warn
          retention-days: 3
