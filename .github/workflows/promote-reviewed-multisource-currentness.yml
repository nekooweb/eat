name: Promote reviewed multi-source currentness identities

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/promote-reviewed-multisource-currentness.yml"
      - "scripts/database/promote_reviewed_multisource_currentness.py"
      - "scripts/database/review_id_only_currentness_sources.py"
      - "scripts/database/review_id_only_currentness_sources_v2.py"
      - "scripts/database/audit_id_only_priority_identity_groups.py"
      - "scripts/database/collect_official_practical_fields.py"
      - "scripts/merge_basic_recovery_overlays.py"
      - "scripts/database/build_master.py"
      - "scripts/build_google_inventory_runtime.mjs"
      - "scripts/audit_google_inventory_runtime.mjs"
      - "data/google_basic_source_matches.json"
      - "data/hotpepper_catalog_facts.json"
      - "data/overture_area1_candidates.json"
      - "data/area1_enrichment_queue.json"
      - "data/area1_google_ids.json"

permissions:
  contents: write

concurrency:
  group: reviewed-multisource-currentness-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate promotion code and no-paid policy
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/database/promote_reviewed_multisource_currentness.py \
            scripts/database/review_id_only_currentness_sources.py \
            scripts/database/review_id_only_currentness_sources_v2.py \
            scripts/database/audit_id_only_priority_identity_groups.py \
            scripts/database/collect_official_practical_fields.py \
            scripts/merge_basic_recovery_overlays.py \
            scripts/database/build_master.py
          node scripts/audit_no_paid_apis.mjs

      - name: Build baseline master and runtime
        run: |
          set -euo pipefail
          mkdir -p _tmp
          python scripts/database/build_master.py --output _tmp/eat-master-before.sqlite --reset | tee _tmp/master-before.json
          python scripts/database/validate_master.py _tmp/eat-master-before.sqlite | tee _tmp/master-before-validate.json
          python scripts/database/validate_ingestion_plan.py _tmp/eat-master-before.sqlite | tee _tmp/master-before-plan-validate.json
          node scripts/build_google_inventory_runtime.mjs | tee _tmp/runtime-before-build.json
          node scripts/audit_google_inventory_runtime.mjs | tee _tmp/runtime-before-audit.json
          python - <<'PY'
          import json,sqlite3
          db=sqlite3.connect('_tmp/eat-master-before.sqlite')
          states=dict(db.execute('select identity_state,count(*) from catalog_entries group by identity_state'))
          m=json.load(open('_tmp/master-before.json'))
          snapshot={
            'states':states,
            'fieldTasks':m['ingestionPlan']['taskTypeCounts']['field_completion'],
            'missing':m['ingestionPlan']['fieldCompletionMissingCounts'],
            'telephoneKnown':m['telephoneKnown'],
            'recommendedDishesZhKnown':m['recommendedDishesZhKnown'],
            'featuredDishesZhKnown':m['featuredDishesZhKnown'],
          }
          json.dump(snapshot,open('_tmp/promotion-before.json','w'),sort_keys=True)
          print(json.dumps(snapshot,sort_keys=True))
          PY

      - name: Fresh alias-aware currentness review
        run: |
          set -euo pipefail
          python scripts/database/review_id_only_currentness_sources_v2.py \
            --database _tmp/eat-master-before.sqlite \
            --output _tmp/currentness-review.json \
            --workers 6 \
            | tee _tmp/currentness-review-summary.json
          python - <<'PY'
          import json
          d=json.load(open('_tmp/currentness-review.json'))
          assert d['ruleVersion']=='id-only-currentness-review-v2'
          p=d['policy']
          assert p['paidDataApiCalls']==0
          assert p['googleDisplayPayloadPersisted'] is False
          assert p['automaticIdentityPromotion'] is False
          assert p['proposalOnly'] is True
          assert p['nameAndLocationReconfirmationRequired'] is True
          ready=[r for r in d['rows'] if r.get('admissionReady') is True]
          for r in ready:
            assert r['group']=='hotpepper_high_direct_overture'
            assert r['hardHistoricalBindingGate'] is True
            assert r['hardDirectOvertureGate'] is True
            c=r['currentnessReview']; assert c['accepted'] is True
            assert c['bestCheck']['locationConfirmed'] is True
          print(json.dumps({'readyRows':len(ready),'readyPlaceIds':[r['googlePlaceId'] for r in ready]},ensure_ascii=False,sort_keys=True))
          PY

      - name: Build durable reviewed currentness overlay
        run: |
          set -euo pipefail
          python scripts/database/promote_reviewed_multisource_currentness.py \
            --database _tmp/eat-master-before.sqlite \
            --review _tmp/currentness-review.json \
            --base data/google_basic_source_matches.json \
            --hotpepper data/hotpepper_catalog_facts.json \
            --output _tmp/reviewed-currentness-overlay.json \
            | tee _tmp/reviewed-currentness-overlay-summary.json
          python - <<'PY'
          import json,re
          d=json.load(open('_tmp/reviewed-currentness-overlay.json'))
          assert d['ruleVersion']=='reviewed-multisource-currentness-v1'
          p=d['policy']
          assert p['newGoogleApiCalls']==0
          assert p['googleDisplayPayloadPersisted'] is False
          assert p['durableFieldsIndependentSourceOnly'] is True
          assert p['proximityOnlyBindingAllowed'] is False
          assert p['legacyVerifiedStateCreated'] is False
          assert p['targetIdentityState']=='source_matched'
          seen_pid=set(); seen_native=set(); seen_ov=set()
          for row in d['rows']:
            assert row['provider']=='Hot Pepper'
            assert row['matchLevel']==d['ruleVersion']
            assert row['googlePlaceId'] not in seen_pid
            native=(row['provider'],str(row['providerId']))
            assert native not in seen_native
            c=row['identityConsensus']
            assert c['policy']['sourceMatchedOnly'] is True
            assert c['policy']['legacyVerifiedStateCreated'] is False
            assert c['currentIndependentPage']['locationConfirmed'] is True
            assert str(c['currentIndependentPage']['url']).startswith('https://')
            assert re.fullmatch(r'[0-9a-f]{64}',str(c['currentIndependentPage']['contentHash']))
            ov=str(c['overtureSupport']['overtureId'])
            assert ov and ov not in seen_ov
            seen_pid.add(row['googlePlaceId']); seen_native.add(native); seen_ov.add(ov)
          print(json.dumps({'overlayRows':len(d['rows']),'placeIds':sorted(seen_pid)},ensure_ascii=False,sort_keys=True))
          PY

      - name: Merge working overlay
        run: |
          set -euo pipefail
          python scripts/merge_basic_recovery_overlays.py \
            data/google_basic_source_matches.json \
            _tmp/reviewed-currentness-overlay.json \
            data/google_basic_source_matches.json \
            | tee _tmp/reviewed-currentness-working-merge.json

      - name: Validate working master and runtime effect
        run: |
          set -euo pipefail
          node scripts/build_google_inventory_runtime.mjs | tee _tmp/runtime-after-build.json
          node scripts/audit_google_inventory_runtime.mjs | tee _tmp/runtime-after-audit.json
          python scripts/database/build_master.py --output _tmp/eat-master-after.sqlite --reset | tee _tmp/master-after.json
          python scripts/database/validate_master.py _tmp/eat-master-after.sqlite | tee _tmp/master-after-validate.json
          python scripts/database/validate_ingestion_plan.py _tmp/eat-master-after.sqlite | tee _tmp/master-after-plan-validate.json
          python - <<'PY'
          import json,sqlite3
          before=json.load(open('_tmp/promotion-before.json'))
          after_master=json.load(open('_tmp/master-after.json'))
          merge=json.load(open('_tmp/reviewed-currentness-working-merge.json'))
          overlay=json.load(open('_tmp/reviewed-currentness-overlay.json'))
          runtime_before=json.load(open('_tmp/runtime-before-audit.json'))
          runtime_after=json.load(open('_tmp/runtime-after-audit.json'))
          added=merge['added']
          assert added == len(overlay['rows']), (added,len(overlay['rows']))
          db=sqlite3.connect('_tmp/eat-master-after.sqlite')
          states=dict(db.execute('select identity_state,count(*) from catalog_entries group by identity_state'))
          assert states.get('verified',0) == before['states'].get('verified',0), (before['states'],states)
          assert states.get('id_only',0) == before['states'].get('id_only',0)-added, (before['states'],states,added)
          assert states.get('source_matched',0) == before['states'].get('source_matched',0)+added, (before['states'],states,added)
          assert runtime_after['canonicalRich'] == runtime_before['canonicalRich']
          assert runtime_after['inventoryTotal'] == runtime_before['inventoryTotal'] + added
          assert runtime_after['sourceBasic'] == runtime_before['sourceBasic'] + added
          assert runtime_after['unpublishedPlaceIdOnly'] == runtime_before['unpublishedPlaceIdOnly'] - added
          after_missing=after_master['ingestionPlan']['fieldCompletionMissingCounts']
          for key,value in before['missing'].items():
            assert after_missing.get(key,0) <= value,(key,value,after_missing.get(key,0))
          for row in overlay['rows']:
            pid=row['googlePlaceId']
            state=db.execute('select identity_state from catalog_entries where place_id=?',(pid,)).fetchone()
            assert state and state[0]=='source_matched',(pid,state)
            binding=db.execute('''select sb.binding_state from source_bindings sb join source_records sr on sr.source_record_id=sb.source_record_id where sb.place_id=? and sr.provider=? and sr.provider_id=?''',(pid,row['provider'],str(row['providerId']))).fetchall()
            assert binding and any(x[0]=='reviewed' for x in binding),(pid,binding)
          effect={
            'added':added,
            'beforeStates':before['states'],
            'afterStates':states,
            'runtimeBefore':runtime_before['inventoryTotal'],
            'runtimeAfter':runtime_after['inventoryTotal'],
            'missingBefore':before['missing'],
            'missingAfter':after_missing,
            'telephoneKnownBefore':before['telephoneKnown'],
            'telephoneKnownAfter':after_master['telephoneKnown'],
          }
          json.dump(effect,open('_tmp/promotion-effect.json','w'),sort_keys=True)
          print(json.dumps(effect,sort_keys=True))
          PY

      - name: Re-evaluate and commit on latest main
        run: |
          set -euo pipefail
          # Validation products are generated locally; only the durable basic-source file is committed.
          git restore -- data/google_basic_source_matches.json data/google_inventory_runtime.js 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B reviewed-currentness-promotion origin/main
            node scripts/audit_no_paid_apis.mjs
            python scripts/database/build_master.py --output _tmp/latest-before.sqlite --reset > _tmp/latest-before.json
            python scripts/database/validate_master.py _tmp/latest-before.sqlite > _tmp/latest-before-validate.json
            # Re-run the small currentness set on the actual latest branch; stale review artifacts never force a promotion.
            python scripts/database/review_id_only_currentness_sources_v2.py \
              --database _tmp/latest-before.sqlite \
              --output _tmp/latest-currentness-review.json \
              --workers 6 \
              > _tmp/latest-currentness-review-summary.json
            python scripts/database/promote_reviewed_multisource_currentness.py \
              --database _tmp/latest-before.sqlite \
              --review _tmp/latest-currentness-review.json \
              --base data/google_basic_source_matches.json \
              --hotpepper data/hotpepper_catalog_facts.json \
              --output _tmp/latest-currentness-overlay.json \
              > _tmp/latest-currentness-overlay-summary.json
            python scripts/merge_basic_recovery_overlays.py \
              data/google_basic_source_matches.json \
              _tmp/latest-currentness-overlay.json \
              data/google_basic_source_matches.json \
              | tee _tmp/latest-currentness-merge.json
            added=$(python - <<'PY'
          import json
          print(json.load(open('_tmp/latest-currentness-merge.json'))['added'])
          PY
            )
            if [ "$added" = "0" ]; then
              echo "No still-safe reviewed currentness identities on latest main."
              exit 0
            fi
            node scripts/build_google_inventory_runtime.mjs > _tmp/latest-runtime-build.json
            node scripts/audit_google_inventory_runtime.mjs > _tmp/latest-runtime-audit.json
            python scripts/database/build_master.py --output _tmp/latest-after.sqlite --reset > _tmp/latest-after.json
            python scripts/database/validate_master.py _tmp/latest-after.sqlite > _tmp/latest-after-validate.json
            python scripts/database/validate_ingestion_plan.py _tmp/latest-after.sqlite > _tmp/latest-after-plan-validate.json
            python - <<'PY'
          import json,sqlite3
          before=json.load(open('_tmp/latest-before.json'))
          after=json.load(open('_tmp/latest-after.json'))
          merge=json.load(open('_tmp/latest-currentness-merge.json'))
          overlay=json.load(open('_tmp/latest-currentness-overlay.json'))
          added=merge['added']; assert added==len(overlay['rows']) and added>0
          db=sqlite3.connect('_tmp/latest-after.sqlite')
          states=dict(db.execute('select identity_state,count(*) from catalog_entries group by identity_state'))
          before_states=before['identityStates']
          assert states.get('verified',0)==before_states.get('verified',0)
          assert states.get('id_only',0)==before_states.get('id_only',0)-added
          assert states.get('source_matched',0)==before_states.get('source_matched',0)+added
          for row in overlay['rows']:
            state=db.execute('select identity_state from catalog_entries where place_id=?',(row['googlePlaceId'],)).fetchone()
            assert state and state[0]=='source_matched'
          print(json.dumps({'added':added,'before':before_states,'after':states,'placeIds':[r['googlePlaceId'] for r in overlay['rows']]},sort_keys=True))
          PY
            git restore -- data/google_inventory_runtime.js 2>/dev/null || true
            git add data/google_basic_source_matches.json
            if git diff --cached --quiet; then
              echo "No durable basic-source change after latest validation."
              exit 0
            fi
            git commit -m "Promote reviewed multi-source currentness identities"
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep 2
          done
          echo "Unable to fast-forward reviewed currentness identities after three attempts." >&2
          exit 1

      - name: Upload promotion audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-multisource-currentness-promotion
          path: |
            _tmp/currentness-review.json
            _tmp/currentness-review-summary.json
            _tmp/reviewed-currentness-overlay.json
            _tmp/reviewed-currentness-overlay-summary.json
            _tmp/reviewed-currentness-working-merge.json
            _tmp/promotion-before.json
            _tmp/promotion-effect.json
            _tmp/master-before.json
            _tmp/master-before-validate.json
            _tmp/master-before-plan-validate.json
            _tmp/master-after.json
            _tmp/master-after-validate.json
            _tmp/master-after-plan-validate.json
            _tmp/runtime-before-audit.json
            _tmp/runtime-after-audit.json
            _tmp/latest-currentness-review.json
            _tmp/latest-currentness-overlay.json
            _tmp/latest-currentness-merge.json
            _tmp/latest-before.json
            _tmp/latest-after.json
            _tmp/latest-runtime-audit.json
          if-no-files-found: warn
          retention-days: 3
