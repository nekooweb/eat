name: Collect source-backed recommended dishes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-source-backed-recommended-dishes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main after serialized wait
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "DISH_BATCH_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Export SQLite-reviewed official source URL overlay
        run: |
          set -euo pipefail
          python scripts/database/export_reviewed_official_runtime_sources.py \
            --output data/reviewed_official_runtime_sources.json | tee /tmp/reviewed-official-runtime-sources-summary.json
          test -s data/reviewed_official_runtime_sources.json
          python - <<'PY'
          import json
          x=json.load(open('data/reviewed_official_runtime_sources.json',encoding='utf-8'))
          p=x.get('policy') or {}
          s=x.get('summary') or {}
          assert p.get('sameCollisionLogicAsSQLiteMaster') is True
          assert p.get('reviewedRowsOnly') is True
          assert p.get('conflictRowsPublished') is False
          assert p.get('paidGoogleDataApiCalls') == 0
          assert p.get('runtimeNameMutationAllowed') is False
          assert p.get('runtimeCoordinateMutationAllowed') is False
          assert p.get('runtimeIdentityMutationAllowed') is False
          assert s.get('catalogTotal') == 2804
          assert s.get('officialCandidateIndexRows') == 194
          assert s.get('conflictDeferredRows') == 1
          assert len(x.get('rows') or []) == s.get('reviewedRows')
          print(json.dumps(s,ensure_ascii=False,sort_keys=True))
          PY
      - name: Build current published runtime and dish queue
        run: |
          set -euo pipefail
          node scripts/build_hotpepper_rich_core_fallback.mjs
          node scripts/build_production_dataset.mjs
          node scripts/build_source_provenance.mjs
          node scripts/build_source_facts.mjs
          node scripts/build_google_inventory_runtime.mjs
          node scripts/audit_google_inventory_runtime.mjs
          node scripts/build_google_inventory_detail_queue.mjs data/google_inventory_detail_queue.json
      - name: Snapshot existing verified detail evidence
        run: |
          set -euo pipefail
          if [ -s data/google_inventory_detail_evidence.json ]; then
            cp data/google_inventory_detail_evidence.json /tmp/google_inventory_detail_evidence.previous.json
          else
            printf '{"schemaVersion":1,"policy":{"paidGoogleDataApiCalls":0},"rows":[],"summary":{}}\n' > /tmp/google_inventory_detail_evidence.previous.json
          fi
      - name: Mine retained official and third-party dish facts
        run: |
          set -euo pipefail
          node scripts/build_retained_dish_evidence.mjs \
            /tmp/retained-dish-evidence.json \
            data/dish_translation_pending.json | tee /tmp/retained-dish-summary.json
          test -s /tmp/retained-dish-evidence.json
          test -s data/dish_translation_pending.json
          node - <<'NODE'
          const fs = require('fs');
          const q = JSON.parse(fs.readFileSync('data/dish_translation_pending.json', 'utf8'));
          if (q.policy?.targetLanguage !== 'zh-CN' || q.policy?.sourceLanguageMayBeJapanese !== true) {
            throw new Error('dish translation queue must preserve source-native/Japanese evidence and target zh-CN');
          }
          if ((q.rows || []).some((row) => !row.sourceName || !row.sourceUrl || row.status !== 'needs_zh_normalization')) {
            throw new Error('invalid dish translation pending row');
          }
          console.log(JSON.stringify(q.summary));
          NODE
      - name: Mine retained Hot Pepper promotional dish text
        run: |
          set -euo pipefail
          node scripts/build_retained_hotpepper_promotional_dish_evidence.mjs \
            /tmp/retained-hotpepper-promotional-dish-evidence.json | tee /tmp/retained-hotpepper-promotional-dish-summary.json
          test -s /tmp/retained-hotpepper-promotional-dish-evidence.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/retained-hotpepper-promotional-dish-evidence.json', 'utf8'));
          if (x.policy?.networkRequests !== 0 || x.policy?.paidGoogleDataApiCalls !== 0) {
            throw new Error('retained Hot Pepper promotional mining must be network-free');
          }
          if (x.policy?.recommendationRequiresExplicitMarker !== true || x.policy?.genericFallbackAllowed !== false) {
            throw new Error('retained Hot Pepper promotional mining semantic policy mismatch');
          }
          console.log(JSON.stringify(x.summary));
          NODE
      - name: Collect current official-site and retained Hot Pepper evidence
        env:
          INVENTORY_DETAIL_FETCH_TIMEOUT_MS: "7000"
          INVENTORY_DETAIL_HOST_WORKERS: "24"
          INVENTORY_DETAIL_SITE_PAGE_LIMIT: "5"
          INVENTORY_DETAIL_MENU_LINK_LIMIT: "4"
        run: |
          set -euo pipefail
          node scripts/collect_google_inventory_recommendations.mjs /tmp/fresh-dish-evidence.json | tee /tmp/fresh-dish-summary.json
          test -s /tmp/fresh-dish-evidence.json
      - name: Collect bounded official sitemap menu evidence
        env:
          OFFICIAL_SITEMAP_FETCH_TIMEOUT_MS: "7000"
          OFFICIAL_SITEMAP_WORKERS: "16"
          OFFICIAL_SITEMAP_CHILD_LIMIT: "3"
          OFFICIAL_SITEMAP_MENU_PAGE_LIMIT: "3"
        run: |
          set -euo pipefail
          node scripts/collect_official_sitemap_dish_evidence.mjs \
            /tmp/official-sitemap-dish-evidence.json | tee /tmp/official-sitemap-dish-summary.json
          test -s /tmp/official-sitemap-dish-evidence.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/official-sitemap-dish-evidence.json', 'utf8'));
          if (x.policy?.paidGoogleDataApiCalls !== 0 || x.policy?.crossOriginUrlsAllowed !== false) {
            throw new Error('official sitemap pass violated source boundary');
          }
          if (x.policy?.recommendationRequiresExplicitMarker !== true || x.policy?.ordinaryMenuItemsAreFeaturedOnly !== true) {
            throw new Error('official sitemap dish semantic policy mismatch');
          }
          console.log(JSON.stringify(x.summary));
          NODE
      - name: Merge and specificity-correct evidence monotonically
        run: |
          set -euo pipefail
          node scripts/merge_google_inventory_detail_evidence.mjs \
            /tmp/google_inventory_detail_evidence.previous.json \
            /tmp/retained-dish-evidence.json \
            /tmp/dish-evidence-retained-merged.json | tee /tmp/retained-merge-summary.json
          node scripts/merge_google_inventory_detail_evidence.mjs \
            /tmp/dish-evidence-retained-merged.json \
            /tmp/retained-hotpepper-promotional-dish-evidence.json \
            /tmp/dish-evidence-retained-promotional-merged.json | tee /tmp/retained-hotpepper-promotional-merge-summary.json
          node scripts/merge_google_inventory_detail_evidence.mjs \
            /tmp/dish-evidence-retained-promotional-merged.json \
            /tmp/fresh-dish-evidence.json \
            /tmp/dish-evidence-fresh-merged.json | tee /tmp/fresh-merge-summary.json
          node scripts/merge_google_inventory_detail_evidence.mjs \
            /tmp/dish-evidence-fresh-merged.json \
            /tmp/official-sitemap-dish-evidence.json \
            data/google_inventory_detail_evidence.json | tee /tmp/official-sitemap-merge-summary.json
          node scripts/correct_dish_specificity_evidence.mjs \
            data/google_inventory_detail_evidence.json \
            data/google_inventory_detail_evidence.json | tee /tmp/dish-specificity-correction-summary.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('data/google_inventory_detail_evidence.json', 'utf8'));
          const p = x.policy || {};
          const s = x.summary?.specificityCorrection || {};
          if (p.dishSpecificityCorrection !== 'source-native-composite-v1') throw new Error('dish specificity correction policy missing');
          if (p.dishSpecificityCorrectionUsesSourceNativeEvidenceOnly !== true) throw new Error('specificity correction must require source-native evidence');
          if (p.dishSpecificityCorrectionCuisineInferenceAllowed !== false || p.dishSpecificityCorrectionBrandInferenceAllowed !== false) throw new Error('specificity correction inference boundary failed');
          if (p.dishSpecificityCorrectionPaidGoogleDataApiCalls !== 0) throw new Error('specificity correction violated zero-paid policy');
          if (!Number.isInteger(Number(s.correctedItems || 0)) || Number(s.correctedItems || 0) < 0) throw new Error('invalid specificity correction count');
          const invalid = [];
          for (const row of x.rows || []) {
            for (const item of [...(row.recommendedDishes || []), ...(row.featuredDishes || [])]) {
              const source = `${item.nameJa || ''} ${item.nameOriginal || ''} ${item.evidenceSnippet || ''}`;
              if (item.nameZh === '荞麦面' && /鉄板焼(?:き)?そば|焼きそば|焼そば/i.test(source)) invalid.push([row.googlePlaceId, item.nameZh, source]);
              if (item.nameZh === '寿司' && /肉寿司/i.test(source)) invalid.push([row.googlePlaceId, item.nameZh, source]);
            }
          }
          if (invalid.length) throw new Error(`specificity correction left ${invalid.length} known composite-term misclassifications`);
          console.log(JSON.stringify(s));
          NODE
          node scripts/audit_google_inventory_detail_evidence.mjs
      - name: Rebuild runtime, queue and deterministic bulk plans
        run: |
          set -euo pipefail
          node scripts/build_google_inventory_runtime.mjs
          node scripts/audit_google_inventory_runtime.mjs
          node scripts/build_google_inventory_detail_queue.mjs data/google_inventory_detail_queue.json
          node scripts/build_dish_batch_plan.mjs data/dish_batch_plan.json 8 | tee /tmp/dish-batch-plan-summary.json
          node scripts/build_independent_dish_source_candidate_plan.mjs data/independent_dish_source_candidates.json 8 | tee /tmp/independent-dish-source-candidate-summary.json
          node - <<'NODE'
          const fs = require('fs');
          const q = JSON.parse(fs.readFileSync('data/google_inventory_detail_queue.json', 'utf8'));
          const plan = JSON.parse(fs.readFileSync('data/dish_batch_plan.json', 'utf8'));
          const candidates = JSON.parse(fs.readFileSync('data/independent_dish_source_candidates.json', 'utf8'));
          if (q.summary.catalogTotal !== 2804 || !q.summary.runtimeBaselineComplete) {
            throw new Error('frozen 2,804 Place-ID catalog baseline must remain complete');
          }
          if (q.summary.publicRuntimeTotal <= 0 || q.summary.publicRuntimeTotal + q.summary.unpublishedPlaceIdOnly !== 2804) {
            throw new Error('named public + unpublished Place-ID-only counts must reconcile');
          }
          const allowedRecommendationActions = new Set([
            'collect_strict_recommended_dishes',
            'extract_retained_dish_source',
            'find_independent_dish_source'
          ]);
          const invalidRecommendationTask = q.rows.find((row) => row.recommendedDishesKnown === 0 && !allowedRecommendationActions.has(row.nextAction));
          if (invalidRecommendationTask) {
            throw new Error(`recommendation gap lost recommendation-first priority: ${invalidRecommendationTask.googlePlaceId}: ${invalidRecommendationTask.nextAction}`);
          }
          if (plan.policy?.paidGoogleDataApiCalls !== 0 || plan.policy?.targetLanguage !== 'zh-CN' || plan.summary?.shards !== 8) {
            throw new Error('invalid deterministic dish bulk plan contract');
          }
          if ((plan.rows || []).some((row) => row.shard < 0 || row.shard >= 8 || !row.googlePlaceId || !row.lane)) {
            throw new Error('invalid dish bulk plan row');
          }
          if (candidates.policy?.proposalOnly !== true || candidates.policy?.identityBindingChanges !== 0 || candidates.policy?.networkRequests !== 0) {
            throw new Error('independent dish source plan must remain proposal-only and network-free');
          }
          if (candidates.policy?.proximityOnlyBindingAllowed !== false || candidates.policy?.dishEvidencePromotionBeforeIdentityReviewAllowed !== false) {
            throw new Error('independent dish source candidate identity boundary failed');
          }
          if (candidates.summary?.currentIndependentDishSourceGap !== q.summary.recommendationGapNeedingNewDishSource || candidates.summary?.shards !== 8) {
            throw new Error('independent dish source candidate plan is stale relative to rebuilt queue');
          }
          console.log(JSON.stringify({ queue: q.summary, batchPlan: plan.summary, independentCandidates: candidates.summary }));
          NODE
      - name: Commit detailed evidence, reviewed source overlay, queue and bulk plans
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/reviewed_official_runtime_sources.json \
            data/google_inventory_detail_evidence.json \
            data/google_inventory_detail_queue.json \
            data/google_inventory_runtime.js \
            data/dish_translation_pending.json \
            data/dish_batch_plan.json \
            data/independent_dish_source_candidates.json
          if git diff --cached --quiet; then
            echo "No inventory detail/source-overlay/plan changes to commit."
            exit 0
          fi
          git commit -m "Update source-backed recommended dish evidence"
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

  validate_database:
    needs: collect
    permissions:
      contents: read
    uses: ./.github/workflows/database-contract.yml
    with:
      sync_main: true
