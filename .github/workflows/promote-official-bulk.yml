name: Promote official bulk fields

on:
  push:
    branches: ["bulk-enrichment-under-2usd"]
    paths:
      - 'scripts/promote_official_index.mjs'
      - 'scripts/extract_official_index_fields.mjs'
      - 'scripts/build_auto_official_enrichment.mjs'
      - '.github/workflows/promote-official-bulk.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: bulk-enrichment-under-2usd
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build baseline canonical dataset
        run: node scripts/build_production_dataset.mjs
      - name: Download prior zero-persistence official discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _seed
          mkdir -p _seed
          gh run download 33974475744 --repo nekooweb/eat -n official-extraction-review -D _seed
          test -s _seed/google_official_site_candidates.json
      - name: Promote independently fetched official URLs to maintenance index
        run: node scripts/promote_official_index.mjs _seed/google_official_site_candidates.json data/official_candidate_index.json | tee /tmp/official-index-summary.json
      - name: Fetch official pages and menu pages without Google API
        env:
          OFFICIAL_INDEX_CONCURRENCY: '5'
          OFFICIAL_INDEX_TIMEOUT_MS: '15000'
          OFFICIAL_INDEX_MENU_LIMIT: '3'
        run: |
          mkdir -p _audit
          node scripts/extract_official_index_fields.mjs data/official_candidate_index.json _audit/official_index_field_candidates.json | tee _audit/official-index-extraction-summary.json
      - name: Build conservative source enrichment
        env:
          AUTO_OFFICIAL_CHECKED_AT: '2026-09-06'
        run: node scripts/build_auto_official_enrichment.mjs _audit/official_index_field_candidates.json data/source_enrichment_autoofficial.js | tee _audit/official-auto-enrichment-summary.json
      - name: Rebuild and audit production
        run: |
          node scripts/build_production_dataset.mjs | tee _audit/build-after-official.json
          node scripts/audit_repository.mjs
          node scripts/audit_source_bindings.mjs
          node scripts/audit_normalized_fields.mjs
          node scripts/coverage_report.mjs | tee _audit/coverage-after-official.json
          node scripts/source_queue.mjs | tee _audit/source-queue-after-official.json
      - name: Upload bulk enrichment audit
        uses: actions/upload-artifact@v4
        with:
          name: official-bulk-enrichment-audit
          path: _audit
          retention-days: 3
      - name: Commit generated official maintenance data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official_candidate_index.json data/source_enrichment_autoofficial.js
          if git diff --cached --quiet; then
            echo 'No generated data changes.'
          else
            git commit -m 'Promote bulk official source fields'
            if ! git push origin HEAD:bulk-enrichment-under-2usd; then
              git pull --rebase origin bulk-enrichment-under-2usd
              git push origin HEAD:bulk-enrichment-under-2usd
            fi
          fi
