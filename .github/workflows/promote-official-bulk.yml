name: Promote official bulk fields

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure reusable official index exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [ -s data/official_candidate_index.json ]; then
            echo 'Using persisted independently fetched official index.'
          else
            rm -rf _seed
            mkdir -p _seed
            gh run download 33974475744 --repo nekooweb/eat -n official-extraction-review -D _seed
            test -s _seed/google_official_site_candidates.json
            node scripts/promote_official_index.mjs _seed/google_official_site_candidates.json data/official_candidate_index.json
          fi
      - name: Build stable baseline
        run: |
          set -o pipefail
          # Keep the previous auto-official shard in place. The incremental
          # builder preserves reviewed fields when a website temporarily fails.
          node scripts/build_production_dataset.mjs | tee /tmp/stable-official-baseline.json
      - name: Fetch official and menu pages in parallel without Google API
        env:
          OFFICIAL_INDEX_CONCURRENCY: '8'
          OFFICIAL_INDEX_TIMEOUT_MS: '12000'
          OFFICIAL_INDEX_MENU_LIMIT: '3'
        run: |
          set -o pipefail
          mkdir -p _audit
          node scripts/extract_official_index_fields.mjs \
            data/official_candidate_index.json \
            _audit/official_index_field_candidates.json \
            | tee _audit/official-index-extraction-summary.json
      - name: Auto-promote only A-confidence official fields
        env:
          AUTO_OFFICIAL_CHECKED_AT: '2026-09-06'
        run: |
          set -o pipefail
          node scripts/build_auto_official_enrichment.mjs \
            _audit/official_index_field_candidates.json \
            data/source_enrichment_autoofficial.js \
            | tee _audit/official-auto-enrichment-summary.json
      - name: Rebuild after automatic promotion
        run: |
          set -o pipefail
          node scripts/build_production_dataset.mjs | tee _audit/build-after-official.json
      - name: Build B-confidence fast review queue
        run: |
          set -o pipefail
          node scripts/build_official_fast_review_queue.mjs \
            _audit/official_index_field_candidates.json \
            _audit/official_fast_review_queue.json \
            | tee _audit/official-fast-review-summary.json
      - name: Audit production and coverage
        run: |
          set -o pipefail
          node scripts/audit_repository.mjs
          node scripts/audit_source_bindings.mjs
          node scripts/audit_normalized_fields.mjs
          node scripts/coverage_report.mjs | tee _audit/coverage-after-official.json
          node scripts/source_queue.mjs | tee _audit/source-queue-after-official.json
          node scripts/build_enrichment_queue.mjs | tee _audit/enrichment-queue-after-official.json
          node scripts/dish_gap_report.mjs | tee _audit/dish-gap-after-official.json
      - name: Upload bulk enrichment audit
        uses: actions/upload-artifact@v4
        with:
          name: official-bulk-enrichment-audit
          path: _audit
          retention-days: 3
      - name: Commit stable generated official maintenance data
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official_candidate_index.json data/source_enrichment_autoofficial.js
          if git diff --cached --quiet; then
            echo 'No generated data changes.'
          else
            git commit -m 'Refresh high-confidence official source fields'
            if ! git push origin HEAD:$TARGET_BRANCH; then
              git pull --rebase origin $TARGET_BRANCH
              git push origin HEAD:$TARGET_BRANCH
            fi
          fi
