name: Promote reviewed multi-source currentness identities v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviewed-multisource-currentness-promotion-v2
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate code and no-paid policy
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/database/promote_reviewed_multisource_currentness.py \
            scripts/database/review_id_only_currentness_sources.py \
            scripts/database/review_id_only_currentness_sources_v2.py \
            scripts/database/audit_id_only_priority_identity_groups.py \
            scripts/database/collect_official_practical_fields.py \
            scripts/merge_basic_recovery_overlays.py \
            scripts/database/build_master.py
          node scripts/audit_no_paid_apis.mjs

      - name: Re-evaluate latest main, validate, and commit
        run: |
          set -euo pipefail
          mkdir -p _tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B reviewed-currentness-v2 origin/main
            node scripts/audit_no_paid_apis.mjs

            python scripts/database/build_master.py --output _tmp/before.sqlite --reset | tee _tmp/before-master.json
            python scripts/database/validate_master.py _tmp/before.sqlite | tee _tmp/before-master-validate.json
            python scripts/database/validate_ingestion_plan.py _tmp/before.sqlite | tee _tmp/before-plan-validate.json
            node scripts/build_google_inventory_runtime.mjs | tee _tmp/before-runtime-build.json
            node scripts/audit_google_inventory_runtime.mjs | tee _tmp/before-runtime-audit.json

            python scripts/database/review_id_only_currentness_sources_v2.py \
              --database _tmp/before.sqlite \
              --output _tmp/currentness-review.json \
              --workers 6 \
              | tee _tmp/currentness-review-summary.json

            python scripts/database/promote_reviewed_multisource_currentness.py \
              --database _tmp/before.sqlite \
              --review _tmp/currentness-review.json \
              --base data/google_basic_source_matches.json \
              --hotpepper data/hotpepper_catalog_facts.json \
              --output _tmp/promotion-overlay.json \
              | tee _tmp/promotion-overlay-summary.json

            python - <<'PY'
          import json,re
          review=json.load(open('_tmp/currentness-review.json'))
          overlay=json.load(open('_tmp/promotion-overlay.json'))
          assert review['ruleVersion']=='id-only-currentness-review-v2'
          assert overlay['ruleVersion']=='reviewed-multisource-currentness-v1'
          rp=review['policy']; op=overlay['policy']
          assert rp['paidDataApiCalls']==0 and rp['googleDisplayPayloadPersisted'] is False
          assert rp['proposalOnly'] is True and rp['nameAndLocationReconfirmationRequired'] is True
          assert op['newGoogleApiCalls']==0 and op['googleDisplayPayloadPersisted'] is False
          assert op['durableFieldsIndependentSourceOnly'] is True
          assert op['legacyVerifiedStateCreated'] is False and op['targetIdentityState']=='source_matched'
          ready=[r for r in review['rows'] if r.get('admissionReady') is True]
          assert len(overlay['rows']) <= len(ready)
          seen_pid=set(); seen_native=set(); seen_overture=set()
          for row in overlay['rows']:
              pid=row['googlePlaceId']; assert pid not in seen_pid
              native=(row['provider'],str(row['providerId'])); assert native not in seen_native
              c=row['identityConsensus']; page=c['currentIndependentPage']
              assert row['provider']=='Hot Pepper'
              assert row['matchLevel']==overlay['ruleVersion']
              assert c['policy']['sourceMatchedOnly'] is True
              assert c['policy']['legacyVerifiedStateCreated'] is False
              assert page['locationConfirmed'] is True
              assert str(page['url']).startswith('https://')
              assert re.fullmatch(r'[0-9a-f]{64}',str(page['contentHash']))
              overture=str(c['overtureSupport']['overtureId']); assert overture and overture not in seen_overture
              seen_pid.add(pid); seen_native.add(native); seen_overture.add(overture)
          print(json.dumps({'reviewReady':len(ready),'overlayRows':len(overlay['rows']),'placeIds':sorted(seen_pid)},ensure_ascii=False,sort_keys=True))
          PY

            python scripts/merge_basic_recovery_overlays.py \
              data/google_basic_source_matches.json \
              _tmp/promotion-overlay.json \
              data/google_basic_source_matches.json \
              | tee _tmp/promotion-merge.json

            added=$(python - <<'PY'
          import json
          print(json.load(open('_tmp/promotion-merge.json'))['added'])
          PY
            )
            if [ "$added" = "0" ]; then
              git restore -- data/google_inventory_runtime.js data/google_basic_source_matches.json 2>/dev/null || true
              echo "No still-safe reviewed currentness identities on latest main."
              exit 0
            fi

            node scripts/build_google_inventory_runtime.mjs | tee _tmp/after-runtime-build.json
            node scripts/audit_google_inventory_runtime.mjs | tee _tmp/after-runtime-audit.json
            python scripts/database/build_master.py --output _tmp/after.sqlite --reset | tee _tmp/after-master.json
            python scripts/database/validate_master.py _tmp/after.sqlite | tee _tmp/after-master-validate.json
            python scripts/database/validate_ingestion_plan.py _tmp/after.sqlite | tee _tmp/after-plan-validate.json
            # Repeat from scratch once to catch any non-idempotent importer/resolver behavior.
            python scripts/database/build_master.py --output _tmp/after-repeat.sqlite --reset > _tmp/after-repeat-master.json
            python scripts/database/validate_master.py _tmp/after-repeat.sqlite > _tmp/after-repeat-master-validate.json

            python - <<'PY'
          import json,sqlite3
          before=json.load(open('_tmp/before-master.json'))
          after=json.load(open('_tmp/after-master.json'))
          repeat=json.load(open('_tmp/after-repeat-master.json'))
          merge=json.load(open('_tmp/promotion-merge.json'))
          overlay=json.load(open('_tmp/promotion-overlay.json'))
          rb=json.load(open('_tmp/before-runtime-audit.json'))
          ra=json.load(open('_tmp/after-runtime-audit.json'))
          added=merge['added']
          assert added==len(overlay['rows']) and added>0,(added,len(overlay['rows']))
          bs=before['identityStates']; aas=after['identityStates']; rs=repeat['identityStates']
          assert aas==rs,(aas,rs)
          assert aas.get('verified',0)==bs.get('verified',0),(bs,aas)
          assert aas.get('id_only',0)==bs.get('id_only',0)-added,(bs,aas,added)
          assert aas.get('source_matched',0)==bs.get('source_matched',0)+added,(bs,aas,added)
          assert ra['canonicalRich']==rb['canonicalRich']
          assert ra['inventoryTotal']==rb['inventoryTotal']+added
          assert ra['sourceBasic']==rb['sourceBasic']+added
          assert ra['unpublishedPlaceIdOnly']==rb['unpublishedPlaceIdOnly']-added
          assert ra['uniquePlaceIds']==ra['inventoryTotal']

          before_missing=before['ingestionPlan']['fieldCompletionMissingCounts']
          after_missing=after['ingestionPlan']['fieldCompletionMissingCounts']
          field_gain={}
          for key,value in before_missing.items():
              new_missing=after_missing.get(key,0)
              # Adding N newly publishable restaurants may add at most N missing values
              # for any field. Convert that delta into how many of the new restaurants
              # already arrived with the field known.
              assert new_missing <= value+added,(key,value,new_missing,added)
              known_among_new=added-(new_missing-value)
              assert 0 <= known_among_new <= added,(key,known_among_new)
              field_gain[key]=known_among_new
          before_tasks=before['ingestionPlan']['taskTypeCounts']['field_completion']
          after_tasks=after['ingestionPlan']['taskTypeCounts']['field_completion']
          assert after_tasks <= before_tasks+added,(before_tasks,after_tasks,added)

          db=sqlite3.connect('_tmp/after.sqlite')
          per_place={}
          for row in overlay['rows']:
              pid=row['googlePlaceId']
              state=db.execute('select identity_state from catalog_entries where place_id=?',(pid,)).fetchone()
              assert state and state[0]=='source_matched',(pid,state)
              binding=db.execute('''select sb.binding_state from source_bindings sb join source_records sr on sr.source_record_id=sb.source_record_id where sb.place_id=? and sr.provider=? and sr.provider_id=?''',(pid,row['provider'],str(row['providerId']))).fetchall()
              assert binding and any(x[0]=='reviewed' for x in binding),(pid,binding)
              known={k for k, in db.execute("select field_key from field_resolutions where place_id=? and resolution_state='known'",(pid,))}
              per_place[pid]=sorted(known)

          effect={
              'added':added,
              'placeIds':[r['googlePlaceId'] for r in overlay['rows']],
              'beforeStates':bs,'afterStates':aas,
              'runtimeBefore':rb['inventoryTotal'],'runtimeAfter':ra['inventoryTotal'],
              'runtimeKnownGains':{
                  'coordinates':ra['withCoordinates']-rb['withCoordinates'],
                  'cuisine':ra['cuisineKnown']-rb['cuisineKnown'],
                  'dinnerBudget':ra['dinnerBudgetKnown']-rb['dinnerBudgetKnown'],
                  'hours':ra['hoursKnown']-rb['hoursKnown'],
                  'recommendedDishes':ra['recommendedDishesKnown']-rb['recommendedDishesKnown'],
                  'featuredDishes':ra['featuredDishesKnown']-rb['featuredDishesKnown'],
              },
              'strictMissingBefore':before_missing,
              'strictMissingAfter':after_missing,
              'strictKnownAmongNew':field_gain,
              'perPlaceKnownResolutionKeys':per_place,
          }
          json.dump(effect,open('_tmp/promotion-effect.json','w'),ensure_ascii=False,indent=2,sort_keys=True)
          print(json.dumps(effect,ensure_ascii=False,sort_keys=True))
          PY

            git restore -- data/google_inventory_runtime.js 2>/dev/null || true
            git add data/google_basic_source_matches.json
            if git diff --cached --quiet; then
              echo "No durable basic-source change after validation."
              exit 0
            fi
            git commit -m "Promote reviewed multi-source currentness identities"
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --hard HEAD~1
            git restore -- data/google_inventory_runtime.js 2>/dev/null || true
            sleep 2
          done

          echo "Unable to fast-forward reviewed currentness identities after three attempts." >&2
          exit 1

      - name: Upload promotion audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-multisource-currentness-promotion-v2
          path: |
            _tmp/currentness-review.json
            _tmp/currentness-review-summary.json
            _tmp/promotion-overlay.json
            _tmp/promotion-overlay-summary.json
            _tmp/promotion-merge.json
            _tmp/promotion-effect.json
            _tmp/before-master.json
            _tmp/before-master-validate.json
            _tmp/before-plan-validate.json
            _tmp/before-runtime-audit.json
            _tmp/after-master.json
            _tmp/after-master-validate.json
            _tmp/after-plan-validate.json
            _tmp/after-repeat-master.json
            _tmp/after-repeat-master-validate.json
            _tmp/after-runtime-audit.json
          if-no-files-found: warn
          retention-days: 3
