name: Reconcile Area1 catalog with Overture

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overture-catalog-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs

      - name: Install DuckDB
        run: python -m pip install 'duckdb>=1.3,<2'

      - name: Build current Overture Area1 snapshot
        env:
          OVERTURE_RELEASE: '2026-08-19.0'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_overture_area1.py data/overture_area1_candidates.json \
            | tee /tmp/overture_area1_summary.json
          test -s data/overture_area1_candidates.json

      - name: Cross-check historical OSM candidates with Overture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_open_identity_reconciliation.py \
            data/overture_area1_candidates.json \
            data/open_identity_reconciliation.json \
            | tee /tmp/open_identity_reconciliation_summary.json
          test -s data/open_identity_reconciliation.json
          python - <<'PY'
          import json
          o=json.load(open('data/overture_area1_candidates.json', encoding='utf-8'))
          r=json.load(open('data/open_identity_reconciliation.json', encoding='utf-8'))
          assert o['release']=='2026-08-19.0', o.get('release')
          assert o['policy']['paidApiCalls']==0
          assert r['policy']['paidApiCalls']==0
          assert r['policy']['automaticPromotion'] is False
          assert r['summary']['legacyRowsCompared'] > 0
          print(json.dumps({'overture':o['summary'],'reconciliation':r['summary']}, ensure_ascii=False, indent=2))
          PY

      - name: Commit open-source staging and reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overture_area1_candidates.json data/open_identity_reconciliation.json
          if git diff --cached --quiet; then
            echo "No Overture/reconciliation changes to commit."
            exit 0
          fi
          git commit -m "Load Overture facts for full Area1 catalog"
          git push
