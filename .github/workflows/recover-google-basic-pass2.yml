name: Recover remaining Google basics pass 2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recover-google-basic-pass2.yml"
      - "scripts/recover_google_inventory_basic_pass2.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-google-basic-pass2
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Download original Google sweep audit
        uses: actions/download-artifact@v5
        with:
          name: full-area1-collection-private-audit
          path: _private_google/initial
          github-token: ${{ github.token }}
          repository: nekooweb/eat
          run-id: 34018919233
      - name: Download retry Google sweep audit
        uses: actions/download-artifact@v5
        with:
          name: full-area1-retry-private-audit
          path: _private_google/retry
          github-token: ${{ github.token }}
          repository: nekooweb/eat
          run-id: 34019078280
      - name: Recover second-pass strong basics
        run: |
          set -euo pipefail
          python3 scripts/recover_google_inventory_basic_pass2.py | tee /tmp/google-basic-pass2-summary.json
          test -s data/google_basic_source_matches.json
      - name: Rebuild exact runtime and validate
        run: |
          set -euo pipefail
          node scripts/build_hotpepper_rich_core_fallback.mjs
          node scripts/build_production_dataset.mjs
          node scripts/build_source_provenance.mjs
          node scripts/build_source_facts.mjs
          node scripts/build_google_inventory_runtime.mjs
          node scripts/audit_google_inventory_runtime.mjs
          python3 - <<'PY'
          import json
          d=json.load(open('data/google_basic_source_matches.json'))
          assert d['inventoryCount']==2804
          assert d['policy']['paidGoogleApiCalls']==0
          assert d['policy']['googleDisplayPayloadPersisted'] is False
          assert d['policy']['lowConfidenceMatchesExcluded'] is True
          ids=[r['googlePlaceId'] for r in d['rows']]
          assert len(ids)==len(set(ids))
          assert d['summary']['basicReadyTotal'] + d['summary']['identityOnlyRemaining'] == 2804
          assert d['summary']['pass2NewMatches'] >= 0
          print(json.dumps(d['summary'],ensure_ascii=False))
          PY
      - name: Upload private match audit
        uses: actions/upload-artifact@v4
        with:
          name: google-basic-pass2-private-audit
          path: _audit/google_basic_pass2_private.json
          retention-days: 3
      - name: Commit recovered basics and runtime
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google_basic_source_matches.json data/google_inventory_runtime.js
          if git diff --cached --quiet; then
            echo "No second-pass basic changes."
            exit 0
          fi
          git commit -m "Recover more source-backed basics for Google inventory"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
