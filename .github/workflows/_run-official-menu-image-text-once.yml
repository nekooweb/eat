name: Run reviewed official menu image text once

on:
  push:
    branches: ["main"]
    paths:
      - "_ops/run-official-menu-image-text-once-2026-09-09.txt"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch reviewed official menu image-text enrichment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-official-menu-image-text.yml --repo "$GITHUB_REPOSITORY" --ref main
