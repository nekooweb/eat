name: Fix E2E dish S2 generator syntax

on:
  push:
    branches: [agent-e2e-dish-s2-20260914]
    paths:
      - '.e2e-dish-s2-fix'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair quoted Place ID and verify syntax
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/prepare_e2e_dish_s2.mjs')
          s=p.read_text(encoding='utf-8')
          old='  ChIJi8oOa_-NGGARI5gh6aSXNxs: {'
          new="  'ChIJi8oOa_-NGGARI5gh6aSXNxs': {"
          if old not in s:
              raise SystemExit('expected unquoted key not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/prepare_e2e_dish_s2.mjs
      - name: Commit syntax fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prepare_e2e_dish_s2.mjs
          git commit -m 'Fix S2 proposal generator syntax'
          git push origin HEAD:agent-e2e-dish-s2-20260914
