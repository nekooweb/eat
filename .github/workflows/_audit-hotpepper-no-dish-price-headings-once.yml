name: Audit Hot Pepper no-dish price headings once

on:
  push:
    branches: ["main"]
    paths:
      - "_ops/audit-hotpepper-no-dish-price-headings-once-2026-09-09.txt"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce zero-paid policy and syntax
        run: |
          node scripts/audit_no_paid_apis.mjs
          node --check scripts/audit_hotpepper_unmatched_price_backed_headings.mjs
      - name: Audit exact-bound no-dish Hot Pepper menus
        env:
          HOTPEPPER_UNMATCHED_CONCURRENCY: '8'
          HOTPEPPER_UNMATCHED_TIMEOUT_MS: '10000'
          HOTPEPPER_UNMATCHED_LIMIT: '0'
        run: |
          set -euo pipefail
          node scripts/audit_hotpepper_unmatched_price_backed_headings.mjs /tmp/hp-no-dish-headings.json | tee /tmp/hp-no-dish-summary.txt
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/hp-no-dish-headings.json','utf8'));
          const counts=new Map();
          const examples=new Map();
          for(const row of x.unmatchedRows||[]){
            counts.set(row.heading,(counts.get(row.heading)||0)+1);
            if(!examples.has(row.heading)) examples.set(row.heading,[]);
            const arr=examples.get(row.heading); if(arr.length<4) arr.push({name:row.name,sourceUrl:row.sourceUrl,priceContext:row.priceContext});
          }
          const top=[...counts].map(([heading,count])=>({heading,count,examples:examples.get(heading)})).sort((a,b)=>b.count-a.count||a.heading.localeCompare(b.heading,'ja'));
          console.log('HOTPEPPER_NO_DISH_UNMATCHED='+JSON.stringify({summary:x.summary,top:top.slice(0,180)}));
          NODE
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: hotpepper-no-dish-price-heading-audit
          path: /tmp/hp-no-dish-headings.json
          retention-days: 7
