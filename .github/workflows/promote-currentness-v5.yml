name: Promote strict branch-body currentness v5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-strict-currentness-identities
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build baseline and fresh v5 review
        run: |
          set -euo pipefail
          mkdir -p _tmp
          node scripts/audit_no_paid_apis.mjs
          python -m py_compile \
            scripts/database/review_id_only_currentness_sources_v5.py \
            scripts/database/promote_reviewed_multisource_currentness_v5.py
          python scripts/database/build_master.py --output _tmp/before.sqlite --reset | tee _tmp/before.json
          python scripts/database/validate_master.py _tmp/before.sqlite
          node scripts/build_google_inventory_runtime.mjs | tee _tmp/runtime-before-build.json
          node scripts/audit_google_inventory_runtime.mjs | tee _tmp/runtime-before.json
          python scripts/database/review_id_only_currentness_sources_v5.py \
            --database _tmp/before.sqlite --output _tmp/review.json --workers 8 | tee _tmp/review-summary.json
          python - <<'PY'
          import json
          d=json.load(open('_tmp/review.json')); p=d['policy']
          assert d['ruleVersion']=='id-only-currentness-review-v5'
          assert p['paidDataApiCalls']==0 and p['googleDisplayPayloadPersisted'] is False
          assert p['proximityOnlyAdmissionAllowed'] is False
          assert p['v4HotPepperGateUnchanged'] is True and p['v4OvertureGatesUnchanged'] is True
          assert p['branchBodyFallbackRequiresBranchSpecificUrl'] is True
          assert p['branchBodyFallbackRequiresDistinctiveNameComponent'] is True
          assert p['branchBodyFallbackRequiresAddressDerivedLocality'] is True
          ready=[]
          for r in d['rows']:
            if not r.get('admissionReady'): continue
            q=(r.get('currentnessReview') or {}).get('bestCheck') or {}
            body=q.get('branchBodyEvidence')
            if body:
              assert q['method']=='visible_branch_body_brand_locality_plus_strong_location'
              assert body['branchSpecificUrl'] is True
              assert body['matchedDistinctiveNameComponents'] and body['matchedLocalityFragments']
              assert q['locationConfirmed'] is True
              assert q.get('postalMatch') is True or float(q.get('addressSimilarity') or 0)>=0.78 or (q.get('geoDistanceMeters') is not None and float(q['geoDistanceMeters'])<=30)
            ready.append(r['googlePlaceId'])
          print(json.dumps({'targets':d['summary']['targets'],'counts':d['summary']['counts'],'admissionReady':len(ready),'placeIds':ready},ensure_ascii=False,sort_keys=True))
          PY
      - name: Build final collision-checked v5 overlay
        run: |
          set -euo pipefail
          python scripts/database/promote_reviewed_multisource_currentness_v5.py \
            --database _tmp/before.sqlite \
            --review _tmp/review.json \
            --base data/google_basic_source_matches.json \
            --hotpepper data/hotpepper_catalog_facts.json \
            --output _tmp/overlay.json | tee _tmp/overlay-summary.json
          python - <<'PY'
          import json
          r=json.load(open('_tmp/review.json')); o=json.load(open('_tmp/overlay.json')); p=o['policy']
          ready={x['googlePlaceId'] for x in r['rows'] if x.get('admissionReady')}
          out={x['googlePlaceId'] for x in o['rows']}
          assert out <= ready
          assert p['newGoogleApiCalls']==0 and p['googleDisplayPayloadPersisted'] is False
          assert p['proximityOnlyBindingAllowed'] is False
          assert p['targetIdentityState']=='source_matched' and p['legacyVerifiedStateCreated'] is False
          for row in o['rows']:
            c=row['identityConsensus']; q=c['currentIndependentPage']; g=c['overtureSupport']['v4Gate']
            assert c['policy']['sourceMatchedOnly'] is True and c['policy']['proximityOnlyBindingAllowed'] is False
            assert q['locationConfirmed'] is True and str(q['url']).startswith('https://')
            assert g['accepted'] is True and (g['base20mGate'] is True or g['branchAddressOffsetGate'] is True)
          print(json.dumps({'promotable':len(out),'placeIds':sorted(out),'summary':o['summary']},ensure_ascii=False,sort_keys=True))
          PY
      - name: Merge and validate runtime/database delta
        run: |
          set -euo pipefail
          python scripts/merge_basic_recovery_overlays.py \
            data/google_basic_source_matches.json _tmp/overlay.json data/google_basic_source_matches.json | tee _tmp/merge.json
          added=$(python - <<'PY'
          import json
          print(json.load(open('_tmp/merge.json')).get('added',0))
          PY
          )
          if [ "$added" = "0" ]; then
            git restore -- data/google_basic_source_matches.json data/google_inventory_runtime.js 2>/dev/null || true
            echo "No still-safe v5 identities to promote"
            exit 0
          fi
          node scripts/build_google_inventory_runtime.mjs | tee _tmp/runtime-after-build.json
          node scripts/audit_google_inventory_runtime.mjs | tee _tmp/runtime-after.json
          python scripts/database/build_master.py --output _tmp/after.sqlite --reset | tee _tmp/after.json
          python scripts/database/validate_master.py _tmp/after.sqlite
          python scripts/database/validate_ingestion_plan.py _tmp/after.sqlite
          python - <<'PY'
          import json,sqlite3
          b=json.load(open('_tmp/before.json')); a=json.load(open('_tmp/after.json')); m=json.load(open('_tmp/merge.json')); o=json.load(open('_tmp/overlay.json'))
          rb=json.load(open('_tmp/runtime-before.json')); ra=json.load(open('_tmp/runtime-after.json'))
          n=int(m['added']); assert n==len(o['rows']) and n>0
          assert a['identityStates']['id_only']==b['identityStates']['id_only']-n
          assert a['identityStates']['source_matched']==b['identityStates']['source_matched']+n
          assert a['identityStates']['verified']==b['identityStates']['verified']
          assert ra['inventoryTotal']==rb['inventoryTotal']+n
          assert ra['unpublishedPlaceIdOnly']==rb['unpublishedPlaceIdOnly']-n
          db=sqlite3.connect('_tmp/after.sqlite')
          states={r['googlePlaceId']:db.execute('select identity_state from catalog_entries where place_id=?',(r['googlePlaceId'],)).fetchone()[0] for r in o['rows']}
          assert all(v=='source_matched' for v in states.values())
          effect={'added':n,'placeIds':[r['googlePlaceId'] for r in o['rows']],'states':states,'identityBefore':b['identityStates'],'identityAfter':a['identityStates'],'runtimeBefore':rb['inventoryTotal'],'runtimeAfter':ra['inventoryTotal'],'unpublishedBefore':rb['unpublishedPlaceIdOnly'],'unpublishedAfter':ra['unpublishedPlaceIdOnly'],'missingBefore':b['ingestionPlan']['fieldCompletionMissingCounts'],'missingAfter':a['ingestionPlan']['fieldCompletionMissingCounts']}
          json.dump(effect,open('_tmp/effect.json','w'),ensure_ascii=False,indent=2,sort_keys=True)
          print(json.dumps(effect,ensure_ascii=False,sort_keys=True))
          PY
          node scripts/audit_no_paid_apis.mjs
      - name: Commit only durable identity change
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/google_basic_source_matches.json; then
            git restore -- data/google_inventory_runtime.js 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/google_basic_source_matches.json
            git commit -m "Promote strict branch-body current identity v5"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No durable identity changes"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promote-currentness-v5
          path: _tmp/*.json
          if-no-files-found: warn
          retention-days: 3
