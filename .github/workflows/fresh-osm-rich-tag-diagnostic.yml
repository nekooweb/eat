name: Diagnose fresh OSM rich identity tags

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax and no-paid policy
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/database/diagnose_fresh_osm_rich_tags.py \
            scripts/database/retained_osm_identity.py \
            scripts/database/build_fresh_osm_bound_field_evidence.py \
            scripts/database/import_fresh_osm_bound_field_evidence.py
          node scripts/audit_no_paid_apis.mjs
      - name: Query one bounded public Overpass scope
        run: |
          set -euo pipefail
          mkdir -p _tmp
          python scripts/database/diagnose_fresh_osm_rich_tags.py \
            --output _tmp/fresh-osm-rich-tag-diagnostic.json \
            --rows-output _tmp/fresh-osm-rich-public-rows.json \
            | tee _tmp/fresh-osm-rich-tag-summary.json
      - name: Enforce diagnostic and snapshot boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('_tmp/fresh-osm-rich-tag-diagnostic.json'))
          assert d['ruleVersion']=='fresh-osm-rich-tag-diagnostic-v1'
          p=d['policy']
          assert p['paidDataApiCalls']==0
          assert p['googleDataApiCalls']==0
          assert p['networkRequests']==1
          assert p['retryOnRestrictedAccess'] is False
          assert p['masterWrites']==0
          assert p['promotionPerformed'] is False
          assert p['rawOverpassResponsePersisted'] is False
          q=d['query']
          assert q['radiusMeters']==1200
          assert abs(q['center']['lat']-35.6959)<1e-9
          assert abs(q['center']['lng']-139.7576)<1e-9
          s=d['summary']
          assert s['retainedRows'] > 0
          assert s['freshRows'] > 0

          r=json.load(open('_tmp/fresh-osm-rich-public-rows.json'))
          assert r['ruleVersion']=='fresh-osm-rich-public-snapshot-v1'
          rp=r['policy']
          assert rp['paidDataApiCalls']==0
          assert rp['googleDataIncluded'] is False
          assert rp['rawOverpassResponsePersisted'] is False
          assert rp['parsedPublicOsmRowsOnly'] is True
          assert rp['masterWrites']==0
          assert rp['promotionPerformed'] is False
          assert len(r['rows'])==s['freshRows']
          ids=[x['providerId'] for x in r['rows']]
          assert len(ids)==len(set(ids))
          assert all(x['provider']=='OpenStreetMap' for x in r['rows'])
          assert all(str(x['sourceUrl']).startswith('https://www.openstreetmap.org/') for x in r['rows'])
          print(json.dumps({'summary':s,'snapshotRows':len(r['rows'])},sort_keys=True))
          PY
      - name: Upload reusable short-lived public-source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-osm-rich-tag-diagnostic
          path: |
            _tmp/fresh-osm-rich-tag-diagnostic.json
            _tmp/fresh-osm-rich-tag-summary.json
            _tmp/fresh-osm-rich-public-rows.json
          if-no-files-found: warn
          retention-days: 3
