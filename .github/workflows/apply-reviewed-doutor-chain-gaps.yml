name: Apply reviewed DOUTOR chain recommendation gaps

on:
  push:
    branches: [main]
    paths:
      - '.reviewed-doutor-chain-gap-run'

permissions:
  contents: write

concurrency:
  group: collect-source-backed-recommended-dishes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast syntax and zero-paid checks
        run: |
          set -euo pipefail
          node --check scripts/build_reviewed_doutor_chain_gap_recommendations.mjs
          node scripts/audit_no_paid_apis.mjs
      - name: Rebuild baseline
        run: |
          set -euo pipefail
          python scripts/reload_data.py --public-only --outdir /tmp/doutor-gap-baseline
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{},console};vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('data/google_inventory_runtime.js','utf8'),sandbox);
          const s=sandbox.window.GOOGLE_INVENTORY_STATS||{};
          fs.writeFileSync('/tmp/doutor-gap-before.json',JSON.stringify(s));
          console.log('DOUTOR_GAP_BEFORE='+JSON.stringify({recommended:s.recommendedDishesKnown,featured:s.featuredDishesKnown,display:s.chineseDishDisplayRows,noDish:s.unfilledDishRows}));
          NODE
      - name: Build all reviewed DOUTOR gaps dynamically
        run: |
          set -euo pipefail
          node scripts/build_reviewed_doutor_chain_gap_recommendations.mjs /tmp/doutor-gap-evidence.json | tee /tmp/doutor-gap-build.log
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/doutor-gap-evidence.json','utf8'));
          if(x.policy?.networkRequests!==0||x.policy?.paidGoogleDataApiCalls!==0||x.policy?.identityMutationAllowed!==false) throw new Error('DOUTOR gap batch crossed mutation boundary');
          if(x.policy?.reviewedOfficialDoutorDomainRequired!==true||x.policy?.existingStrictRecommendationMustBeAbsent!==true||x.policy?.currentOfficialRecommendationSectionRequired!==true) throw new Error('DOUTOR strict recommendation semantics weakened');
          if(Number(x.summary?.recommendationGapRestaurants||0)<1) throw new Error('No reviewed DOUTOR recommendation gaps found');
          if(Number(x.summary?.recommendationItems||0)!==Number(x.summary.recommendationGapRestaurants)*2) throw new Error('Unexpected DOUTOR recommendation item count');
          console.log('DOUTOR_GAP_BUILD='+JSON.stringify(x.summary));
          NODE
      - name: Merge and audit evidence
        run: |
          set -euo pipefail
          node scripts/merge_google_inventory_detail_evidence.mjs data/google_inventory_detail_evidence.json /tmp/doutor-gap-evidence.json /tmp/doutor-gap-merged.json | tee /tmp/doutor-gap-merge.log
          cp /tmp/doutor-gap-merged.json data/google_inventory_detail_evidence.json
          node scripts/correct_dish_specificity_evidence.mjs data/google_inventory_detail_evidence.json data/google_inventory_detail_evidence.json | tee /tmp/doutor-gap-specificity.log
          node scripts/audit_google_inventory_detail_evidence.mjs
      - name: Rebuild and require exact dynamic growth
        run: |
          set -euo pipefail
          python scripts/reload_data.py --public-only --outdir /tmp/doutor-gap-after
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const before=JSON.parse(fs.readFileSync('/tmp/doutor-gap-before.json','utf8'));
          const built=JSON.parse(fs.readFileSync('/tmp/doutor-gap-evidence.json','utf8'));
          const sandbox={window:{},console};vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('data/google_inventory_runtime.js','utf8'),sandbox);
          const after=sandbox.window.GOOGLE_INVENTORY_STATS||{};
          const expected=Number(built.summary?.recommendationGapRestaurants||0);
          const delta=Number(after.recommendedDishesKnown||0)-Number(before.recommendedDishesKnown||0);
          if(delta!==expected) throw new Error(`DOUTOR recommendation delta mismatch: ${delta}/${expected}`);
          if(Number(after.featuredDishesKnown||0)<Number(before.featuredDishesKnown||0)||Number(after.chineseDishDisplayRows||0)<Number(before.chineseDishDisplayRows||0)) throw new Error('non-monotonic dish coverage');
          fs.writeFileSync('/tmp/doutor-gap-delta.json',JSON.stringify({before,after,expected,delta},null,2)+'\n');
          console.log('DOUTOR_GAP_DELTA='+JSON.stringify({recommended:delta,afterRecommended:after.recommendedDishesKnown,afterFeatured:after.featuredDishesKnown,afterDisplay:after.chineseDishDisplayRows,afterNoDish:after.unfilledDishRows}));
          NODE
          node scripts/audit_google_inventory_detail_evidence.mjs
          node scripts/audit_no_paid_apis.mjs
          node scripts/test_source_field_quarantine.mjs
      - name: Commit verified DOUTOR recommendation gaps
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then echo 'No DOUTOR gap changes'; exit 0; fi
          git commit -m 'Fill reviewed DOUTOR recommendation gaps'
          if ! git diff --quiet; then git restore --worktree -- .; fi
          git fetch origin main
          git rebase origin/main
          python scripts/reload_data.py --public-only --outdir /tmp/doutor-gap-post-rebase
          node scripts/audit_google_inventory_detail_evidence.mjs
          node scripts/audit_no_paid_apis.mjs
          node scripts/test_source_field_quarantine.mjs
          git add -A data
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-doutor-chain-gaps
          path: |
            /tmp/doutor-gap-evidence.json
            /tmp/doutor-gap-delta.json
            /tmp/doutor-gap-build.log
            /tmp/doutor-gap-merge.log
            /tmp/doutor-gap-specificity.log
          if-no-files-found: ignore
          retention-days: 7
