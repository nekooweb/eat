name: Rebuild full Area1 ledger

on:
  push:
    branches:
      - full-area1-collection
    paths:
      - '.github/workflows/rebuild-full-ledger.yml'
  workflow_dispatch:

concurrency:
  group: rebuild-full-ledger-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild canonical production
        run: |
          set -o pipefail
          mkdir -p _audit
          node scripts/build_production_dataset.mjs | tee _audit/build-before-ledger.json
      - name: Rebuild exact inventory ledger and rejected-candidate queue
        run: |
          set -o pipefail
          node scripts/build_inventory_ledger.mjs data/area1_inventory_ledger.json | tee _audit/ledger-summary.json
          node scripts/build_inventory_expansion_queue.mjs data/area1_inventory_ledger.json data/area1_inventory_expansion_queue.json | tee _audit/expansion-queue-summary.json
          node scripts/audit_area1_identity_coverage.mjs | tee _audit/identity-coverage.json
      - name: Commit rebuilt ledger
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/area1_inventory_ledger.json data/area1_inventory_expansion_queue.json
          if git diff --cached --quiet; then
            echo 'No ledger changes.'
          else
            git commit -m 'Rebuild full Area1 ledger after expansion'
            git push origin HEAD:$TARGET_BRANCH
          fi
