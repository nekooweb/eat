name: Promote new production official sources

on:
  push:
    branches:
      - continue-full-field-enrichment
    paths:
      - 'scripts/promote_new_production_sources.mjs'
      - '.github/workflows/promote-new-production-official-sources.yml'
  workflow_dispatch:

concurrency:
  group: promote-new-production-sources-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reviewed official source shard
        run: |
          set -o pipefail
          mkdir -p _audit
          node scripts/promote_new_production_sources.mjs | tee _audit/new-production-source-summary.json
      - name: Rebuild and audit
        run: |
          set -o pipefail
          node scripts/test_opening_hours.mjs
          node scripts/build_production_dataset.mjs | tee _audit/build-after-new-sources.json
          node scripts/audit_repository.mjs
          node scripts/audit_source_bindings.mjs
          node scripts/audit_normalized_fields.mjs
          node scripts/audit_area1_identity_coverage.mjs | tee _audit/identity-coverage.json
          node scripts/coverage_report.mjs | tee _audit/coverage.json
          node scripts/source_queue.mjs | tee _audit/source-queue.json
          node scripts/build_enrichment_queue.mjs | tee _audit/enrichment-queue.json
          node scripts/dish_gap_report.mjs | tee _audit/dish-gap.json
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: new-production-official-source-audit
          path: _audit
          retention-days: 3
      - name: Commit reviewed sources
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official_candidate_index.json data/source_enrichment_fullcollection.js
          if git diff --cached --quiet; then
            echo 'No reviewed source changes.'
          else
            git commit -m 'Add official sources for newly admitted restaurants'
            git push origin HEAD:$TARGET_BRANCH
          fi
