name: One-shot official PDF dish dispatcher

on:
  push:
    branches:
      - main
    paths:
      - _ops/run-official-pdf-dishes-once-2026-09-08.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch strict official PDF dish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-official-pdf-dishes.yml --repo "$GITHUB_REPOSITORY" --ref main
