name: Recover identities by independent multi-source consensus v3

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/private-multisource-consensus-v3.yml"
      - "scripts/database/reconcile_private_multisource_consensus_v3.py"
      - "scripts/database/reconcile_private_address_consensus_v2.py"
      - "scripts/database/reconcile_private_google_hints.py"
      - "scripts/merge_basic_recovery_overlays.py"
      - "scripts/database/**"
      - "data/overture_area1_candidates.json"
      - "data/area1_osm.js"
      - "data/hotpepper_catalog_facts.json"
      - "data/google_basic_source_matches.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: private-multisource-consensus-v3
  cancel-in-progress: false

jobs:
  reconcile-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Download original private sweep
        uses: actions/download-artifact@v5
        with:
          name: full-area1-collection-private-audit
          path: _private_google/initial
          github-token: ${{ github.token }}
          repository: nekooweb/eat
          run-id: 34018919233
      - name: Download retry private sweep
        uses: actions/download-artifact@v5
        with:
          name: full-area1-retry-private-audit
          path: _private_google/retry
          github-token: ${{ github.token }}
          repository: nekooweb/eat
          run-id: 34019078280
      - name: Build baseline master
        run: |
          set -euo pipefail
          mkdir -p _tmp
          python -m py_compile \
            scripts/database/reconcile_private_google_hints.py \
            scripts/database/reconcile_private_address_consensus_v2.py \
            scripts/database/reconcile_private_multisource_consensus_v3.py \
            scripts/merge_basic_recovery_overlays.py
          python scripts/database/build_master.py --output _tmp/eat-master-before.sqlite --reset | tee _tmp/master-before.json
          python scripts/database/validate_master.py _tmp/eat-master-before.sqlite | tee _tmp/master-before-validate.json
          python - <<'PY'
          import json, sqlite3
          db=sqlite3.connect('_tmp/eat-master-before.sqlite')
          states=dict(db.execute('select identity_state,count(*) from catalog_entries group by identity_state'))
          json.dump(states,open('_tmp/baseline-states.json','w'),sort_keys=True)
          print(json.dumps(states,sort_keys=True))
          PY
      - name: Run v3 multi-source consensus
        run: |
          set -euo pipefail
          python scripts/database/reconcile_private_multisource_consensus_v3.py \
            --database _tmp/eat-master-before.sqlite \
            --initial _private_google/initial/full_inventory_place_details.json \
            --retry _private_google/retry/full_inventory_retry_private.json \
            --private-output _tmp/private-multisource-v3.json \
            --durable-output _tmp/durable-multisource-v3.json \
            | tee _tmp/multisource-v3-summary.json
      - name: Enforce v3 durable boundary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('_tmp/durable-multisource-v3.json'))
          assert d['ruleVersion']=='private-multisource-consensus-v3'
          p=d['policy']
          assert p['newGoogleApiCalls']==0
          assert p['googleDisplayPayloadPersisted'] is False
          assert p['durableFieldsIndependentSourceOnly'] is True
          assert p['proximityOnlyBindingAllowed'] is False
          assert p['minimumIndependentProviders'] >= 2
          banned={'displayName','formattedAddress','businessStatus','primaryType','types','googleName','googleAddress','googleLocation','location','nationalPhoneNumber','internationalPhoneNumber','websiteUri','currentOpeningHours'}
          def walk(v):
            if isinstance(v,dict):
              for k,x in v.items():
                assert k not in banned, k
                walk(x)
            elif isinstance(v,list):
              for x in v: walk(x)
          walk(d)
          ids=[]; native=[]
          for r in d['rows']:
            ids.append(r['googlePlaceId'])
            native.append((r['provider'],str(r['providerId'])))
            c=r['independentConsensus']
            assert c['providerCount'] >= 2
            assert len(set(c['providers'])) >= 2
            assert len({x['provider'] for x in c['supportingSources']}) >= 2
            assert r['provider'] in {'Hot Pepper','OpenStreetMap','Overture Maps'}
            assert r['matchLevel']==d['ruleVersion']
          assert len(ids)==len(set(ids))
          assert len(native)==len(set(native))
          print(json.dumps({'durableRows':len(ids),'providers':d['summary']['providers']},ensure_ascii=False,sort_keys=True))
          PY
      - name: Merge durable v3 recoveries
        run: |
          set -euo pipefail
          python scripts/merge_basic_recovery_overlays.py \
            data/google_basic_source_matches.json \
            _tmp/durable-multisource-v3.json \
            data/google_basic_source_matches.json \
            | tee _tmp/v3-overlay-merge.json
      - name: Validate runtime and master after v3
        run: |
          set -euo pipefail
          node scripts/build_google_inventory_runtime.mjs | tee _tmp/runtime-after-v3.json
          node scripts/audit_google_inventory_runtime.mjs | tee _tmp/runtime-after-v3-audit.json
          python scripts/database/build_master.py --output _tmp/eat-master-after.sqlite --reset | tee _tmp/master-after.json
          python scripts/database/validate_master.py _tmp/eat-master-after.sqlite | tee _tmp/master-after-validate.json
          python - <<'PY'
          import json,sqlite3
          before=json.load(open('_tmp/baseline-states.json'))
          durable=json.load(open('_tmp/durable-multisource-v3.json'))
          merged=json.load(open('_tmp/v3-overlay-merge.json'))
          added=merged['added']
          db=sqlite3.connect('_tmp/eat-master-after.sqlite')
          after=dict(db.execute('select identity_state,count(*) from catalog_entries group by identity_state'))
          assert after.get('id_only',0) == before.get('id_only',0) - added, (before,after,added)
          assert merged['ruleVersion']=='private-multisource-consensus-v3'
          assert merged['identityOnlyRemaining'] <= 1392
          for row in durable['rows']:
            state=db.execute('select identity_state from catalog_entries where place_id=?',(row['googlePlaceId'],)).fetchone()
            assert state and state[0]=='source_matched', (row['googlePlaceId'],state)
          print(json.dumps({'before':before,'after':after,'added':added,'durableRows':len(durable['rows'])},ensure_ascii=False,sort_keys=True))
          PY
      - name: Commit promoted v3 source data
        run: |
          set -euo pipefail
          # Runtime/master files above are validation products; the durable repository mutation is only the basic source file.
          git restore -- data/google_inventory_runtime.js 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google_basic_source_matches.json
          if git diff --cached --quiet; then
            echo "No new v3 identity recoveries to commit."
            exit 0
          fi
          git commit -m "Promote multi-source identity recoveries v3"
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
      - name: Upload v3 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-multisource-consensus-v3
          path: |
            _tmp/multisource-v3-summary.json
            _tmp/private-multisource-v3.json
            _tmp/durable-multisource-v3.json
            _tmp/v3-overlay-merge.json
            _tmp/baseline-states.json
            _tmp/master-before.json
            _tmp/master-before-validate.json
            _tmp/master-after.json
            _tmp/master-after-validate.json
            _tmp/runtime-after-v3.json
            _tmp/runtime-after-v3-audit.json
          if-no-files-found: warn
          retention-days: 2
