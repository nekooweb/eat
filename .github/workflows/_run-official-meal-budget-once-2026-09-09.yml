name: Run official meal budget enrichment once

on:
  push:
    branches: ["main"]
    paths:
      - "_ops/run-official-meal-budget-once-2026-09-09.txt"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official meal budget enrichment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run official-meal-budget-enrichment.yml --repo "$GITHUB_REPOSITORY" --ref main
