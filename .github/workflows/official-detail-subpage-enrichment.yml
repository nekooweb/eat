name: Enrich retained official detail pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/official-detail-subpage-enrichment.yml"
      - "scripts/database/collect_official_index_web_fields.py"
      - "scripts/database/import_source_basic_web_evidence.py"
      - "scripts/database/merge_public_web_field_evidence.py"
      - "data/official_candidate_index.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-web-field-evidence
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce zero-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Build baseline master
        run: |
          set -euo pipefail
          mkdir -p _tmp
          python -m py_compile scripts/database/collect_official_index_web_fields.py scripts/database/merge_public_web_field_evidence.py
          python scripts/database/build_master.py --output _tmp/master-before.sqlite --reset | tee _tmp/master-before.json
          python scripts/database/validate_master.py _tmp/master-before.sqlite
          python - <<'PY'
          import json
          m=json.load(open('_tmp/master-before.json'))
          p=m['ingestionPlan']
          out={'fieldTasks':p['taskTypeCounts']['field_completion'],'missing':p['fieldCompletionMissingCounts']}
          json.dump(out,open('_tmp/before.json','w'),sort_keys=True)
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Collect reviewed official roots and explicit same-host detail pages
        run: |
          set -euo pipefail
          python scripts/database/collect_official_index_web_fields.py \
            --database _tmp/master-before.sqlite \
            --output _tmp/incoming.json \
            --workers 10 \
            --max-pages 250 \
            | tee _tmp/collection.json
          python - <<'PY'
          import json,re
          d=json.load(open('_tmp/incoming.json'))
          p=d['policy']; s=d['summary']
          assert d['schemaVersion']==2
          assert p['paidDataApiCalls']==0 and p['rawHtmlPersisted'] is False and p['robotsRespected'] is True
          assert p['sameOriginDetailTraversal'] is True
          assert p['rootIdentityGateRequiredBeforeDetailDiscovery'] is True
          assert p['detailIdentityReconfirmationRequired'] is True
          assert p['genericPriceRangeMealInference'] is False
          keys=[]
          for row in d['rows']:
            ev=row['webEvidence']; check=row['identityCheck']
            assert check['accepted'] is True and check['identityRule']=='retained_verified_official_page'
            assert str(ev['finalUrl']).startswith('https://')
            assert re.fullmatch(r'[0-9a-f]{64}',str(ev['contentHash']))
            assert row['fieldClaims']
            if 'discovery' in ev:
              q=ev['discovery']
              assert q['method']=='same_origin_explicit_detail_link'
              assert q['rootIdentityReconfirmedBeforeDiscovery'] is True
              assert q['detailIdentityReconfirmedIndependently'] is True
            keys.append((row['googlePlaceId'],ev['finalUrl'],ev['contentHash']))
          assert len(keys)==len(set(keys))
          print(json.dumps({'rows':len(keys),'places':s['places'],'fieldCounts':s['fieldCounts'],'fetchCounts':s['fetchCounts']},ensure_ascii=False,sort_keys=True))
          PY
      - name: Merge and verify canonical delta
        run: |
          set -euo pipefail
          cp data/source_basic_web_field_evidence.json _tmp/evidence-base.json
          python scripts/database/merge_public_web_field_evidence.py _tmp/evidence-base.json _tmp/incoming.json _tmp/evidence-merged.json | tee _tmp/merge.json
          cp _tmp/evidence-merged.json data/source_basic_web_field_evidence.json
          python scripts/database/build_master.py --output _tmp/master-after.sqlite --reset | tee _tmp/master-after.json
          python scripts/database/validate_master.py _tmp/master-after.sqlite
          python - <<'PY'
          import json
          b=json.load(open('_tmp/before.json'))
          m=json.load(open('_tmp/master-after.json'))
          p=m['ingestionPlan']; a={'fieldTasks':p['taskTypeCounts']['field_completion'],'missing':p['fieldCompletionMissingCounts']}
          for k,v in b['missing'].items(): assert a['missing'].get(k,0)<=v,(k,b,a)
          assert a['fieldTasks']<=b['fieldTasks'],(b,a)
          json.dump(a,open('_tmp/after.json','w'),sort_keys=True)
          print(json.dumps({'before':b,'after':a},sort_keys=True))
          PY
      - name: Commit only durable evidence
        run: |
          set -euo pipefail
          git restore -- data/source_basic_web_field_evidence.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B official-detail-fields origin/main
          python scripts/database/merge_public_web_field_evidence.py data/source_basic_web_field_evidence.json _tmp/incoming.json data/source_basic_web_field_evidence.json
          git add data/source_basic_web_field_evidence.json
          if git diff --cached --quiet; then
            echo "No new official detail-page snapshots"
            exit 0
          fi
          git commit -m "Add official detail-page field evidence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-detail-subpage-enrichment
          path: _tmp/*.json
          if-no-files-found: warn
          retention-days: 3
