name: Build open Area1 candidate review

on:
  workflow_dispatch:
    inputs:
      overture_release:
        description: 'Pinned Overture release; leave blank for the repository default'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce data API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Install local bulk-query dependency
        run: python -m pip install 'duckdb>=1.3,<2'
      - name: Build Overture Area1 staging candidates
        env:
          OVERTURE_RELEASE: ${{ inputs.overture_release }}
        run: |
          mkdir -p _audit
          if [ -z "$OVERTURE_RELEASE" ]; then unset OVERTURE_RELEASE; fi
          python scripts/build_overture_area1.py _audit/overture_area1_candidates.json \
            | tee _audit/overture_area1_summary.log
      - name: Build open identity reconciliation queue
        run: |
          python scripts/build_open_identity_reconciliation.py \
            _audit/overture_area1_candidates.json \
            _audit/open_identity_reconciliation.json \
            | tee _audit/open_identity_reconciliation_summary.log
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-area1-candidate-review
          path: _audit
          retention-days: 7
