name: One-shot dispatcher for source-backed dish collection

on:
  push:
    branches:
      - main
    paths:
      - _ops/run-source-backed-dishes-once-2026-09-08.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing manual source-backed dish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-google-inventory-details.yml --repo "$GITHUB_REPOSITORY" --ref main
