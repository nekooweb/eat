name: Final reviewed dish integration v2

on:
  push:
    branches: [final-dish-integration-20260915]
    paths: ['scripts/final-dish-integration-trigger']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-dish-integration-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run final integration
        run: bash scripts/run_final_dish_integration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-dish-integration-audit-v2
          path: _audit/final
          if-no-files-found: warn
