name: Refresh Area 1 Restaurant Data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_area1_osm.py"
      - "scripts/build_osm_independent_dish_source_candidate_plan.mjs"
      - "scripts/review_osm_independent_dish_source_candidates.mjs"
      - ".github/workflows/refresh-area1.yml"

permissions:
  contents: write

concurrency:
  group: refresh-area1-restaurant-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Check source-recovery script syntax
        run: |
          node --check scripts/build_osm_independent_dish_source_candidate_plan.mjs
          node --check scripts/review_osm_independent_dish_source_candidates.mjs
      - name: Generate expanded Area 1 food POI dataset
        run: python3 scripts/build_area1_osm.py | tee /tmp/area1-osm-summary.json
      - name: Build proposal-only OSM independent source plan
        run: |
          set -euo pipefail
          node scripts/build_osm_independent_dish_source_candidate_plan.mjs \
            data/osm_independent_dish_source_candidates.json 8 | tee /tmp/osm-independent-source-plan-summary.json
          test -s data/osm_independent_dish_source_candidates.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('data/osm_independent_dish_source_candidates.json', 'utf8'));
          const p = x.policy || {};
          const s = x.summary || {};
          if (p.proposalOnly !== true || p.identityBindingChanges !== 0 || p.networkRequests !== 0) throw new Error('OSM source plan must remain proposal-only/network-free');
          if (p.paidGoogleDataApiCalls !== 0 || p.googleDisplayPayloadUsed !== false) throw new Error('OSM source plan violated zero-paid/no-Google-display policy');
          if (p.osmGoogleStatusMustRemainPending !== true || p.proximityOnlyBindingAllowed !== false) throw new Error('OSM identity boundary failed');
          if (p.dishEvidencePromotionBeforeSourceReviewAllowed !== false || p.sourcePageReviewRequired !== true) throw new Error('OSM source/evidence boundary failed');
          if (s.catalogTotal !== 2804 || s.publicRuntimeTotal !== 1415) throw new Error('OSM source plan baseline mismatch');
          if (s.proposalRows > s.currentIndependentDishSourceGap || s.highConfidenceProposalRows > s.proposalRows) throw new Error('invalid OSM proposal counts');
          console.log(JSON.stringify(s));
          NODE
      - name: Strict-review high-confidence OSM website proposals
        env:
          OSM_SOURCE_REVIEW_TIMEOUT_MS: "7000"
          OSM_SOURCE_REVIEW_CONCURRENCY: "8"
        run: |
          set -euo pipefail
          node scripts/review_osm_independent_dish_source_candidates.mjs \
            data/osm_independent_dish_source_candidates.json \
            data/reviewed_osm_independent_dish_sources.json | tee /tmp/osm-independent-source-review-summary.json
          test -s data/reviewed_osm_independent_dish_sources.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('data/reviewed_osm_independent_dish_sources.json', 'utf8'));
          const p = x.policy || {};
          const s = x.summary || {};
          if (p.strictAutoOnly !== true || p.sourceOverlayOnly !== true) throw new Error('OSM strict source review policy missing');
          if (p.paidGoogleDataApiCalls !== 0 || p.googleDisplayPayloadUsed !== false) throw new Error('OSM reviewer violated zero-paid/no-Google-display policy');
          if (p.identityBindingChanges !== 0 || p.runtimeNameMutationAllowed !== false || p.runtimeCoordinateMutationAllowed !== false || p.runtimeIdentityMutationAllowed !== false) throw new Error('OSM reviewer may not mutate identity/core runtime fields');
          if (p.dishEvidenceCreatedByReview !== false || p.genericBrandHomepageAloneAccepted !== false) throw new Error('OSM reviewer crossed source/evidence boundary');
          if (p.thirdPartyAggregatorUrlsExcluded !== true || p.crossSiteRedirectAllowed !== false) throw new Error('OSM reviewer URL boundary failed');
          if (s.catalogTotal !== 2804 || s.publicRuntimeTotal !== 1415) throw new Error('OSM reviewer baseline mismatch');
          if (s.approvedRows > s.highConfidenceInputRows) throw new Error('OSM approved count exceeds strict input');
          for (const row of x.rows || []) {
            if (row.reviewState !== 'strict_auto' || row.candidateProvider !== 'OpenStreetMap' || !row.googlePlaceId || !Array.isArray(row.sourceWebsites) || !row.sourceWebsites.length) {
              throw new Error('invalid reviewed OSM source row');
            }
          }
          console.log(JSON.stringify(s));
          NODE
      - name: Re-check no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Commit generated OSM dataset and source recovery artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/area1_osm.js \
            data/osm_independent_dish_source_candidates.json \
            data/reviewed_osm_independent_dish_sources.json
          if git diff --cached --quiet; then
            echo "No OSM/source-recovery data changes"
            exit 0
          fi
          git commit -m "Refresh Area1 OSM source recovery data"
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
