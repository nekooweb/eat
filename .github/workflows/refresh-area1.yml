name: Refresh Area 1 Restaurant Data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_area1_osm.py"
      - "scripts/build_osm_independent_dish_source_candidate_plan.mjs"
      - "scripts/review_osm_independent_dish_source_candidates.mjs"
      - "scripts/refresh_bound_osm_source_websites.mjs"
      - ".github/workflows/refresh-area1.yml"

permissions:
  contents: write

concurrency:
  group: refresh-area1-restaurant-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Check source-recovery script syntax
        run: |
          python3 -m py_compile scripts/build_area1_osm.py
          node --check scripts/build_osm_independent_dish_source_candidate_plan.mjs
          node --check scripts/review_osm_independent_dish_source_candidates.mjs
          node --check scripts/refresh_bound_osm_source_websites.mjs
      - name: Generate minimal Area 1 OSM food POI source dataset
        run: |
          set -euo pipefail
          python3 scripts/build_area1_osm.py | tee /tmp/area1-osm-summary.json
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const sandbox = { window: { RESTAURANTS: [] } };
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('data/area1_osm.js', 'utf8'), sandbox);
          const rows = sandbox.window.RESTAURANTS || [];
          const allowed = new Set([
            'id','profile','area','name','cuisine','distanceMeters','lat','lng','source','sourceId',
            'openingHoursRaw','address','sourceWebsites','sourcePhones','sourcePracticalTags','curatedOverlap'
          ]);
          const forbidden = new Set([
            'distance','lunch','dinner','dishes','closedDays','googlePlaceId','googleStatus','hyakumeiten','randomWeight','tags'
          ]);
          for (const row of rows) {
            for (const key of Object.keys(row)) {
              if (!allowed.has(key)) throw new Error(`unapproved OSM payload key: ${key}`);
              if (forbidden.has(key)) throw new Error(`compatibility/default key leaked into OSM payload: ${key}`);
            }
            if (row.source !== 'OpenStreetMap' || !row.id || !row.sourceId || !row.name) throw new Error('invalid minimal OSM source row');
            if ('sourceWebsites' in row && (!Array.isArray(row.sourceWebsites) || !row.sourceWebsites.length)) throw new Error('empty OSM sourceWebsites must be omitted');
            if ('sourcePhones' in row && (!Array.isArray(row.sourcePhones) || !row.sourcePhones.length)) throw new Error('empty OSM sourcePhones must be omitted');
            if ('sourcePracticalTags' in row && (!row.sourcePracticalTags || !Object.keys(row.sourcePracticalTags).length)) throw new Error('empty OSM sourcePracticalTags must be omitted');
            if ('address' in row && !String(row.address).trim()) throw new Error('empty OSM address must be omitted');
            if ('openingHoursRaw' in row && !String(row.openingHoursRaw).trim()) throw new Error('empty OSM openingHoursRaw must be omitted');
          }
          console.log(JSON.stringify({rows: rows.length, allowedKeys: [...allowed], forbiddenKeysAbsent: true}));
          NODE
      - name: Backfill websites on already-bound OSM source rows
        run: |
          set -euo pipefail
          node scripts/refresh_bound_osm_source_websites.mjs | tee /tmp/bound-osm-website-summary.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('data/google_basic_source_matches.json', 'utf8'));
          const p = x.policy || {};
          const s = x.summary?.retainedOsmWebsiteOverlay || {};
          const expectedReady = Number(x.summary?.productionBacked || 0) + Number(x.summary?.sourceMatchedInventoryOnly || 0);
          if (x.inventoryCount !== 2804 || x.summary?.basicReadyTotal !== expectedReady) throw new Error('bound OSM website overlay current baseline mismatch');
          if (p.retainedOsmWebsiteOverlay !== true || p.retainedOsmWebsiteOverlayExistingBindingsOnly !== true) throw new Error('bound OSM website overlay policy missing');
          if (p.retainedOsmWebsiteOverlayIdentityChanges !== 0 || p.retainedOsmWebsiteOverlayPaidApiCalls !== 0 || p.retainedOsmWebsiteOverlayGoogleDisplayPayloadUsed !== false) throw new Error('bound OSM website overlay crossed identity/API boundary');
          if (p.retainedOsmWebsiteOverlayAggregatorHostsExcluded !== true) throw new Error('bound OSM website overlay must exclude aggregators');
          if ((x.rows || []).some((row) => row.provider === 'OpenStreetMap' && (row.websites || []).some((url) => !String(url).startsWith('https://')))) throw new Error('bound OSM runtime websites must be HTTPS');
          if (s.rowsChanged > s.boundOsmRows || s.websitesAdded < s.rowsChanged) throw new Error('invalid bound OSM website overlay counts');
          console.log(JSON.stringify(s));
          NODE
      - name: Build proposal-only OSM independent source plan
        run: |
          set -euo pipefail
          node scripts/build_osm_independent_dish_source_candidate_plan.mjs \
            data/osm_independent_dish_source_candidates.json 8 | tee /tmp/osm-independent-source-plan-summary.json
          test -s data/osm_independent_dish_source_candidates.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('data/osm_independent_dish_source_candidates.json', 'utf8'));
          const p = x.policy || {};
          const s = x.summary || {};
          if (p.proposalOnly !== true || p.identityBindingChanges !== 0 || p.networkRequests !== 0) throw new Error('OSM source plan must remain proposal-only/network-free');
          if (p.paidGoogleDataApiCalls !== 0 || p.googleDisplayPayloadUsed !== false) throw new Error('OSM source plan violated zero-paid/no-Google-display policy');
          if (p.osmIdentityFieldsSerialized !== false || p.proximityOnlyBindingAllowed !== false) throw new Error('OSM identity/payload boundary failed');
          if (p.dishEvidencePromotionBeforeSourceReviewAllowed !== false || p.sourcePageReviewRequired !== true) throw new Error('OSM source/evidence boundary failed');
          if (s.catalogTotal !== 2804 || !Number.isInteger(s.publicRuntimeTotal) || s.publicRuntimeTotal < 1) throw new Error('OSM source plan current baseline mismatch');
          if (s.proposalRows > s.currentIndependentDishSourceGap || s.highConfidenceProposalRows > s.proposalRows) throw new Error('invalid OSM proposal counts');
          console.log(JSON.stringify(s));
          NODE
      - name: Strict-review high-confidence OSM website proposals
        env:
          OSM_SOURCE_REVIEW_TIMEOUT_MS: "7000"
          OSM_SOURCE_REVIEW_CONCURRENCY: "8"
        run: |
          set -euo pipefail
          node scripts/review_osm_independent_dish_source_candidates.mjs \
            data/osm_independent_dish_source_candidates.json \
            data/reviewed_osm_independent_dish_sources.json | tee /tmp/osm-independent-source-review-summary.json
          test -s data/reviewed_osm_independent_dish_sources.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('data/reviewed_osm_independent_dish_sources.json', 'utf8'));
          const p = x.policy || {};
          const s = x.summary || {};
          if (p.strictAutoOnly !== true || p.sourceOverlayOnly !== true) throw new Error('OSM strict source review policy missing');
          if (p.paidGoogleDataApiCalls !== 0 || p.googleDisplayPayloadUsed !== false) throw new Error('OSM reviewer violated zero-paid/no-Google-display policy');
          if (p.identityBindingChanges !== 0 || p.runtimeNameMutationAllowed !== false || p.runtimeCoordinateMutationAllowed !== false || p.runtimeIdentityMutationAllowed !== false) throw new Error('OSM reviewer may not mutate identity/core runtime fields');
          if (p.dishEvidenceCreatedByReview !== false || p.genericBrandHomepageAloneAccepted !== false) throw new Error('OSM reviewer crossed source/evidence boundary');
          if (p.thirdPartyAggregatorUrlsExcluded !== true || p.crossSiteRedirectAllowed !== false) throw new Error('OSM reviewer URL boundary failed');
          if (s.catalogTotal !== 2804 || !Number.isInteger(s.publicRuntimeTotal) || s.publicRuntimeTotal < 1) throw new Error('OSM reviewer current baseline mismatch');
          if (s.approvedRows > s.highConfidenceInputRows) throw new Error('OSM approved count exceeds strict input');
          for (const row of x.rows || []) {
            if (row.reviewState !== 'strict_auto' || row.candidateProvider !== 'OpenStreetMap' || !row.googlePlaceId || !Array.isArray(row.sourceWebsites) || !row.sourceWebsites.length) {
              throw new Error('invalid reviewed OSM source row');
            }
          }
          console.log(JSON.stringify(s));
          NODE
      - name: Re-check no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Commit generated OSM dataset and source recovery artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/area1_osm.js \
            data/google_basic_source_matches.json \
            data/osm_independent_dish_source_candidates.json \
            data/reviewed_osm_independent_dish_sources.json
          if git diff --cached --quiet; then
            echo "No OSM/source-recovery data changes"
            exit 0
          fi
          git commit -m "Refresh Area1 OSM source recovery data"
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
