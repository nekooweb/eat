name: Repair reviewed S7 provider policy

on:
  push:
    branches: [agent-e2e-dish-s7-20260914]
    paths: ['.github/workflows/s7-e2e-dish-once-v4.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch reviewed provider policy and regression coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          policy=Path('scripts/dish_evidence_provider_policy.mjs')
          s=policy.read_text()
          anchor="  'Tokyo Ramen of the Year'\n]);"
          replacement="  'Tokyo Ramen of the Year',\n  'Rakuten Gurunavi',\n  \"Let's Enjoy Tokyo\",\n  'Kanda Curry Grand Prix'\n]);"
          if "'Rakuten Gurunavi'" not in s:
              if anchor not in s: raise SystemExit('provider policy anchor missing')
              s=s.replace(anchor,replacement)
              policy.write_text(s)

          adapter=Path('scripts/build_reviewed_agent_dish_evidence.mjs')
          s=adapter.read_text()
          old="""      const evidenceClass = dish.classification === 'R' ? 'source_recommendation_text' :
        provider === 'Tabelog' ? 'tabelog_menu_text' : provider === 'Hot Pepper' ? 'hotpepper_menu_text' : 'source_menu_text';"""
          new="""      const evidenceClass = dish.classification === 'R' ? 'source_recommendation_text' :
        provider === 'Tabelog' ? 'tabelog_menu_text' : provider === 'Hot Pepper' ? 'hotpepper_menu_text' :
        provider === 'sourceWebsite' ? 'source_menu_text' : 'retained_source_menu_item';"""
          if new not in s:
              if old not in s: raise SystemExit('evidence class anchor missing')
              s=s.replace(old,new)
              adapter.write_text(s)

          test=Path('scripts/test_reviewed_agent_dish_evidence.mjs')
          ts=test.read_text()
          marker="const reviewedProviderPolicyS7 = await import('./dish_evidence_provider_policy.mjs');"
          if marker not in ts:
              addition="""\nconst reviewedProviderPolicyS7 = await import('./dish_evidence_provider_policy.mjs');
for (const provider of ['Rakuten Gurunavi', "Let's Enjoy Tokyo", 'Kanda Curry Grand Prix']) {
  assert.ok(reviewedProviderPolicyS7.allowedDishEvidenceProviderSet().has(provider), `Reviewed provider must be centrally allowed: ${provider}`);
}
"""
              test.write_text(ts+addition)

          wf=Path('.github/workflows/s7-e2e-dish-once-v3.yml')
          ws=wf.read_text()
          trigger='# provider-policy repair v4\n'
          if trigger not in ws:
              wf.write_text(ws+'\n'+trigger)
          PY
          node --check scripts/build_reviewed_agent_dish_evidence.mjs
          node scripts/test_reviewed_agent_dish_evidence.mjs
      - name: Commit repair, remove bootstrap workflow, and retrigger v3
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/s7-e2e-dish-once-v4.yml
          git add scripts/dish_evidence_provider_policy.mjs scripts/build_reviewed_agent_dish_evidence.mjs scripts/test_reviewed_agent_dish_evidence.mjs .github/workflows/s7-e2e-dish-once-v3.yml
          git add -u .github/workflows/s7-e2e-dish-once-v4.yml
          git commit -m 'fix: align reviewed S7 providers with evidence audit policy'
          git push origin HEAD:agent-e2e-dish-s7-20260914
