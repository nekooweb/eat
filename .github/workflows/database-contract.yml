name: Validate master database contract

on:
  push:
    branches: ["main"]
    paths:
      - "database/**"
      - "scripts/database/**"
      - "docs/database/**"
      - ".github/workflows/database-contract.yml"
      - ".gitignore"
      - "data/area1_google_ids.json"
      - "data/google_basic_source_matches.json"
      - "data/hotpepper_catalog_facts.json"
      - "data/production_area1.js"
      - "data/source_facts.js"
      - "data/source_provenance.js"
      - "data/hotpepper_rich_metadata.js"
      - "data/google_inventory_detail_evidence.json"
      - "data/source_basic_web_field_evidence.json"
      - "data/official_candidate_index.json"
      - "data/google_entities.generated.js"
      - "data/area1_osm.js"
      - "data/google_inventory_runtime.js"
      - "scripts/build_google_inventory_runtime.mjs"
  pull_request:
    paths:
      - "database/**"
      - "scripts/database/**"
      - "docs/database/**"
      - ".github/workflows/database-contract.yml"
      - ".gitignore"
      - "data/area1_google_ids.json"
      - "data/google_basic_source_matches.json"
      - "data/hotpepper_catalog_facts.json"
      - "data/production_area1.js"
      - "data/source_facts.js"
      - "data/source_provenance.js"
      - "data/hotpepper_rich_metadata.js"
      - "data/google_inventory_detail_evidence.json"
      - "data/source_basic_web_field_evidence.json"
      - "data/official_candidate_index.json"
      - "data/google_entities.generated.js"
      - "data/area1_osm.js"
      - "data/google_inventory_runtime.js"
      - "scripts/build_google_inventory_runtime.mjs"
  workflow_dispatch:

env:
  EAT_REFACTOR_MODE: "1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check database tooling syntax
        run: |
          python -m py_compile \
            docs/database/validate_schema.py \
            scripts/database/master_import_core.py \
            scripts/database/retained_phase2_core.py \
            scripts/database/retained_phase2.py \
            scripts/database/retained_official_identity.py \
            scripts/database/retained_osm_identity.py \
            scripts/database/import_source_basic_web_evidence.py \
            scripts/database/resolve_retained_fields.py \
            scripts/database/review_hotpepper_candidate_fields.py \
            scripts/database/derive_hotpepper_practical.py \
            scripts/database/resolve_master.py \
            scripts/database/plan_ingestion_tasks.py \
            scripts/database/build_master.py \
            scripts/database/validate_master.py \
            scripts/database/validate_derived_practical.py \
            scripts/database/validate_source_semantics.py \
            scripts/database/validate_official_identity.py \
            scripts/database/validate_osm_identity.py \
            scripts/database/validate_retained_field_resolver.py \
            scripts/database/validate_hotpepper_candidate_fields.py \
            scripts/database/validate_ingestion_plan.py \
            scripts/database/export_master_core.py \
            scripts/database/export_master.py \
            scripts/database/validate_export.py \
            scripts/database/compare_runtime_shadow.py \
            scripts/database/diff_runtime_shadow_fields.py
          node --check scripts/build_google_inventory_runtime.mjs

      - name: Legacy in-memory prototype contract (warning only)
        continue-on-error: true
        run: python docs/database/validate_schema.py

      - name: Build persistent SQLite master and unified task plan
        run: |
          set -euo pipefail
          mkdir -p _tmp
          python scripts/database/build_master.py --output _tmp/eat-master.sqlite --reset | tee _tmp/master-build-1.json
          python scripts/database/validate_master.py _tmp/eat-master.sqlite | tee _tmp/master-validate-1.json
          python scripts/database/validate_derived_practical.py _tmp/eat-master.sqlite | tee _tmp/derived-practical-validate-1.json
          python scripts/database/validate_source_semantics.py _tmp/eat-master.sqlite | tee _tmp/source-semantics-validate-1.json
          python scripts/database/validate_official_identity.py _tmp/eat-master.sqlite | tee _tmp/official-identity-validate-1.json
          python scripts/database/validate_osm_identity.py _tmp/eat-master.sqlite | tee _tmp/osm-identity-validate-1.json
          python scripts/database/validate_retained_field_resolver.py _tmp/eat-master.sqlite | tee _tmp/retained-field-resolver-validate-1.json
          python scripts/database/validate_hotpepper_candidate_fields.py _tmp/eat-master.sqlite | tee _tmp/hotpepper-candidate-field-validate-1.json
          python scripts/database/validate_ingestion_plan.py _tmp/eat-master.sqlite | tee _tmp/ingestion-plan-validate-1.json

      - name: Verify idempotent repeat import resolver and plan
        run: |
          set -euo pipefail
          before="$(python - <<'PY'
          import json,sqlite3
          db=sqlite3.connect('_tmp/eat-master.sqlite')
          tables=['catalog_entries','source_records','source_bindings','field_observations','field_resolutions','retained_exceptions','ingestion_tasks','ingestion_task_details']
          print(json.dumps({t:db.execute('select count(*) from '+t).fetchone()[0] for t in tables},sort_keys=True))
          PY
          )"
          python scripts/database/build_master.py --output _tmp/eat-master.sqlite | tee _tmp/master-build-2.json
          after="$(python - <<'PY'
          import json,sqlite3
          db=sqlite3.connect('_tmp/eat-master.sqlite')
          tables=['catalog_entries','source_records','source_bindings','field_observations','field_resolutions','retained_exceptions','ingestion_tasks','ingestion_task_details']
          print(json.dumps({t:db.execute('select count(*) from '+t).fetchone()[0] for t in tables},sort_keys=True))
          PY
          )"
          echo "before=${before}"
          echo "after=${after}"
          test "${before}" = "${after}"
          python scripts/database/validate_master.py _tmp/eat-master.sqlite | tee _tmp/master-validate-2.json
          python scripts/database/validate_derived_practical.py _tmp/eat-master.sqlite | tee _tmp/derived-practical-validate-2.json
          python scripts/database/validate_source_semantics.py _tmp/eat-master.sqlite | tee _tmp/source-semantics-validate-2.json
          python scripts/database/validate_official_identity.py _tmp/eat-master.sqlite | tee _tmp/official-identity-validate-2.json
          python scripts/database/validate_osm_identity.py _tmp/eat-master.sqlite | tee _tmp/osm-identity-validate-2.json
          python scripts/database/validate_retained_field_resolver.py _tmp/eat-master.sqlite | tee _tmp/retained-field-resolver-validate-2.json
          python scripts/database/validate_hotpepper_candidate_fields.py _tmp/eat-master.sqlite | tee _tmp/hotpepper-candidate-field-validate-2.json
          python scripts/database/validate_ingestion_plan.py _tmp/eat-master.sqlite | tee _tmp/ingestion-plan-validate-2.json

      - name: Verify backup and restore
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlite3
          src=sqlite3.connect('_tmp/eat-master.sqlite')
          dst=sqlite3.connect('_tmp/eat-master-backup.sqlite')
          src.backup(dst)
          assert dst.execute('pragma integrity_check').fetchone()[0] == 'ok'
          assert list(dst.execute('pragma foreign_key_check')) == []
          src.close(); dst.close()
          PY
          python scripts/database/validate_master.py _tmp/eat-master-backup.sqlite | tee _tmp/master-backup-validate.json
          python scripts/database/validate_derived_practical.py _tmp/eat-master-backup.sqlite | tee _tmp/derived-practical-backup-validate.json
          python scripts/database/validate_source_semantics.py _tmp/eat-master-backup.sqlite | tee _tmp/source-semantics-backup-validate.json
          python scripts/database/validate_official_identity.py _tmp/eat-master-backup.sqlite | tee _tmp/official-identity-backup-validate.json
          python scripts/database/validate_osm_identity.py _tmp/eat-master-backup.sqlite | tee _tmp/osm-identity-backup-validate.json
          python scripts/database/validate_retained_field_resolver.py _tmp/eat-master-backup.sqlite | tee _tmp/retained-field-resolver-backup-validate.json
          python scripts/database/validate_hotpepper_candidate_fields.py _tmp/eat-master-backup.sqlite | tee _tmp/hotpepper-candidate-field-backup-validate.json
          python scripts/database/validate_ingestion_plan.py _tmp/eat-master-backup.sqlite | tee _tmp/ingestion-plan-backup-validate.json

      - name: Generate and validate shadow exports
        run: |
          set -euo pipefail
          mkdir -p _tmp/export
          python scripts/database/export_master.py _tmp/eat-master.sqlite --outdir _tmp/export | tee _tmp/shadow-export-summary.json
          python scripts/database/validate_export.py _tmp/eat-master.sqlite _tmp/export/catalog.shadow.json _tmp/export/recommendation.shadow.json | tee _tmp/shadow-export-validate.json
          node scripts/build_google_inventory_runtime.mjs | tee _tmp/current-runtime-build.json
          python scripts/database/compare_runtime_shadow.py _tmp/eat-master.sqlite _tmp/export/recommendation.shadow.json | tee _tmp/runtime-shadow-compare.json
          python scripts/database/diff_runtime_shadow_fields.py _tmp/export/recommendation.shadow.json --output _tmp/runtime-shadow-field-diff-full.json | tee _tmp/runtime-shadow-field-diff-summary.json

      - name: Upload database smoke-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eat-master-database-smoke
          path: |
            _tmp/**/*.json
            _tmp/*.json
          if-no-files-found: warn
          retention-days: 3
