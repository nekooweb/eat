name: One-shot source-backed dish collector after independent review

on:
  push:
    branches:
      - main
    paths:
      - _ops/run-source-backed-dishes-v2-once-2026-09-08.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch source-backed dish collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-google-inventory-details.yml --repo "$GITHUB_REPOSITORY" --ref main
