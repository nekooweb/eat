name: Discover Google Area1

on:
  workflow_dispatch:
  push:
    branches: ["main", "full-collection-2804"]
    paths:
      - '.github/run-google-area1-discovery'

permissions:
  contents: write

concurrency:
  group: discover-google-area1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover exact Google Place IDs inside Area1
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAP_API }}
        run: python scripts/discover_google_area1.py
      - name: Audit exact inventory and current QC coverage
        run: node scripts/audit_area1_identity_coverage.mjs
      - name: Assert complete exact inventory before full collection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/area1_google_ids.json').read_text())
          assert p['count'] == p['aggregateExactCount']
          assert p['complete'] is True
          assert p['coverageVerified'] is True
          assert p['independentCountVerified'] is True
          assert len(set(p['googlePlaceIds'])) == p['count']
          print('exact_inventory_verified', p['count'])
          PY
      - name: Run inventory-wide identity/source reconciliation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAP_API }}
          FULL_IDENTITY_CONCURRENCY: '10'
          FULL_IDENTITY_LIMIT: '0'
          FULL_WEBSITE_CONCURRENCY: '8'
          FULL_WEBSITE_LIMIT: '0'
          FULL_REQUEST_TIMEOUT_SEC: '15'
          FULL_COLLECTION_CHECKED_AT: '2026-09-06'
        run: |
          set -o pipefail
          mkdir -p _audit
          python -m py_compile scripts/full_inventory_identity_pass.py
          python scripts/full_inventory_identity_pass.py | tee _audit/full-collection-console.log
      - name: Regenerate compact Google verification projection
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAP_API }}
          GOOGLE_VERIFY_LIMIT: '0'
        run: python scripts/verify_google_places.py
      - name: Rebuild and audit canonical data
        run: |
          set -o pipefail
          node scripts/build_production_dataset.mjs | tee _audit/build-after-reconciliation.json
          node scripts/audit_repository.mjs
          node scripts/audit_source_bindings.mjs
          node scripts/audit_normalized_fields.mjs
      - name: Re-extract current independent official pages
        env:
          OFFICIAL_INDEX_CONCURRENCY: '8'
          OFFICIAL_INDEX_TIMEOUT_MS: '12000'
          OFFICIAL_INDEX_MENU_LIMIT: '3'
        run: |
          set -o pipefail
          node scripts/extract_official_index_fields.mjs data/official_candidate_index.json _audit/full_official_field_candidates.json | tee _audit/full-official-extraction-summary.json
          AUTO_OFFICIAL_CHECKED_AT='2026-09-06' node scripts/build_auto_official_enrichment.mjs _audit/full_official_field_candidates.json data/source_enrichment_autoofficial.js | tee _audit/full-autoofficial-summary.json
      - name: Rebuild full-range ledgers and reports
        run: |
          set -o pipefail
          node scripts/build_production_dataset.mjs | tee _audit/build-after-full-collection.json
          node scripts/audit_repository.mjs
          node scripts/audit_source_bindings.mjs
          node scripts/audit_normalized_fields.mjs
          node scripts/coverage_report.mjs | tee _audit/coverage-after-full-collection.json
          node scripts/source_queue.mjs | tee _audit/source-queue-after-full-collection.json
          node scripts/build_inventory_ledger.mjs | tee _audit/inventory-ledger-after-full-collection.json
          node scripts/build_inventory_expansion_queue.mjs | tee _audit/inventory-expansion-after-full-collection.json
          node scripts/audit_area1_identity_coverage.mjs | tee _audit/identity-coverage-after-full-collection.json
      - name: Upload transient full-collection audit
        uses: actions/upload-artifact@v4
        with:
          name: full-area1-collection-audit
          path: _audit
          retention-days: 1
      - name: Commit durable full-collection results
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/area1_google_ids.json data/google_places_cache.json data/google_entities.generated.js data/official_candidate_index.json data/source_enrichment_autoofficial.js data/area1_inventory_ledger.json data/area1_inventory_expansion_queue.json data/area1_full_collection_status.json data/production_area1.js
          git diff --cached --quiet && exit 0
          git commit -m "Run full Area1 2804 collection pass"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
