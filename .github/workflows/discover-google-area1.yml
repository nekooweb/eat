name: Discover Google Area1

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/run-google-area1-discovery'

permissions:
  contents: write

concurrency:
  group: discover-google-area1
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover exact Google Place IDs inside Area1
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAP_API }}
        run: python scripts/discover_google_area1.py
      - name: Audit exact inventory and current QC coverage
        run: node scripts/audit_area1_identity_coverage.mjs
      - name: Commit ID-only discovery inventory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/area1_google_ids.json
          git diff --cached --quiet && exit 0
          git commit -m "Update exact Google Area1 Place ID inventory"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
