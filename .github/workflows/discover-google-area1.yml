name: Discover Google Area1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-google-area1
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover Google Places
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAP_API }}
        run: python scripts/discover_google_area1.py
      - name: Commit Google-first dataset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/area1_google_places.json data/area1_google.js
          git diff --cached --quiet && exit 0
          git commit -m "Update Google-first Area1 dataset"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
