name: Apply reviewed featured recommendation promotions

on:
  push:
    branches: [main]
    paths:
      - '.reviewed-featured-promotion-run'

permissions:
  contents: write

concurrency:
  group: collect-source-backed-recommended-dishes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild baseline
        run: |
          set -euo pipefail
          node scripts/audit_no_paid_apis.mjs
          python scripts/reload_data.py --public-only --outdir /tmp/reviewed-promotion-baseline
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{},console}; vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('data/google_inventory_runtime.js','utf8'),sandbox);
          const s=sandbox.window.GOOGLE_INVENTORY_STATS||{};
          fs.writeFileSync('/tmp/reviewed-promotion-before.json',JSON.stringify(s));
          console.log('REVIEWED_PROMOTION_BEFORE='+JSON.stringify({recommended:s.recommendedDishesKnown,featured:s.featuredDishesKnown,display:s.chineseDishDisplayRows,noDish:s.unfilledDishRows}));
          NODE
      - name: Build reviewed strict promotions from retained evidence
        run: |
          set -euo pipefail
          node scripts/build_reviewed_featured_recommendation_promotions.mjs /tmp/reviewed-promotions.json | tee /tmp/reviewed-promotions-build.log
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/reviewed-promotions.json','utf8'));
          if(x.policy?.networkRequests!==0||x.policy?.paidGoogleDataApiCalls!==0||x.policy?.identityMutationAllowed!==false) throw new Error('promotion source boundary failed');
          if(x.policy?.explicitRecommendationMarkerInSameSnippetRequired!==true||x.policy?.sourceNativeConcreteDishInSameSnippetRequired!==true||x.policy?.reviewedRuleWhitelistRequired!==true) throw new Error('promotion semantics weakened');
          if(x.summary?.recommendationRestaurants!==6||x.summary?.recommendationItems!==9) throw new Error(`unexpected reviewed promotion set: ${JSON.stringify(x.summary)}`);
          console.log('REVIEWED_PROMOTION_BUILD='+JSON.stringify(x.summary));
          NODE
      - name: Merge and audit promoted recommendation evidence
        run: |
          set -euo pipefail
          node scripts/merge_google_inventory_detail_evidence.mjs \
            data/google_inventory_detail_evidence.json \
            /tmp/reviewed-promotions.json \
            /tmp/reviewed-promotions-merged.json | tee /tmp/reviewed-promotions-merge.log
          cp /tmp/reviewed-promotions-merged.json data/google_inventory_detail_evidence.json
          node scripts/correct_dish_specificity_evidence.mjs \
            data/google_inventory_detail_evidence.json \
            data/google_inventory_detail_evidence.json | tee /tmp/reviewed-promotions-specificity.log
          node scripts/audit_google_inventory_detail_evidence.mjs
      - name: Rebuild and require strict recommendation growth
        run: |
          set -euo pipefail
          python scripts/reload_data.py --public-only --outdir /tmp/reviewed-promotion-after
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const before=JSON.parse(fs.readFileSync('/tmp/reviewed-promotion-before.json','utf8'));
          const built=JSON.parse(fs.readFileSync('/tmp/reviewed-promotions.json','utf8'));
          const sandbox={window:{},console}; vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('data/google_inventory_runtime.js','utf8'),sandbox);
          const after=sandbox.window.GOOGLE_INVENTORY_STATS||{};
          const delta=Number(after.recommendedDishesKnown||0)-Number(before.recommendedDishesKnown||0);
          if(delta!==Number(built.summary?.recommendationRestaurants||0)) throw new Error(`reviewed recommendation delta mismatch: ${delta}/${built.summary?.recommendationRestaurants}`);
          if(Number(after.featuredDishesKnown||0)<Number(before.featuredDishesKnown||0)||Number(after.chineseDishDisplayRows||0)<Number(before.chineseDishDisplayRows||0)) throw new Error('non-monotonic dish coverage');
          fs.writeFileSync('/tmp/reviewed-promotion-delta.json',JSON.stringify({before,after,delta},null,2)+'\n');
          console.log('REVIEWED_PROMOTION_DELTA='+JSON.stringify({recommended:delta,afterRecommended:after.recommendedDishesKnown,afterFeatured:after.featuredDishesKnown,afterDisplay:after.chineseDishDisplayRows,afterNoDish:after.unfilledDishRows}));
          NODE
          node scripts/audit_google_inventory_detail_evidence.mjs
          node scripts/audit_no_paid_apis.mjs
      - name: Commit verified promotions
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then echo 'No promotion changes'; exit 0; fi
          git commit -m 'Promote reviewed source-backed recommendations'
          if ! git diff --quiet; then git restore --worktree -- .; fi
          git fetch origin main
          git rebase origin/main
          python scripts/reload_data.py --public-only --outdir /tmp/reviewed-promotion-post-rebase
          node scripts/audit_google_inventory_detail_evidence.mjs
          node scripts/audit_no_paid_apis.mjs
          git add -A data
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-featured-recommendation-promotions
          path: |
            /tmp/reviewed-promotions.json
            /tmp/reviewed-promotion-delta.json
            /tmp/reviewed-promotions-build.log
            /tmp/reviewed-promotions-merge.log
            /tmp/reviewed-promotions-specificity.log
          if-no-files-found: ignore
          retention-days: 7
