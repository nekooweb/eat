name: One-shot optimized official PDF dish dispatcher

on:
  push:
    branches:
      - main
    paths:
      - _ops/run-official-pdf-dishes-v2-once-2026-09-08.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Replace slow PDF run with optimized bounded-concurrency pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 34221302488 --repo "$GITHUB_REPOSITORY" || true
          gh workflow run collect-official-pdf-dishes.yml --repo "$GITHUB_REPOSITORY" --ref main
