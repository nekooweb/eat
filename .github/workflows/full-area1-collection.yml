name: Recover Google inventory basics from retained audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/full-area1-collection.yml"
      - "scripts/recover_google_inventory_basic.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: recover-google-inventory-basic-legacy
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Download original Google sweep audit
        uses: actions/download-artifact@v5
        with:
          name: full-area1-collection-private-audit
          path: _private_google/initial
          github-token: ${{ github.token }}
          repository: nekooweb/eat
          run-id: 34018919233
      - name: Download retry Google sweep audit
        uses: actions/download-artifact@v5
        with:
          name: full-area1-retry-private-audit
          path: _private_google/retry
          github-token: ${{ github.token }}
          repository: nekooweb/eat
          run-id: 34019078280
      - name: Build source-backed basic matches
        run: |
          set -euo pipefail
          python3 scripts/recover_google_inventory_basic.py | tee /tmp/google-basic-summary.json
          test -s data/google_basic_source_matches.json
      - name: Validate durable output
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/google_basic_source_matches.json'))
          assert d['inventoryCount']==2804
          assert d['policy']['paidGoogleApiCalls']==0
          assert d['policy']['googleDisplayPayloadPersisted'] is False
          assert d['policy']['lowConfidenceMatchesExcluded'] is True
          ids=[r['googlePlaceId'] for r in d['rows']]
          assert len(ids)==len(set(ids))
          banned={'displayName','formattedAddress','googleName','googleAddress','googleLocation','location'}
          for r in d['rows']:
              assert not (banned & set(r))
              assert r['provider'] in {'Hot Pepper','Overture Maps','OpenStreetMap'}
              assert r['matchLevel']=='strong'
              assert r['distanceMeters'] <= 1200
          print(json.dumps(d['summary'],ensure_ascii=False))
          PY
      - name: Upload private match metrics
        uses: actions/upload-artifact@v4
        with:
          name: google-basic-recovery-private-audit
          path: _audit
          retention-days: 3
      - name: Commit durable source matches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google_basic_source_matches.json
          if git diff --cached --quiet; then
            echo "No durable match changes."
            exit 0
          fi
          git commit -m "Recover source-backed basics for Google inventory"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
