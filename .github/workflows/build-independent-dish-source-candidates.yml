name: Build independent dish source candidate plan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-dish-source-candidate-plan
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Rebuild current source runtime and queues
        run: python3 scripts/reload_data.py --public-only --outdir _audit/data-reload
      - name: Build proposal-only candidate plan
        run: |
          set -euo pipefail
          node scripts/build_independent_dish_source_candidate_plan.mjs data/independent_dish_source_candidates.json 8 | tee /tmp/independent-dish-source-candidate-summary.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('data/independent_dish_source_candidates.json', 'utf8'));
          if (x.policy?.proposalOnly !== true || x.policy?.identityBindingChanges !== 0) throw new Error('candidate plan must remain proposal-only');
          if (x.policy?.networkRequests !== 0 || x.policy?.paidGoogleDataApiCalls !== 0) throw new Error('candidate plan must remain network-free');
          if (x.policy?.proximityOnlyBindingAllowed !== false || x.policy?.dishEvidencePromotionBeforeIdentityReviewAllowed !== false) throw new Error('candidate plan identity boundary failed');
          if (x.summary?.catalogTotal !== 2804 || x.summary?.publicRuntimeTotal !== JSON.parse(fs.readFileSync('data/google_inventory_detail_queue.json', 'utf8')).summary.publicRuntimeTotal || x.summary?.shards !== 8) throw new Error('candidate plan baseline mismatch');
          console.log(JSON.stringify(x.summary));
          NODE
      - name: Commit candidate plan
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/independent_dish_source_candidates.json
          if git diff --cached --quiet; then
            echo "No candidate-plan changes."
            exit 0
          fi
          git commit -m "Update independent dish source candidate plan"
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
