name: Apply reviewed current chain recommendations

on:
  push:
    branches: [main]
    paths:
      - '.reviewed-current-chain-recommendation-run'

permissions:
  contents: write

concurrency:
  group: collect-source-backed-recommended-dishes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast syntax and policy checks
        run: |
          set -euo pipefail
          node --check scripts/build_reviewed_current_chain_recommendations.mjs
          node scripts/audit_no_paid_apis.mjs
      - name: Rebuild baseline
        run: |
          set -euo pipefail
          python scripts/reload_data.py --public-only --outdir /tmp/current-chain-baseline
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{},console};vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('data/google_inventory_runtime.js','utf8'),sandbox);
          const s=sandbox.window.GOOGLE_INVENTORY_STATS||{};
          fs.writeFileSync('/tmp/current-chain-before.json',JSON.stringify(s));
          console.log('CURRENT_CHAIN_BEFORE='+JSON.stringify({recommended:s.recommendedDishesKnown,featured:s.featuredDishesKnown,display:s.chineseDishDisplayRows,noDish:s.unfilledDishRows}));
          NODE
      - name: Build reviewed current official chain recommendations
        run: |
          set -euo pipefail
          node scripts/build_reviewed_current_chain_recommendations.mjs /tmp/current-chain-evidence.json | tee /tmp/current-chain-build.log
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/current-chain-evidence.json','utf8'));
          if(x.policy?.networkRequests!==0||x.policy?.paidGoogleDataApiCalls!==0||x.policy?.identityMutationAllowed!==false) throw new Error('current-chain batch crossed mutation boundary');
          if(x.policy?.sourceDomainMustAlreadyBeBoundToIdentity!==true||x.policy?.currentOfficialRecommendationHeadingOrPairingRequired!==true||x.policy?.automaticPromotionAllowed!==false) throw new Error('current-chain recommendation semantics weakened');
          if(x.summary?.recommendationRestaurants!==9||x.summary?.recommendationItems!==11) throw new Error(`unexpected reviewed chain batch: ${JSON.stringify(x.summary)}`);
          console.log('CURRENT_CHAIN_BUILD='+JSON.stringify(x.summary));
          NODE
      - name: Merge and audit evidence
        run: |
          set -euo pipefail
          node scripts/merge_google_inventory_detail_evidence.mjs data/google_inventory_detail_evidence.json /tmp/current-chain-evidence.json /tmp/current-chain-merged.json | tee /tmp/current-chain-merge.log
          cp /tmp/current-chain-merged.json data/google_inventory_detail_evidence.json
          node scripts/correct_dish_specificity_evidence.mjs data/google_inventory_detail_evidence.json data/google_inventory_detail_evidence.json | tee /tmp/current-chain-specificity.log
          node scripts/audit_google_inventory_detail_evidence.mjs
      - name: Rebuild and require exact recommendation growth
        run: |
          set -euo pipefail
          python scripts/reload_data.py --public-only --outdir /tmp/current-chain-after
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const before=JSON.parse(fs.readFileSync('/tmp/current-chain-before.json','utf8'));
          const sandbox={window:{},console};vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('data/google_inventory_runtime.js','utf8'),sandbox);
          const after=sandbox.window.GOOGLE_INVENTORY_STATS||{};
          const delta=Number(after.recommendedDishesKnown||0)-Number(before.recommendedDishesKnown||0);
          if(delta!==9) throw new Error(`current-chain recommendation delta mismatch: ${delta}`);
          if(Number(after.featuredDishesKnown||0)<Number(before.featuredDishesKnown||0)||Number(after.chineseDishDisplayRows||0)<Number(before.chineseDishDisplayRows||0)) throw new Error('non-monotonic dish coverage');
          fs.writeFileSync('/tmp/current-chain-delta.json',JSON.stringify({before,after,delta},null,2)+'\n');
          console.log('CURRENT_CHAIN_DELTA='+JSON.stringify({recommended:delta,afterRecommended:after.recommendedDishesKnown,afterFeatured:after.featuredDishesKnown,afterDisplay:after.chineseDishDisplayRows,afterNoDish:after.unfilledDishRows}));
          NODE
          node scripts/audit_google_inventory_detail_evidence.mjs
          node scripts/audit_no_paid_apis.mjs
      - name: Commit verified current official recommendations
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          if git diff --cached --quiet; then echo 'No current-chain changes'; exit 0; fi
          git commit -m 'Add reviewed current chain recommendations'
          if ! git diff --quiet; then git restore --worktree -- .; fi
          git fetch origin main
          git rebase origin/main
          python scripts/reload_data.py --public-only --outdir /tmp/current-chain-post-rebase
          node scripts/audit_google_inventory_detail_evidence.mjs
          node scripts/audit_no_paid_apis.mjs
          git add -A data
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-current-chain-recommendations
          path: |
            /tmp/current-chain-evidence.json
            /tmp/current-chain-delta.json
            /tmp/current-chain-build.log
            /tmp/current-chain-merge.log
            /tmp/current-chain-specificity.log
          if-no-files-found: ignore
          retention-days: 7
