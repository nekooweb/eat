name: Dispatch source-backed dish collection once

on:
  push:
    branches: ["main"]
    paths:
      - "_ops/run-source-backed-dish-cycle-once-2026-09-09.txt"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing manual collection workflow once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run collect-google-inventory-details.yml --ref main
          echo "Dispatched collect-google-inventory-details.yml once on main."
