name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Validate persisted Google inventory basics
        run: |
          set -euo pipefail
          test -s data/google_basic_source_matches.json
          python3 - <<'PY'
          import json
          d=json.load(open('data/google_basic_source_matches.json'))
          assert d['inventoryCount']==2804
          assert d['policy']['paidGoogleApiCalls']==0
          assert d['policy']['googleDisplayPayloadPersisted'] is False
          assert d['policy']['lowConfidenceMatchesExcluded'] is True
          ids=[r['googlePlaceId'] for r in d['rows']]
          assert len(ids)==len(set(ids))
          banned={'displayName','formattedAddress','googleName','googleAddress','googleLocation','location'}
          for r in d['rows']:
              assert not (banned & set(r))
              assert r['provider'] in {'Hot Pepper','Overture Maps','OpenStreetMap'}
              assert r['matchLevel']=='strong'
              assert r['distanceMeters'] <= 1200
          print(json.dumps(d['summary'],ensure_ascii=False))
          PY
      - name: Build reviewed rich-metadata core fallback
        run: |
          node scripts/build_hotpepper_rich_core_fallback.mjs
          test -s data/source_enrichment_hotpepper-richcore.js
          node --check data/source_enrichment_hotpepper-richcore.js
      - name: Build strict canonical core
        run: |
          node scripts/test_opening_hours.mjs
          node scripts/test_price_resolver.mjs
          node scripts/build_production_dataset.mjs
          node scripts/build_source_provenance.mjs
          node scripts/build_source_facts.mjs
      - name: Build exact 2804 Google inventory runtime
        run: |
          set -euo pipefail
          mkdir -p _audit
          node scripts/build_google_inventory_runtime.mjs | tee _audit/google_inventory_runtime_summary.json
          node --check data/google_inventory_runtime.js
          node scripts/audit_google_inventory_runtime.mjs | tee _audit/google_inventory_runtime_audit.json
          test -s data/google_inventory_runtime.js
      - name: Static and canonical repository checks
        run: |
          mkdir -p _audit
          set -o pipefail
          {
            node --check app.js
            node --check effects.js
            node --check data/google_inventory_runtime.js
            node --check data/hotpepper_rich_metadata.js
            node --check data/source_enrichment_hotpepper-richcore.js
            node --check data/source_provenance.js
            node --check data/source_facts.js
            node --check scripts/audit_no_paid_apis.mjs
            node --check scripts/audit_google_inventory_runtime.mjs
            node --check scripts/build_google_inventory_runtime.mjs
            node --check scripts/build_hotpepper_rich_core_fallback.mjs
            node --check scripts/build_production_dataset.mjs
            node --check scripts/build_enrichment_queue.mjs
            node --check scripts/price_resolver.mjs
            node --check scripts/audit_price_resolution.mjs
            node --check scripts/build_source_provenance.mjs
            node --check scripts/build_source_facts.mjs
            node --check scripts/audit_runtime_overlays.mjs
            node --check scripts/audit_source_bindings.mjs
            python3 -m py_compile \
              scripts/recover_google_inventory_basic.py \
              scripts/verify_google_places.py \
              scripts/verify_curated_google.py \
              scripts/discover_google_area1.py \
              scripts/migrate_google_inventory.py \
              scripts/build_area1_osm.py \
              scripts/build_overture_area1.py \
              scripts/build_open_identity_reconciliation.py \
              scripts/collect_hotpepper_area1.py \
              scripts/match_hotpepper_inventory.py \
              scripts/build_hotpepper_enrichment.py \
              scripts/build_hotpepper_rich_metadata.py \
              scripts/collect_hotpepper_rich_details.py
            test -s data/production_area1.js
            test -s data/google_inventory_runtime.js
            test -s data/hotpepper_rich_metadata.js
            test -s data/source_provenance.js
            test -s data/source_facts.js
            node scripts/audit_repository.mjs
            node scripts/audit_source_bindings.mjs
            node scripts/audit_normalized_fields.mjs
            node scripts/audit_runtime_overlays.mjs
            node scripts/audit_google_inventory_runtime.mjs
          } 2>&1 | tee _audit/static_checks.log
      - name: Coverage and dish-first enrichment queue
        run: |
          mkdir -p _audit
          set -o pipefail
          node scripts/coverage_report.mjs | tee _audit/coverage.json
          node scripts/source_queue.mjs | tee _audit/source_queue.json
          STRICT_PRICE_PROVENANCE=1 node scripts/audit_price_resolution.mjs | tee _audit/price_resolution.json
          node scripts/build_enrichment_queue.mjs | tee _audit/enrichment_queue.json
          node scripts/dish_gap_report.mjs | tee _audit/dish_gap_report.json
          node scripts/audit_area1_identity_coverage.mjs | tee _audit/area1_identity_coverage.json
          node - <<'NODE'
          const fs = require('fs');
          const q = JSON.parse(fs.readFileSync('_audit/enrichment_queue.json', 'utf8'));
          if (q.priorityQueue?.length && q.priorityQueue[0].nextAction !== 'extract_strict_recommended_menu_item') {
            throw new Error('dish-first enrichment priority is not active');
          }
          console.log(JSON.stringify({
            productionEntities: q.productionEntities,
            strictRecommendationCoverage: q.strictRecommendationCoverage,
            featuredDishCoverage: q.featuredDishCoverage,
            topActions: (q.priorityQueue || []).slice(0, 10).map((row) => row.nextAction)
          }));
          NODE
      - name: Upload private data audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eat-data-audit
          path: _audit
          if-no-files-found: warn
          retention-days: 3
      - name: Assemble public site with free Google Maps Embed
        env:
          GOOGLE_MAPS_EMBED_KEY: ${{ secrets.GOOGLE_MAP_API }}
        run: |
          set -euo pipefail
          mkdir -p _site/data _site/voice _site/image
          cp index.html styles.css effects.css app.js effects.js privacy.html terms.html _site/
          cp data/production_area1.js data/google_inventory_runtime.js data/source_provenance.js data/source_facts.js data/hotpepper_rich_metadata.js _site/data/
          cp voice/*.mp3 _site/voice/
          cp image/*.webp _site/image/
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('_site/index.html')
          text = path.read_text(encoding='utf-8')
          key = os.environ.get('GOOGLE_MAPS_EMBED_KEY', '').strip()
          if key:
              text = text.replace('__GOOGLE_MAPS_EMBED_KEY__', key)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Upload build for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: eat-site-review
          path: _site
          retention-days: 3
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
