name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical production dataset
        run: node scripts/build_production_dataset.mjs
      - name: Static and repository checks
        run: |
          node --check app.js
          python3 -m py_compile \
            scripts/verify_google_places.py \
            scripts/verify_curated_google.py \
            scripts/discover_google_area1.py \
            scripts/migrate_google_inventory.py \
            scripts/build_area1_osm.py
          test -s data/production_area1.js
          node scripts/audit_repository.mjs
          node scripts/audit_source_bindings.mjs
      - name: Coverage report
        run: |
          node scripts/coverage_report.mjs
          node scripts/source_queue.mjs
      - name: Assemble public site
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js privacy.html terms.html _site/
          cp data/production_area1.js _site/data/
      - name: Upload build for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: eat-site-review
          path: _site
          retention-days: 3
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
