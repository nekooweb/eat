name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical production dataset
        run: node scripts/build_production_dataset.mjs
      - name: Static and repository checks
        run: |
          mkdir -p _audit
          set -o pipefail
          {
            node --check app.js
            node --check effects.js
            python3 -m py_compile \
              scripts/verify_google_places.py \
              scripts/verify_curated_google.py \
              scripts/discover_google_area1.py \
              scripts/migrate_google_inventory.py \
              scripts/build_area1_osm.py
            test -s data/production_area1.js
            node scripts/audit_repository.mjs
            node scripts/audit_source_bindings.mjs
            node scripts/audit_normalized_fields.mjs
          } 2>&1 | tee _audit/static_checks.log
      - name: Coverage report
        run: |
          mkdir -p _audit
          node scripts/coverage_report.mjs | tee _audit/coverage.json
          node scripts/source_queue.mjs | tee _audit/source_queue.json
          node scripts/build_enrichment_queue.mjs | tee _audit/enrichment_queue.json
          node scripts/audit_area1_identity_coverage.mjs | tee _audit/area1_identity_coverage.json
      - name: Upload private data audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eat-data-audit
          path: _audit
          if-no-files-found: warn
          retention-days: 3
      - name: Assemble public site
        env:
          GOOGLE_MAPS_EMBED_KEY: ${{ secrets.GOOGLE_MAP_API }}
        run: |
          mkdir -p _site/data _site/voice _site/image
          cp index.html styles.css effects.css app.js effects.js privacy.html terms.html _site/
          cp data/production_area1.js _site/data/
          cp voice/1.mp3 voice/2.mp3 _site/voice/
          cp image/YahaUsagi.webp _site/image/
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('_site/index.html')
          text = path.read_text(encoding='utf-8')
          key = os.environ.get('GOOGLE_MAPS_EMBED_KEY', '').strip()
          if key:
              text = text.replace('__GOOGLE_MAPS_EMBED_KEY__', key)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Upload build for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: eat-site-review
          path: _site
          retention-days: 3
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
