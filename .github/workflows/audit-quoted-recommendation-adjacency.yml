name: Audit quoted recommendation adjacency

on:
  push:
    branches: [main]
    paths:
      - '.quoted-recommendation-adjacency-run'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '34372222834'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce zero-paid policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Download adjacency audit artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nekooweb/eat
          run-id: ${{ env.SOURCE_RUN_ID }}
          name: recommendation-marker-adjacency
          path: /tmp/adjacency
      - name: Extract quoted/title candidates beside strong recommendation markers
        run: |
          set -euo pipefail
          node scripts/audit_quoted_recommendation_adjacency.mjs \
            /tmp/adjacency/recommendation-adjacency.json \
            /tmp/quoted-adjacency.json | tee /tmp/quoted-adjacency.log
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/quoted-adjacency.json','utf8'));
          if(x.policy?.auditOnly!==true||x.policy?.networkRequests!==0||x.policy?.paidGoogleDataApiCalls!==0||x.policy?.automaticPromotionAllowed!==false) throw new Error('quoted adjacency audit boundary failed');
          console.log('QUOTED_ADJACENCY_SUMMARY='+JSON.stringify(x.summary));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: quoted-recommendation-adjacency
          path: |
            /tmp/quoted-adjacency.json
            /tmp/quoted-adjacency.log
          retention-days: 7
