name: PR Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and audit when canonical builder is present
        run: |
          node --check app.js
          if [ -f scripts/build_production_dataset.mjs ]; then
            node scripts/test_opening_hours.mjs
            python3 scripts/reload_data.py --public-only --outdir _audit/pr-reload
            node scripts/test_dish_translation_gap_regression.mjs
            node scripts/test_detail_evidence_retention.mjs
            node scripts/test_runtime_catalog_contract.mjs
            node scripts/test_reviewed_current_chain_updater.mjs
            node scripts/test_dish_evidence_provider_policy.mjs
            node scripts/test_official_menu_domain_policy.mjs
            node scripts/test_tool_identity_name_contract.mjs
            node scripts/test_source_field_quarantine.mjs
            node scripts/test_independent_source_candidate_hardening.mjs
            node --check scripts/independent_source_host_policy.mjs
            node --check scripts/sanitize_independent_source_candidate_plan.mjs
            node --check scripts/audit_independent_source_host_policy.mjs
            node --check scripts/test_independent_source_host_policy.mjs
            node --check scripts/review_independent_dish_source_candidates_v4.mjs
            node --check scripts/test_independent_source_reviewer_v4.mjs
            node --check scripts/audit_dish_overlay_production_attachment.mjs
            node --check scripts/audit_recommendation_source_provenance.mjs
            node scripts/test_independent_source_host_policy.mjs
            node scripts/test_independent_source_reviewer_v4.mjs
            node scripts/sanitize_independent_source_candidate_plan.mjs \
              data/independent_dish_source_candidates.json \
              /tmp/pr-independent-source-candidates.sanitized.json
            node scripts/audit_independent_source_host_policy.mjs /tmp/pr-independent-source-candidates.sanitized.json
            node scripts/audit_independent_source_host_policy.mjs data/reviewed_independent_dish_sources.json
            node scripts/audit_dish_overlay_production_attachment.mjs
            node scripts/audit_recommendation_source_provenance.mjs
            node scripts/audit_repository.mjs
            node scripts/audit_normalized_fields.mjs
          fi

      - name: Public UI simplification regression
        run: node --test scripts/test_public_ui_simplification.mjs
