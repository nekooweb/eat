# Rebuilds from the latest maximum non-image rich-detail audit; this workflow makes no Hot Pepper API request.
name: Promote Hot Pepper rich metadata

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-hotpepper-rich-metadata
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs

      - name: Build current production seed
        run: node scripts/build_production_dataset.mjs

      - name: Download latest maximum rich-detail audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _hotpepper _audit
          mkdir -p _hotpepper _audit
          gh run download 34035124635 \
            --repo nekooweb/eat \
            -n hotpepper-rich-refresh-audit \
            -D _hotpepper
          test -s _hotpepper/hotpepper_rich_details.json
          test -s data/hotpepper_bindings.json
          test -s data/hotpepper_manual_rich_bindings.json

      - name: Build rich metadata overlay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_hotpepper_rich_metadata.py \
            data/hotpepper_bindings.json \
            _hotpepper/hotpepper_rich_details.json \
            data/hotpepper_rich_metadata.js \
            data/hotpepper_manual_rich_bindings.json \
            | tee _audit/hotpepper_rich_metadata_summary.json
          test -s data/hotpepper_rich_metadata.js
          node --check data/hotpepper_rich_metadata.js

      - name: Build source provenance for overlay audit
        run: node scripts/build_source_provenance.mjs

      - name: Validate runtime overlays
        run: node scripts/audit_runtime_overlays.mjs | tee _audit/runtime_overlay_validation.json

      - name: Commit rich metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hotpepper_rich_metadata.js
          if git diff --cached --quiet; then
            echo "No rich metadata changes to commit."
            exit 0
          fi
          git commit -m "Preserve maximum reviewed Hot Pepper rich metadata"
          git push

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotpepper-rich-metadata-audit
          path: _audit
          if-no-files-found: warn
          retention-days: 3
