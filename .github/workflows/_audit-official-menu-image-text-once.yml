name: Audit reviewed official menu image text once

on:
  push:
    branches: ["main"]
    paths:
      - "_ops/audit-official-menu-image-text-once-2026-09-09.txt"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce zero-paid policy and syntax
        run: |
          node scripts/audit_no_paid_apis.mjs
          node --check scripts/collect_official_menu_image_text_evidence.mjs
      - name: Collect accessible image text from reviewed official menu URLs
        env:
          OFFICIAL_MENU_IMAGE_TEXT_TIMEOUT_MS: '12000'
          OFFICIAL_MENU_IMAGE_TEXT_WORKERS: '12'
        run: |
          set -euo pipefail
          node scripts/collect_official_menu_image_text_evidence.mjs /tmp/menu-image-text-evidence.json | tee /tmp/menu-image-text-summary.txt
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/menu-image-text-evidence.json','utf8'));
          if(x.policy?.ocrExecuted!==false||x.policy?.paidGoogleDataApiCalls!==0||x.policy?.reviewedOfficialMenuUrlsOnly!==true) throw new Error('image-text source boundary failed');
          if((x.rows||[]).some(r=>(r.recommendedDishes||[]).length)) throw new Error('image text may not create recommended dishes');
          console.log('MENU_IMAGE_TEXT_AUDIT='+JSON.stringify({summary:x.summary,samples:(x.rows||[]).slice(0,12)}));
          NODE
      - name: Upload evidence audit
        uses: actions/upload-artifact@v4
        with:
          name: official-menu-image-text-audit
          path: /tmp/menu-image-text-evidence.json
          retention-days: 7
