name: Dispatch hardened weak-source review once

on:
  push:
    branches: ["main"]
    paths:
      - "_ops/run-hardened-weak-source-review-once-2026-09-09.txt"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing manual weak-source review once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run review-weak-nearby-independent-sources.yml \
            -R nekooweb/eat \
            --ref main
          echo "Dispatched hardened review-weak-nearby-independent-sources.yml once on main."
