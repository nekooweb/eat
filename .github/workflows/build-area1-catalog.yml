name: Build Area1 full catalog

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-area1-catalog.yml"
      - "scripts/build_area1_catalog.mjs"
      - "scripts/apply_catalog_admission_state.mjs"
      - "scripts/build_catalog_enrichment_queue.mjs"
      - "scripts/apply_queue_admission_state.mjs"
      - "scripts/audit_loaded_hotpepper_lunch_candidates.mjs"
      - "scripts/audit_multisource_admission_candidates.mjs"
      - "scripts/audit_unparsed_source_hours.mjs"
      - "scripts/build_production_dataset.mjs"
      - "scripts/build_source_provenance.mjs"
      - "scripts/build_source_facts.mjs"
      - "data/catalog_admissions.json"
      - "data/area1_google_ids.json"
      - "data/area1_full_collection_queue.json"
      - "data/hotpepper_bindings.json"
      - "data/hotpepper_catalog_facts.json"
      - "data/hotpepper_rich_metadata.js"
      - "data/overture_area1_candidates.json"
      - "data/open_identity_reconciliation.json"
      - "data/source_enrichment*.js"
      - "data/source_resolution*.js"
      - "data/featured_dishes.js"
      - "data/recommended_dishes.js"
      - "data/google_entities*.js"
      - "data/area1_*.js"

permissions:
  contents: write

concurrency:
  group: build-area1-catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Rebuild canonical and overlays
        run: |
          set -euo pipefail
          node scripts/build_production_dataset.mjs
          node scripts/build_source_provenance.mjs
          node scripts/build_source_facts.mjs
          node --check data/hotpepper_rich_metadata.js
      - name: Build full catalog and queue
        run: |
          set -euo pipefail
          node scripts/build_area1_catalog.mjs | tee /tmp/area1_catalog_summary.json
          test -s data/area1_catalog.json
          node scripts/apply_catalog_admission_state.mjs | tee /tmp/area1_admission_state_summary.json
          node scripts/build_catalog_enrichment_queue.mjs | tee /tmp/area1_enrichment_queue_summary.json
          node scripts/apply_queue_admission_state.mjs | tee /tmp/area1_queue_admission_state_summary.json
          test -s data/area1_enrichment_queue.json
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const x=require('./data/area1_catalog.json');
          const q=require('./data/area1_enrichment_queue.json');
          const sandbox={window:{}};
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('data/production_area1.js','utf8'),sandbox);
          const p=sandbox.window.PRODUCTION_STATS;
          if(!p) throw new Error('missing production stats');
          if(x.summary.identityUniverse!==2807) throw new Error('unexpected identity universe '+x.summary.identityUniverse);
          if(x.summary.frozenInventory!==2804) throw new Error('unexpected frozen inventory '+x.summary.frozenInventory);
          if(x.summary.production!==p.productionEntities) throw new Error(`catalog/production mismatch ${x.summary.production}/${p.productionEntities}`);
          if(p.legacyVerifiedEntities!==656) throw new Error('legacy verified identity count changed unexpectedly: '+p.legacyVerifiedEntities);
          if(p.catalogReviewedEntities!==6) throw new Error('unexpected catalog reviewed production count '+p.catalogReviewedEntities);
          if(x.summary.production!==662) throw new Error('unexpected production '+x.summary.production);
          if(x.summary.productionInFrozenInventory!==659) throw new Error('unexpected production-in-inventory '+x.summary.productionInFrozenInventory);
          if(x.summary.productionOutsideFrozenInventory!==3) throw new Error('unexpected current-only production '+x.summary.productionOutsideFrozenInventory);
          if(x.summary.inventoryOnly!==2145) throw new Error('unexpected inventory-only count '+x.summary.inventoryOnly);
          if(x.summary.hotpepperCatalogFactRows!==535) throw new Error('unexpected Hot Pepper catalog fact count '+x.summary.hotpepperCatalogFactRows);
          if(x.summary.productionHotpepperCatalogFacts!==147) throw new Error('unexpected production Hot Pepper fact count '+x.summary.productionHotpepperCatalogFacts);
          if(x.summary.inventoryOnlyHotpepperCatalogFacts!==388) throw new Error('unexpected inventory-only Hot Pepper fact count '+x.summary.inventoryOnlyHotpepperCatalogFacts);
          if(x.summary.reviewedAdmissionReady!==0) throw new Error('reviewed admissions should already be in production: '+x.summary.reviewedAdmissionReady);
          if(x.summary.admittedProduction!==6) throw new Error('unexpected admitted production count '+x.summary.admittedProduction);
          if(x.summary.rejectedAdmissionPairs!==4) throw new Error('unexpected rejected admission count '+x.summary.rejectedAdmissionPairs);
          if(x.summary.overtureCrossSupportedRows!==1997) throw new Error('unexpected Overture cross-support rows '+x.summary.overtureCrossSupportedRows);
          if(q.summary.identityUniverse!==2807 || q.summary.production!==662 || q.summary.inventoryOnly!==2145) throw new Error('queue/catalog universe mismatch');
          if(q.summary.inventoryAdmissionReady!==0) throw new Error('admission-ready identities should already be production: '+q.summary.inventoryAdmissionReady);
          if(q.summary.admittedProduction!==6) throw new Error('unexpected admitted-production queue count '+q.summary.admittedProduction);
          if(q.summary.inventoryRejectedPairHold!==4) throw new Error('unexpected rejected-pair queue count '+q.summary.inventoryRejectedPairHold);
          const expectedMissing={
            cuisine:p.productionEntities-p.cuisineKnown,
            lunchBudget:p.productionEntities-p.lunchBudgetKnown,
            dinnerBudget:p.productionEntities-p.dinnerBudgetKnown,
            openingHours:p.productionEntities-p.openingHoursKnown,
            publicSourceEvidence:p.productionEntities-p.usableSourceBacked
          };
          for(const [field,value] of Object.entries(expectedMissing)) {
            if(x.summary.productionMissing[field]!==value) throw new Error(`catalog ${field} gap mismatch ${x.summary.productionMissing[field]}/${value}`);
          }
          console.log(JSON.stringify({production:p,catalog:x.summary,queue:q.summary},null,2));
          NODE
      - name: Audit unparsed maintained opening hours
        run: node scripts/audit_unparsed_source_hours.mjs | tee /tmp/unparsed_source_hours.json
      - name: Audit loaded strict Hot Pepper lunch candidates
        run: node scripts/audit_loaded_hotpepper_lunch_candidates.mjs | tee /tmp/hotpepper_lunch_candidates.json
      - name: Audit multisource admission candidates
        run: node scripts/audit_multisource_admission_candidates.mjs | tee /tmp/multisource_admission_candidates.json
      - name: Commit catalog and queue
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/area1_catalog.json data/area1_enrichment_queue.json
          if git diff --cached --quiet; then
            echo "No catalog/queue changes to commit."
            exit 0
          fi
          git commit -m "Build full Area1 catalog and enrichment queue"
          git push
