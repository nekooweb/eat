name: Enrich fields from retained official pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/official-index-web-field-enrichment.yml"
      - "scripts/database/collect_official_index_web_fields.py"
      - "scripts/database/import_source_basic_web_evidence.py"
      - "scripts/database/merge_public_web_field_evidence.py"
      - "scripts/database/reconcile_private_official_web_consensus_v4.py"
      - "data/official_candidate_index.json"
      - "data/source_basic_web_field_evidence.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-web-field-evidence
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Build baseline master
        run: |
          set -euo pipefail
          mkdir -p _tmp
          python -m py_compile \
            scripts/database/collect_official_index_web_fields.py \
            scripts/database/import_source_basic_web_evidence.py \
            scripts/database/merge_public_web_field_evidence.py \
            scripts/database/reconcile_private_official_web_consensus_v4.py
          python scripts/database/build_master.py --output _tmp/eat-master-before.sqlite --reset | tee _tmp/master-before.json
          python scripts/database/validate_master.py _tmp/eat-master-before.sqlite | tee _tmp/master-before-validate.json
          python - <<'PY'
          import json
          m=json.load(open('_tmp/master-before.json'))
          p=m['ingestionPlan']
          s={'fieldTasks':p['taskTypeCounts']['field_completion'],'missing':p['fieldCompletionMissingCounts']}
          json.dump(s,open('_tmp/field-before.json','w'),sort_keys=True)
          print(json.dumps(s,sort_keys=True))
          PY
      - name: Collect current official-page fields
        run: |
          set -euo pipefail
          python scripts/database/collect_official_index_web_fields.py \
            --database _tmp/eat-master-before.sqlite \
            --output _tmp/official-index-web-field-incoming.json \
            --workers 8 \
            --max-pages 250 \
            | tee _tmp/official-index-web-field-collection.json
      - name: Validate incoming evidence
        run: |
          python - <<'PY'
          import json,re
          d=json.load(open('_tmp/official-index-web-field-incoming.json'))
          assert d['ruleVersion']=='source-basic-web-field-evidence-v1'
          p=d['policy']
          assert p['paidDataApiCalls']==0
          assert p['googleDisplayPayloadPersisted'] is False
          assert p['sourceBackedIdentityRequired'] is True
          assert p['rawHtmlPersisted'] is False
          assert p['robotsRespected'] is True
          ids=[]
          for row in d['rows']:
            ids.append(row['googlePlaceId'])
            assert row['sourceProvider']=='official'
            check=row['identityCheck']
            assert check['accepted'] is True
            assert check['identityRule']=='retained_verified_official_page'
            assert check['retainedOfficialBindingReviewed'] is True
            assert check['pageNameMatchMethod'] in {'jsonld_business_name','strong_page_title'}
            ev=row['webEvidence']
            assert str(ev['sourceUrl']).startswith('https://')
            assert str(ev['finalUrl']).startswith('https://')
            assert re.fullmatch(r'[0-9a-f]{64}',str(ev['contentHash']))
            assert ev['parserVersion']=='official-web-jsonld-v1'
            assert ev['rawHtmlPersisted'] is False
            assert row['fieldClaims']
          assert len(ids)==len(set(ids))
          print(json.dumps({'rows':len(ids),'fieldCounts':d['summary']['fieldCounts'],'fetchCounts':d['summary']['fetchCounts']},ensure_ascii=False,sort_keys=True))
          PY
      - name: Merge and validate master effect
        run: |
          set -euo pipefail
          cp data/source_basic_web_field_evidence.json _tmp/web-evidence-before.json
          python scripts/database/merge_public_web_field_evidence.py \
            data/source_basic_web_field_evidence.json \
            _tmp/official-index-web-field-incoming.json \
            data/source_basic_web_field_evidence.json \
            | tee _tmp/official-index-working-merge.json
          python scripts/database/build_master.py --output _tmp/eat-master-after.sqlite --reset | tee _tmp/master-after.json
          python scripts/database/validate_master.py _tmp/eat-master-after.sqlite | tee _tmp/master-after-validate.json
          node scripts/build_google_inventory_runtime.mjs | tee _tmp/runtime-after-official-fields.json
          node scripts/audit_google_inventory_runtime.mjs | tee _tmp/runtime-after-official-fields-audit.json
          python - <<'PY'
          import json
          before=json.load(open('_tmp/field-before.json'))
          m=json.load(open('_tmp/master-after.json'))
          p=m['ingestionPlan']
          after={'fieldTasks':p['taskTypeCounts']['field_completion'],'missing':p['fieldCompletionMissingCounts']}
          # Same identity baseline: public official facts can only remove field gaps.
          assert after['fieldTasks'] <= before['fieldTasks'], (before,after)
          for key,value in before['missing'].items():
            assert after['missing'].get(key,0) <= value, (key,before,after)
          json.dump(after,open('_tmp/field-after.json','w'),sort_keys=True)
          print(json.dumps({'before':before,'after':after},sort_keys=True))
          PY
      - name: Commit official-page evidence on latest main
        run: |
          set -euo pipefail
          git restore -- data/google_inventory_runtime.js data/source_basic_web_field_evidence.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B official-web-fields origin/main
          python scripts/database/merge_public_web_field_evidence.py \
            data/source_basic_web_field_evidence.json \
            _tmp/official-index-web-field-incoming.json \
            data/source_basic_web_field_evidence.json \
            | tee _tmp/official-index-latest-merge.json
          git add data/source_basic_web_field_evidence.json
          if git diff --cached --quiet; then
            echo "No new retained-official public web field evidence on latest main."
            exit 0
          fi
          git commit -m "Add retained official-page field evidence"
          git push origin HEAD:main
      - name: Upload official field audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-index-web-field-enrichment
          path: |
            _tmp/official-index-web-field-incoming.json
            _tmp/official-index-web-field-collection.json
            _tmp/official-index-working-merge.json
            _tmp/official-index-latest-merge.json
            _tmp/field-before.json
            _tmp/field-after.json
            _tmp/master-before.json
            _tmp/master-before-validate.json
            _tmp/master-after.json
            _tmp/master-after-validate.json
            _tmp/runtime-after-official-fields.json
            _tmp/runtime-after-official-fields-audit.json
          if-no-files-found: warn
          retention-days: 2
