name: One-shot weak nearby source review dispatcher

on:
  push:
    branches:
      - main
    paths:
      - _ops/run-weak-nearby-source-review-once-2026-09-08.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch weak-nearby strict source review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run review-weak-nearby-independent-sources.yml --repo "$GITHUB_REPOSITORY" --ref main
