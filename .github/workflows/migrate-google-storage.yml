name: Migrate Google Storage

on:
  push:
    branches: ["main"]
    paths:
      - '.github/run-google-storage-migration'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract cacheable Place ID inventory
        run: python scripts/migrate_google_inventory.py
      - name: Remove legacy stored Google content
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/area1_google_ids.json
          git rm -f data/area1_google_places.json data/area1_google.js
          git diff --cached --quiet && exit 0
          git commit -m "Migrate Google discovery storage to Place IDs only"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
