name: One-shot v3 independent source review dispatcher

on:
  push:
    branches:
      - main
    paths:
      - _ops/run-independent-review-v3-once-2026-09-08.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v3 independent source review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run review-independent-dish-sources.yml --repo "$GITHUB_REPOSITORY" --ref main
