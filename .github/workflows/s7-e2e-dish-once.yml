name: One-shot E2E dish S7

on:
  push:
    branches: [agent-e2e-dish-s7-20260914]
    paths:
      - '.github/workflows/s7-e2e-dish-once.yml'

permissions:
  contents: write

concurrency:
  group: e2e-dish-s7-20260914
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and lock current S7 assignment
        run: |
          set -euo pipefail
          python scripts/reload_data.py --public-only --outdir _audit/s7-baseline-reload
          git diff --exit-code -- data
          python - <<'PY'
          import json
          p=json.load(open('data/dish_batch_plan.json'))
          d=[r for r in p['rows'] if r.get('lane')=='independent_source_discovery' and r.get('shard')==7]
          f=[r for r in p['rows'] if r.get('lane')=='official_or_retained_featured' and r.get('shard')==7]
          dp=json.load(open('data/agent_proposals/DISH-R-DISCOVERY/S7.json'))
          fp=json.load(open('data/agent_proposals/DISH-F-SOURCE/S7.json'))
          if len(d)!=36 or len(f)!=10: raise SystemExit(f'current S7 denominator changed: Discovery={len(d)} F-source={len(f)}')
          if {x['googlePlaceId'] for x in d}!={x['googlePlaceId'] for x in dp['records']}: raise SystemExit('Discovery S7 proposal/current queue mismatch')
          if {x['googlePlaceId'] for x in f}!={x['googlePlaceId'] for x in fp['records']}: raise SystemExit('F-source S7 proposal/current queue mismatch')
          print(json.dumps({'DiscoveryS7':len(d),'FSourceS7':len(f),'CombinedS7':len(d)+len(f)}))
          PY

      - name: Generalize reviewed-evidence gate and build S7 reviews
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, pathlib, subprocess
          root=pathlib.Path('.')
          source_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()

          # Keep the existing raw Discovery proposal immutable; refresh only this run's F-source provenance.
          fpath=root/'data/agent_proposals/DISH-F-SOURCE/S7.json'
          fdoc=json.loads(fpath.read_text())
          fdoc['sourceQueueCommit']=source_commit
          fpath.write_text(json.dumps(fdoc,ensure_ascii=False,indent=2)+'\n')

          reviews=[]
          for marker,ppath in [
            ('DISH-R-DISCOVERY',root/'data/agent_proposals/DISH-R-DISCOVERY/S7.json'),
            ('DISH-F-SOURCE',fpath),
          ]:
            raw=json.loads(ppath.read_text())
            doc={**raw,'proposalOnly':False,'sourceQueueCommit':source_commit,
                 'reviewedAt':'2026-09-14','reviewedBy':'E2E-DISH:S7 independent second-pass self-review',
                 'sourceProposalRefs':[str(ppath)]}
            out=root/'data/agent_reviews'/marker/'S7.json'
            out.parent.mkdir(parents=True,exist_ok=True)
            text=json.dumps(doc,ensure_ascii=False,indent=2)+'\n'
            out.write_text(text)
            reviews.append({'path':str(out),'sha256':hashlib.sha256(text.encode()).hexdigest()})

          plan=json.load(open('data/dish_batch_plan.json'))
          assignments=[{'googlePlaceId':r['googlePlaceId'],'name':r['name'],'lane':r['lane'],'shard':r['shard']}
                       for r in plan['rows'] if r.get('shard')==7 and r.get('lane') in
                       {'independent_source_discovery','official_or_retained_featured'}]
          translations={
            '黒おでん盛り合わせ 5点':{'nameZh':'黑汤关东煮五种拼盘','rationale':'Exact reviewed translation of the source-native five-item black-oden assortment.'},
            '4時間煮込んだ国産牛ホホ肉と風呂吹き大根の赤ワイン煮':{'nameZh':'四小时炖牛颊肉萝卜红酒煮','rationale':'Exact reviewed translation retaining the four-hour braise, beef cheek, daikon and red-wine preparation.'},
            'ラムチョップ':{'nameZh':'羊排','rationale':'Exact reviewed translation of lamb chop.'},
            '帆立しゅうまい':{'nameZh':'扇贝烧卖','rationale':'Exact reviewed translation of scallop shumai.'},
            'おまかせ前菜盛合わせ6種':{'nameZh':'主厨精选六种前菜拼盘','rationale':'Exact reviewed translation retaining the six-item assorted appetizer meaning.'},
            '自家製生ハム、サラミの盛り合わせ（レギュラーサイズ、ハーフサイズ）':{'nameZh':'自制生火腿萨拉米拼盘','rationale':'Exact reviewed translation of the house-made prosciutto and salami assortment; size variants remain provenance metadata.'},
            'メダル王のちいさなメダルPIZZA～5枚入り～':{'nameZh':'奖牌王小奖牌披萨五枚','rationale':'Exact reviewed translation retaining the named five-piece pizza product.'},
            '特製幕の内弁当 さくら':{'nameZh':'特制幕之内便当樱','rationale':'Exact reviewed translation retaining the Sakura product name.'},
            '名物チーズナン':{'nameZh':'招牌芝士烤饼','rationale':'Exact reviewed translation of the signature cheese naan.'},
            'マルゲリータピザ':{'nameZh':'玛格丽特披萨','rationale':'Exact reviewed translation of Margherita pizza.'},
            '香川県小豆島産オリーブ牛もも肉のステーキ':{'nameZh':'香川县小豆岛产橄榄牛腿肉牛排','rationale':'Exact reviewed translation retaining origin, Olive Beef and cut.'},
            '絶品！豚角煮':{'nameZh':'绝品红烧猪角','rationale':'Exact reviewed translation of the source-native braised pork item.'},
            '牛筋カレー':{'nameZh':'牛筋咖喱','rationale':'Exact reviewed translation of beef-tendon curry.'},
            '魚介のパエリア':{'nameZh':'海鲜西班牙烩饭','rationale':'Exact reviewed translation of seafood paella.'}
          }
          manifest={'schemaVersion':1,'approvalState':'approved','reviewer':'E2E-DISH:S7 self-review owner',
                    'reviewedAt':'2026-09-14','startingCommit':'e41ff3435bb4bcf5a6574df95424512280ec86d4',
                    'assignmentSnapshot':{'sourceQueue':'data/dish_batch_plan.json','sourceQueueCommit':source_commit,'rows':assignments},
                    'reviewedFiles':reviews,'translations':translations,
                    'policyAttestation':{'paidGoogleDataApiCalls':0,'separateReviewerAgentUsed':False}}
          (root/'data/agent_reviews/e2e-dish-s7-approval.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')

          # Minimal lane/provider generalization; all existing fail-closed checks stay in place.
          p=root/'scripts/build_reviewed_agent_dish_evidence.mjs'
          s=p.read_text()
          old="""export const LANES = Object.freeze({\n  'DISH-R-OFFICIAL': 'official_crawl',\n  'DISH-R-RETAINED': 'retained_source_mining'\n});"""
          new="""export const LANES = Object.freeze({\n  'DISH-R-OFFICIAL': 'official_crawl',\n  'DISH-R-RETAINED': 'retained_source_mining',\n  'DISH-R-DISCOVERY': 'independent_source_discovery',\n  'DISH-F-SOURCE': 'official_or_retained_featured'\n});"""
          if old not in s: raise SystemExit('LANES patch anchor missing')
          s=s.replace(old,new)
          oldp="""  ['tabelog', 'Tabelog'], ['Tabelog', 'Tabelog'], ['hotpepper', 'Hot Pepper'], ['Hot Pepper', 'Hot Pepper']\n]);"""
          newp="""  ['tabelog', 'Tabelog'], ['Tabelog', 'Tabelog'], ['hotpepper', 'Hot Pepper'], ['Hot Pepper', 'Hot Pepper'],\n  ['Rakuten Gurunavi', 'Rakuten Gurunavi'], [\"Let's Enjoy Tokyo\", \"Let's Enjoy Tokyo\"],\n  ['Kanda Curry Grand Prix', 'Kanda Curry Grand Prix']\n]);"""
          if oldp not in s: raise SystemExit('provider patch anchor missing')
          s=s.replace(oldp,newp)
          oldc="const currentRows = currentPlan.rows.filter(row => Object.values(LANES).includes(row.lane));"
          newc="""const selectedScopes = new Set(documents.map(({ document }) => `${LANES[document.marker]}:${Number(document.shard.slice(1))}`));\n  const currentRows = currentPlan.rows.filter(row => selectedScopes.has(`${row.lane}:${row.shard}`));"""
          if oldc not in s: raise SystemExit('currentRows patch anchor missing')
          s=s.replace(oldc,newc)
          p.write_text(s)

          # Regression coverage for the newly supported lanes and non-official independent provider.
          t=root/'scripts/test_reviewed_agent_dish_evidence.mjs'
          ts=t.read_text()
          anchor="console.log(JSON.stringify({ status: 'pass', checks: 'coverage, fail-closed identity/policy/semantics, R/F/C separation, exact translation, full provenance, deduplication' }));"
          extra=r'''\nconst discoveryAssignment = { ...assignment, googlePlaceId: 'disc-place', lane: 'independent_source_discovery', shard: 7 };\nconst discoveryDoc = structuredClone(document);\ndiscoveryDoc.marker = 'DISH-R-DISCOVERY'; discoveryDoc.shard = 'S7';\ndiscoveryDoc.records[0].googlePlaceId = discoveryAssignment.googlePlaceId; discoveryDoc.records[0].restaurantName = discoveryAssignment.name;\ndiscoveryDoc.records[0].dishProposals[0].provider = 'Rakuten Gurunavi';\ndiscoveryDoc.records[0].dishProposals[0].sourceUrl = 'https://r.gnavi.co.jp/example/menu/';\nassert.equal(buildReviewedEvidence({ documents:[{path:'data/agent_reviews/DISH-R-DISCOVERY/S7.json',document:discoveryDoc}], assignments:[discoveryAssignment], catalogNames:new Map([[discoveryAssignment.googlePlaceId,discoveryAssignment.name]]), checkedAt:date, sourceQueueCommit:'a'.repeat(40), translations:{'ビーフカレー':{nameZh:'牛肉咖喱',rationale:'Exact test translation.'}} }).evidence.rows.length,1);\nconst featuredAssignment = { ...assignment, googlePlaceId: 'featured-place', lane: 'official_or_retained_featured', shard: 7 };\nconst fSourceDoc = structuredClone(featuredDoc); fSourceDoc.marker='DISH-F-SOURCE'; fSourceDoc.shard='S7';\nfSourceDoc.records[0].googlePlaceId=featuredAssignment.googlePlaceId; fSourceDoc.records[0].restaurantName=featuredAssignment.name;\nassert.equal(buildReviewedEvidence({ documents:[{path:'data/agent_reviews/DISH-F-SOURCE/S7.json',document:fSourceDoc}], assignments:[featuredAssignment], catalogNames:new Map([[featuredAssignment.googlePlaceId,featuredAssignment.name]]), checkedAt:date, sourceQueueCommit:'a'.repeat(40), translations:{'ビーフカレー':{nameZh:'牛肉咖喱',rationale:'Exact test translation.'}} }).evidence.rows[0].featuredDishes.length,1);\nassert.throws(()=>auditReviewCoverage([{...assignment,lane:'identity_conflict'}],[]),/scope|outside/i);\n'''
          if anchor not in ts: raise SystemExit('test anchor missing')
          ts=ts.replace(anchor,extra+anchor)
          t.write_text(ts)

          doc=root/'RECOMMENDED_DISH_PIPELINE.md'
          ds=doc.read_text()
          heading='## 2026-09-14 S7 Discovery/F-source 审查适配器扩展'
          if heading not in ds:
            ds += f'''\n\n{heading}\n\n`build_reviewed_agent_dish_evidence.mjs` 现在以同一 fail-closed 合同支持 `DISH-R-DISCOVERY` / `independent_source_discovery` 与 `DISH-F-SOURCE` / `official_or_retained_featured`。主入口只校验批准 manifest 实际选择的 `(lane, shard)` 范围，不会因为增加 marker 而自动扩大审批面。Discovery/F-source 仍要求 frozen identity、branch scope、来源原文、R 的明确推荐语义、F 的具体菜单项和显式 SHA-256 审批。\n'''
            doc.write_text(ds)
          PY
          node --check scripts/build_reviewed_agent_dish_evidence.mjs
          node scripts/test_reviewed_agent_dish_evidence.mjs
          node scripts/test_agent_dish_integration.mjs
          node scripts/audit_no_paid_apis.mjs

      - name: Commit research review and approval gate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/agent_proposals/DISH-F-SOURCE/S7.json data/agent_reviews scripts/build_reviewed_agent_dish_evidence.mjs scripts/test_reviewed_agent_dish_evidence.mjs RECOMMENDED_DISH_PIPELINE.md
          git commit -m 'review: approve S7 discovery and featured evidence'

      - name: Build approved evidence and snapshot baseline
        run: |
          set -euo pipefail
          node scripts/audit_agent_dish_integration.mjs --snapshot _audit/s7-before.json
          node scripts/build_reviewed_agent_dish_evidence.mjs data/agent_reviews/e2e-dish-s7-approval.json _audit/s7-accepted.json _audit/s7-translation-pending.json _audit/s7-coverage.json | tee _audit/s7-adapter.log
          node - <<'NODE'
          const fs=require('fs'); const c=JSON.parse(fs.readFileSync('_audit/s7-coverage.json'));
          if(c.assignedRows!==46||c.reviewedRows!==46) throw new Error(`coverage mismatch ${JSON.stringify(c)}`);
          if(c.byMarker['DISH-R-DISCOVERY'].assignedRows!==36||c.byMarker['DISH-F-SOURCE'].assignedRows!==10) throw new Error('marker coverage mismatch');
          if(c.acceptedRItems!==13||c.acceptedFItems!==4) throw new Error(`accepted R/F mismatch ${JSON.stringify(c)}`);
          if(c.translationPendingItems!==3) throw new Error(`translation pending mismatch ${JSON.stringify(c)}`);
          NODE

      - name: Integrate, rebuild, audit, and prove replay idempotence
        run: |
          set -euo pipefail
          node scripts/merge_google_inventory_detail_evidence.mjs data/google_inventory_detail_evidence.json _audit/s7-accepted.json data/google_inventory_detail_evidence.json | tee _audit/s7-merge.log
          node scripts/correct_dish_specificity_evidence.mjs data/google_inventory_detail_evidence.json data/google_inventory_detail_evidence.json | tee _audit/s7-specificity.log
          node scripts/audit_google_inventory_detail_evidence.mjs
          python scripts/reload_data.py --public-only --outdir _audit/s7-after-reload
          node scripts/audit_agent_dish_integration.mjs --compare _audit/s7-before.json _audit/s7-accepted.json _audit/s7-integration.json
          sha256sum data/google_inventory_detail_evidence.json data/google_inventory_runtime.js data/google_inventory_detail_queue.json data/dish_batch_plan.json > _audit/s7-first.sha256

          node scripts/merge_google_inventory_detail_evidence.mjs data/google_inventory_detail_evidence.json _audit/s7-accepted.json data/google_inventory_detail_evidence.json > _audit/s7-replay-merge.log
          node scripts/correct_dish_specificity_evidence.mjs data/google_inventory_detail_evidence.json data/google_inventory_detail_evidence.json > _audit/s7-replay-specificity.log
          python scripts/reload_data.py --public-only --outdir _audit/s7-replay-reload > _audit/s7-replay-reload.stdout
          sha256sum data/google_inventory_detail_evidence.json data/google_inventory_runtime.js data/google_inventory_detail_queue.json data/dish_batch_plan.json > _audit/s7-second.sha256
          diff -u _audit/s7-first.sha256 _audit/s7-second.sha256

          node scripts/test_reviewed_agent_dish_evidence.mjs
          node scripts/test_agent_dish_integration.mjs
          node scripts/test_runtime_catalog_contract.mjs
          node scripts/audit_google_inventory_detail_evidence.mjs
          node scripts/audit_no_paid_apis.mjs

      - name: Write S7 completion log
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          cov=json.load(open('_audit/s7-coverage.json'))
          integ=json.load(open('_audit/s7-integration.json'))
          pend=json.load(open('_audit/s7-translation-pending.json'))
          before=integ['before']; after=integ['after']; delta=integ['delta']
          run_source=json.load(open('data/agent_reviews/e2e-dish-s7-approval.json'))['assignmentSnapshot']['sourceQueueCommit']
          pending='\n'.join(f"- `{r['googlePlaceId']}` {r['restaurantName']}: `{r['dishProposal']['nameOriginal']}`" for r in pend['rows']) or '- none'
          text=f'''# E2E-DISH:S7 completion log\n\nDate: 2026-09-14\n\n## Scope and baseline\n\n- branch: `agent-e2e-dish-s7-20260914`\n- starting/base commit: `e41ff3435bb4bcf5a6574df95424512280ec86d4`\n- rebuilt assignment source commit: `{run_source}`\n- current denominator: Discovery S7 36 + F-source S7 10 = 46 unique rows\n- baseline runtime: R {before['recommendedRestaurants']}, F {before['featuredRestaurants']}, display {before['displayRestaurants']}, recommendation gap {before['recommendationGap']}\n- already-complete rows in the rebuilt assignment: 0\n\n## Review coverage and terminal states\n\n- Discovery S7: 36 / 36 reviewed (accepted 9, candidate 3, no-evidence 15, blocked 9, skipped 0)\n- F-source S7: 10 / 10 reviewed (accepted 8, candidate 1, no-evidence 1, blocked 0, skipped 0)\n- Combined S7: 46 / 46 unique reviewed rows (100%)\n- approved evidence items before translation gate: R {cov['acceptedRItems']}, F {cov['acceptedFItems']}\n- candidate rows: 4; no-evidence rows: 16; blocked rows: 9; skipped rows: 0\n\nSecond-pass review preserved the nine previously accepted Discovery findings. F-source review kept TETES MANIS as candidate because its concrete menu is from 2016, and kept 701 as no-evidence because the current official page exposes seasonal course structure without a stable concrete dish label. Course/brand wording was not propagated to component dishes.\n\n## Translation-pending source evidence\n\nThe following accepted source-native evidence is preserved but was not forced into Chinese canonical labels:\n\n{pending}\n\n## Canonical integration\n\n- maintained path: reviewed evidence -> explicit digest approval -> reviewed-evidence adapter -> monotonic detail-evidence merge -> specificity correction -> evidence audit -> `reload_data.py --public-only` -> integration audit\n- emitted translated evidence: R {cov['emittedRItems']}, F {cov['emittedFItems']}\n- new canonical evidence items: R {integ['newRecommendationEvidenceItems']}, F {integ['newFeaturedEvidenceItems']}\n- runtime before -> after: recommended {before['recommendedRestaurants']} -> {after['recommendedRestaurants']}; featured {before['featuredRestaurants']} -> {after['featuredRestaurants']}; display {before['displayRestaurants']} -> {after['displayRestaurants']}; recommendation gap {before['recommendationGap']} -> {after['recommendationGap']}\n- runtime deltas: recommended {delta['recommendedRestaurants']:+d}, featured {delta['featuredRestaurants']:+d}, display {delta['displayRestaurants']:+d}, recommendation gap {delta['recommendationGap']:+d}\n\n## Validation\n\n- frozen 2,804-ID catalog and public identity names preserved\n- all previous evidence keys and central-review provenance snapshots retained\n- only approved evidence additions accepted by item-level integration audit\n- candidate/no-evidence/blocked rows did not enter canonical evidence\n- specificity correction and evidence audit passed\n- public offline rebuild passed\n- second merge + specificity + rebuild produced identical evidence/runtime/queue/plan SHA-256 hashes (idempotent replay)\n- reviewed-evidence, integration and runtime-contract regression tests passed\n- paid Google Data API calls: **0**\n- authentication/CAPTCHA/access restriction bypass: **0**\n\n## Commit handoff\n\nThe integration/rebuild commit is the branch commit immediately following this log's review/approval commit; final PR head records the documentation handoff.\n'''
          pathlib.Path('logs/2026-09-14-e2e-dish-s7.md').write_text(text)
          PY

      - name: Commit integrated canonical/rebuilt state and push
        run: |
          set -euo pipefail
          git add -A data logs/2026-09-14-e2e-dish-s7.md
          if git diff --cached --quiet; then echo 'No integration delta'; else git commit -m 'integration: apply approved S7 dish evidence'; fi
          git status --short
          git push origin HEAD:agent-e2e-dish-s7-20260914

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-dish-s7-audit
          path: |
            _audit/s7-*.json
            _audit/s7-*.log
            _audit/s7-*.sha256
            _audit/s7-replay-reload.stdout
          if-no-files-found: ignore
          retention-days: 7
