name: Build full Area1 enrichment matrix

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-full-enrichment-matrix.yml"

permissions:
  contents: write

concurrency:
  group: build-full-enrichment-matrix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce no-paid-data-API policy
        run: node scripts/audit_no_paid_apis.mjs
      - name: Build canonical and overlays
        run: |
          set -euo pipefail
          node scripts/build_production_dataset.mjs
          node scripts/build_source_provenance.mjs
          node scripts/build_source_facts.mjs
      - name: Build full enrichment matrix
        run: |
          set -euo pipefail
          node scripts/build_full_enrichment_matrix.mjs | tee /tmp/full-matrix-summary.json
          test -s data/area1_enrichment_matrix.json
          node -e "const x=require('./data/area1_enrichment_matrix.json'); if(x.productionEntities!==656||x.records.length!==656) process.exit(1)"
      - name: Commit matrix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/area1_enrichment_matrix.json
          if git diff --cached --quiet; then
            echo "No matrix changes to commit."
            exit 0
          fi
          git commit -m "Build full 656-restaurant enrichment matrix"
          git push
