name: Extract official restaurant fields

on:
  push:
    branches: ["reuse-google-api-and-batch-enrichment"]
    paths:
      - 'scripts/extract_official_fields.mjs'
      - 'data/source_enrichment*.js'
      - '.github/workflows/extract-official-fields.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical production dataset
        run: node scripts/build_production_dataset.mjs
      - name: Extract official-source field candidates
        env:
          OFFICIAL_FETCH_CONCURRENCY: '4'
          OFFICIAL_FETCH_TIMEOUT_MS: '15000'
        run: |
          mkdir -p _audit
          node scripts/extract_official_fields.mjs _audit/official_extraction_candidates.json | tee _audit/official_extraction_summary.json
      - name: Upload extraction review artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-extraction-review
          path: _audit
          retention-days: 3
