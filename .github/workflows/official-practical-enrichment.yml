name: Enrich explicit practical fields from retained official pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/official-practical-enrichment.yml"
      - "scripts/database/collect_official_practical_fields.py"
      - "scripts/database/collect_official_detail_practical_fields.py"
      - "scripts/database/import_official_practical_web_evidence.py"
      - "scripts/database/import_official_practical_detail_web_evidence.py"
      - "scripts/database/build_master.py"
      - "data/official_candidate_index.json"
      - "data/official_practical_web_evidence.json"
      - "data/official_practical_detail_web_evidence.json"

permissions:
  contents: write

concurrency:
  group: public-web-field-evidence
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate syntax and no-paid policy
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/database/collect_official_practical_fields.py \
            scripts/database/collect_official_detail_practical_fields.py \
            scripts/database/import_official_practical_web_evidence.py \
            scripts/database/import_official_practical_detail_web_evidence.py \
            scripts/database/build_master.py
          node scripts/audit_no_paid_apis.mjs

      - name: Build baseline master
        run: |
          set -euo pipefail
          mkdir -p _tmp
          python scripts/database/build_master.py --output _tmp/eat-master-before.sqlite --reset | tee _tmp/master-before.json
          python scripts/database/validate_master.py _tmp/eat-master-before.sqlite | tee _tmp/master-before-validate.json
          python - <<'PY'
          import json
          m=json.load(open('_tmp/master-before.json')); p=m['ingestionPlan']
          s={'identityStates':m['identityStates'],'fieldTasks':p['taskTypeCounts']['field_completion'],'missing':p['fieldCompletionMissingCounts']}
          json.dump(s,open('_tmp/practical-before.json','w'),sort_keys=True); print(json.dumps(s,sort_keys=True))
          PY

      - name: Collect official landing practical labels
        run: |
          set -euo pipefail
          python scripts/database/collect_official_practical_fields.py \
            --database _tmp/eat-master-before.sqlite \
            --output _tmp/official-practical-incoming.json --workers 6 --max-pages 250 \
            | tee _tmp/official-practical-collection.json

      - name: Collect same-origin detail practical labels
        run: |
          set -euo pipefail
          python scripts/database/collect_official_detail_practical_fields.py \
            --database _tmp/eat-master-before.sqlite \
            --output _tmp/official-practical-detail-incoming.json --workers 6 --max-restaurants 250 \
            | tee _tmp/official-practical-detail-collection.json

      - name: Merge incoming evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          def merge(path, incoming, detail=False):
              base=json.load(open(path)); inc=json.load(open(incoming)); assert base['ruleVersion']==inc['ruleVersion']=='official-practical-web-evidence-v1'
              def key(r):
                  if not detail: return r['googlePlaceId']
                  e=r.get('webEvidence') or {}; return (r['googlePlaceId'],e.get('finalUrl') or e.get('sourceUrl'),e.get('contentHash'))
              rows={key(r):r for r in base.get('rows',[])}
              for r in inc.get('rows',[]): rows[key(r)]=r
              out=dict(base); out['checkedAt']=inc.get('checkedAt') or base.get('checkedAt'); out['rows']=[rows[k] for k in sorted(rows,key=str)]
              counts={}
              for r in out['rows']:
                  for f in (r.get('practicalClaims') or {}): counts[f]=counts.get(f,0)+1
              out['summary']={'rows':len(out['rows']),'fieldCounts':dict(sorted(counts.items()))}
              Path(path).write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              return {'beforeRows':len(base.get('rows',[])),'incomingRows':len(inc.get('rows',[])),'afterRows':len(out['rows']),'fieldCounts':out['summary']['fieldCounts']}
          result={'landing':merge('data/official_practical_web_evidence.json','_tmp/official-practical-incoming.json'), 'detail':merge('data/official_practical_detail_web_evidence.json','_tmp/official-practical-detail-incoming.json',True)}
          json.dump(result,open('_tmp/official-practical-merge.json','w'),sort_keys=True); print(json.dumps(result,sort_keys=True))
          PY

      - name: Validate master effect
        run: |
          set -euo pipefail
          python scripts/database/build_master.py --output _tmp/eat-master-after.sqlite --reset | tee _tmp/master-after.json
          python scripts/database/validate_master.py _tmp/eat-master-after.sqlite | tee _tmp/master-after-validate.json
          python scripts/database/validate_ingestion_plan.py _tmp/eat-master-after.sqlite | tee _tmp/ingestion-plan-after.json
          python - <<'PY'
          import json
          before=json.load(open('_tmp/practical-before.json')); m=json.load(open('_tmp/master-after.json')); p=m['ingestionPlan']
          after={'identityStates':m['identityStates'],'fieldTasks':p['taskTypeCounts']['field_completion'],'missing':p['fieldCompletionMissingCounts'],'landingImport':m['officialPracticalWebEvidence'],'detailImport':m['officialPracticalDetailWebEvidence']}
          assert after['identityStates']==before['identityStates']; assert after['fieldTasks']<=before['fieldTasks']
          for k,v in before['missing'].items(): assert after['missing'].get(k,0)<=v,(k,before,after)
          for name in ('landingImport','detailImport'):
              assert after[name]['networkRequests']==0 and after[name]['identityChanges']==0 and after[name]['importTimeMissingOnly'] is True
          json.dump(after,open('_tmp/practical-after.json','w'),sort_keys=True); print(json.dumps({'before':before,'after':after},sort_keys=True))
          PY

      - name: Commit evidence on latest main
        run: |
          set -euo pipefail
          cp data/official_practical_web_evidence.json _tmp/landing-working.json
          cp data/official_practical_detail_web_evidence.json _tmp/detail-working.json
          git restore -- data/official_practical_web_evidence.json data/official_practical_detail_web_evidence.json
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main; git checkout -B official-practical origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          def merge(path,incoming,detail=False):
              base=json.load(open(path)); inc=json.load(open(incoming))
              def key(r):
                  if not detail: return r['googlePlaceId']
                  e=r.get('webEvidence') or {}; return (r['googlePlaceId'],e.get('finalUrl') or e.get('sourceUrl'),e.get('contentHash'))
              rows={key(r):r for r in base.get('rows',[])}
              for r in inc.get('rows',[]): rows[key(r)]=r
              out=dict(base); out['checkedAt']=inc.get('checkedAt') or base.get('checkedAt'); out['rows']=[rows[k] for k in sorted(rows,key=str)]
              counts={}
              for r in out['rows']:
                  for f in (r.get('practicalClaims') or {}): counts[f]=counts.get(f,0)+1
              out['summary']={'rows':len(out['rows']),'fieldCounts':dict(sorted(counts.items()))}; Path(path).write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          merge('data/official_practical_web_evidence.json','_tmp/official-practical-incoming.json')
          merge('data/official_practical_detail_web_evidence.json','_tmp/official-practical-detail-incoming.json',True)
          PY
            git add data/official_practical_web_evidence.json data/official_practical_detail_web_evidence.json
            if git diff --cached --quiet; then echo "No new explicit official practical evidence."; exit 0; fi
            git commit -m "Add official practical landing and detail evidence"
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1; sleep 2
          done
          echo "Unable to fast-forward practical evidence after three attempts." >&2; exit 1

      - name: Upload practical audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-practical-enrichment
          path: |
            _tmp/official-practical-incoming.json
            _tmp/official-practical-detail-incoming.json
            _tmp/official-practical-collection.json
            _tmp/official-practical-detail-collection.json
            _tmp/official-practical-merge.json
            _tmp/practical-before.json
            _tmp/practical-after.json
            _tmp/master-before.json
            _tmp/master-before-validate.json
            _tmp/master-after.json
            _tmp/master-after-validate.json
            _tmp/ingestion-plan-after.json
          if-no-files-found: warn
          retention-days: 2
